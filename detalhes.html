<script>

<script>
var A="https://graphql.anilist.co";
var J="https://api.jikan.moe/v4";
var TM="https://api.themoviedb.org/3";
var TK="8265bd1679663a7ea12ac168da84d2e8";
var TI="https://image.tmdb.org/t/p/";
var TR="https://api.mymemory.translated.net/get";
var P=new URLSearchParams(
location.search+(location.hash||"")
.replace(/^#/,"&"));
var G={
Action:"Acao",Adventure:"Aventura",
Comedy:"Comedia",Drama:"Drama",
Fantasy:"Fantasia",Romance:"Romance",
"Sci-Fi":"Ficcao cientifica",
Supernatural:"Sobrenatural",
Mystery:"Misterio",Horror:"Terror",
Sports:"Esporte",
"Slice of Life":"Slice of Life",
School:"Vida escolar"
};
var R=["","I","II","III","IV","V",
"VI","VII","VIII","IX","X"];
var DUB=[
"tensei shitara slime",
"reincarnated as a slime",
"solo leveling","jujutsu kaisen",
"kimetsu no yaiba","demon slayer",
"spy x family","one piece","naruto",
"dragon ball","shingeki no kyojin",
"attack on titan","frieren","dandadan",
"kaiju no 8","oshi no ko","chainsaw man",
"my hero academia","boku no hero"
];
var BL=[
{l:"BLEACH S1 Inicio",a:1,b:63},
{l:"BLEACH S2 Bount",a:64,b:109},
{l:"BLEACH S3 Arrancar 1",a:110,b:189},
{l:"BLEACH S4 Arrancar 2",a:190,b:265},
{l:"BLEACH S5 Queda",a:266,b:316},
{l:"BLEACH S6 Final",a:317,b:366}
];
var aid=null,cur=null,temps=[],ta=null;
var ord="antigos",like=0,bell=0,syn=0;
var ttm=null,cache={},epsA=[],epsN=20;
function esc(v){
return String(v||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");
}
function lim(v){
return String(v||"").toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.replace(/[^a-z0-9\s']/g," ")
.replace(/\s+/g," ").trim();
}
function wait(ms){
return new Promise(function(o){
setTimeout(o,ms);
});
}
function race(p,ms){
return Promise.race([p,new Promise(
function(_,j){
setTimeout(function(){
j(new Error("t"));
},ms||12000);
})]);
}
function idade(it){
var g=lim((it.genres||[]).join(" "));
if(/horror|terror/.test(g))return "16";
if(/action|acao/.test(g))return "14";
return "12";
}
function ck(){
return "playnime_comentarios_"+String(aid||"");
}
function rc(){
try{
var x=JSON.parse(localStorage.getItem(ck())||"[]");
return Array.isArray(x)?x:[];
}catch(e){return []}
}
function sc(l){
localStorage.setItem(ck(),JSON.stringify(l));
}
function rf(){
try{
var d=JSON.parse(
localStorage.getItem("playnime_favoritos")||"[]"
);
return Array.isArray(d)?d:[];
}catch(e){return []}
}
function sf(f){
localStorage.setItem(
"playnime_favoritos",JSON.stringify(f)
);
}
function isf(){
return !!(cur&&rf().some(function(a){
return String(a&&a.id)===String(cur.id);
}));
}
function fmt(n){
n=Number(n)||0;
if(n>=1000){
return (n/1000).toFixed(1)
.replace(/\.0$/,"")+"k";
}
return String(n);
}
function toast(m){
document.getElementById("tt").textContent=m;
document.getElementById("ts")
.classList.add("show");
clearTimeout(ttm);
ttm=setTimeout(function(){
document.getElementById("ts")
.classList.remove("show");
},2200);
}
function err(m){
return '<div class="pe">'+esc(m)+
'<div><button class="rb2" type="button" '+
'onclick="go()">Tentar de novo</button>'+
"</div></div>";
}
function vh(){
if(history.length>1)history.back();
else location.href="home.html";
}
function pid(){
var a=P.get("mal")||P.get("id")||
P.get("anilist")||P.get("aid");
if(a&&String(a).trim())return String(a).trim();
try{
return sessionStorage.getItem("playnime_ultimo")||
localStorage.getItem("playnime_ultimo")||"";
}catch(e){return ""}
}
function nf(n){
return String(n||"")
.replace(/\s*[:\-]\s*(season|temporada)\s*\d+.*$/i,"")
.replace(/\s+(season|temporada)\s*\d+.*$/i,"")
.replace(/\s+\d+$/,"").trim();
}
function sn(n){
var t=String(n||"");
var m=t.match(/(?:season|temporada)\s*(\d+)/i);
if(m)return +m[1];
if(/\biii\b/i.test(t))return 3;
if(/\bii\b/i.test(t)&&!/\biii\b/i.test(t))return 2;
return 0;
}
function hero(it){
return it.tmdbBackdrop||it.banner||
it.backdrop_path||it.poster||
it.poster_path||"";
}
function lab(){
return (ta&&ta.chip)||"BLEACH S1 Inicio";
}
function img(p,s){
if(!p)return "";
var x=String(p);
if(/^https?:\/\//i.test(x))return x;
return TI+(s||"w300")+x;
}
function pt(t){
return /(nao|voce|mundo|como um|historia)/
.test(lim(t));
}
async function tmdb(p,l){
var j=p.indexOf("?")>=0?"&":"?";
var r=await race(fetch(
TM+p+j+"api_key="+TK+
"&language="+(l||"en-US")
),12000);
if(!r.ok)throw 0;
return r.json();
}
async function gql(q,v){
var r=await race(fetch(A,{
method:"POST",
headers:{
"Content-Type":"application/json",
Accept:"application/json"
},
body:JSON.stringify({query:q,variables:v||{}})
}),12000);
if(!r.ok)throw 0;
var j=await r.json();
if(!j||j.errors||!j.data)throw 0;
return j.data;
}
async function jk(p){
var r=await race(fetch(J+p),12000);
if(!r.ok)throw 0;
return r.json();
}
async function tr(t){
t=String(t||"").trim();
if(!t||pt(t))return t;
try{
var r=await race(fetch(
TR+"?q="+encodeURIComponent(t.slice(0,450))+
"&langpair=en|pt-BR"
),8000);
var j=await r.json();
return (j&&j.responseData&&
j.responseData.translatedText)||t;
}catch(e){return t}
}
var QM="id idMal isAdult bannerImage "+
"description(asHtml:false) episodes duration "+
"format seasonYear genres "+
"coverImage{extraLarge large} "+
"title{romaji english native} startDate{year}";
async function alM(id){
var d=await gql(
"query($mal:Int){Media(idMal:$mal,type:ANIME){"+
QM+"}}",{mal:+id}
);
if(!d.Media)throw 0;
return d.Media;
}
async function alI(id){
var d=await gql(
"query($id:Int){Media(id:$id,type:ANIME){"+
QM+"}}",{id:+id}
);
if(!d.Media)throw 0;
return d.Media;
}
async function alT(){
var d=await gql(
"query{Page(page:1,perPage:8){media("+
"type:ANIME,sort:TRENDING_DESC,isAdult:false){"+
QM+"}}}"
);
var l=(d.Page&&d.Page.media)||[];
var o=l.find(function(m){return m&&!m.isAdult});
if(!o)throw 0;
return o;
}
 function dAL(m){
var t=(m.title&&(m.title.english||
m.title.romaji||m.title.native))||"Anime";
var p=(m.coverImage&&(m.coverImage.extraLarge||
m.coverImage.large))||"";
return {
id:m.idMal||m.id,
anilist:m.id,
name:t,
original_name:(m.title&&
(m.title.romaji||m.title.native))||t,
poster_path:p,
backdrop_path:m.bannerImage||p,
genres:m.genres||[],
synopsis:String(m.description||"")
.replace(/<[^>]+>/g," ")
.replace(/\s+/g," ").trim(),
banner:m.bannerImage||"",
poster:p,
episodes:m.episodes||0,
duration:m.duration||24,
year:m.seasonYear||
(m.startDate&&m.startDate.year)||"",
adult:!!m.isAdult
};
}
function dJK(a){
var t=(a.title_english&&
String(a.title_english).trim())||
a.title||"Anime";
var p=(a.images&&a.images.jpg&&
(a.images.jpg.large_image_url||
a.images.jpg.image_url))||"";
return {
id:a.mal_id,
anilist:null,
name:t,
original_name:a.title||t,
poster_path:p,
backdrop_path:p,
genres:(a.genres||[]).map(function(g){
return g.name;
}),
synopsis:a.synopsis||"",
banner:"",
poster:p,
episodes:a.episodes||0,
duration:parseInt(a.duration,10)||24,
year:a.year||"",
adult:String(a.rating||"")
.toLowerCase().indexOf("rx")>=0
};
}
function firstOk(ps){
return new Promise(function(ok,no){
var n=ps.length,last=0;
if(!n){no(0);return}
ps.forEach(function(p){
Promise.resolve(p).then(ok,function(e){
last=e;
if(--n===0)no(last);
});
});
});
}
async function getA(id){
var n=+id;
if(!n)return dAL(await alT());
try{
return await firstOk([
alM(n).then(dAL),
alI(n).then(dAL),
jk("/anime/"+n+"/full").then(function(j){
return dJK(j&&j.data);
})
]);
}catch(e){
return dAL(await alT());
}
}
function pick(rows){
return rows.find(function(x){
return (x.genre_ids||[]).indexOf(16)>=0&&
String((x.origin_country&&
x.origin_country[0])||"")==="JP";
})||rows.find(function(x){
return (x.genre_ids||[]).indexOf(16)>=0;
})||rows[0]||null;
}
async function addTM(it){
try{
var full=String(it.name||
it.original_name||"").trim();
var qs=[full,nf(full)].filter(Boolean);
var sh=null;
for(var i=0;i<qs.length&&!sh;i++){
var s=await tmdb("/search/tv?query="+
encodeURIComponent(qs[i]));
sh=pick((s&&s.results)||[]);
}
if(!sh)return it;
var info=await tmdb("/tv/"+sh.id);
var br=await tmdb("/tv/"+sh.id,"pt-BR");
var bd=info.backdrop_path||
sh.backdrop_path||"";
it.tmdbId=sh.id;
it.tmdbName=info.name||sh.name||it.name;
it.tmdbBackdrop=bd?img(bd,"w1280"):"";
it.tmdbPoster=info.poster_path?
img(info.poster_path,"w300"):"";
it.tmdbSeasons=(info.seasons||[]).slice();
if(info.first_air_date){
it.year=String(info.first_air_date).slice(0,4);
}
if(br&&br.overview)it.synopsis=br.overview;
return it;
}catch(e){return it}
}
function nb(it){
return lim((it.name||"")+" "+
(it.original_name||"")+" "+
(it.tmdbName||""));
}
function isBL(it){
var n=nb(it);
if(/thousand|sennen|guerra/.test(n))return 0;
return it.tmdbId==30984||
n.indexOf("bleach")>=0;
}
function hasD(it){
if(isBL(it))return 0;
var n=nb(it);
return DUB.some(function(x){
return n.indexOf(x)>=0;
});
}
function itm(l,c,d,s,f,g){
return {
label:l,chip:c||l,dublado:!!d,
tmdbSeason:s,filtro:f||null,global:!!g
};
