<!DOCTYPE html>
<html lang="pt">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>PlayNime - Detalhes</title>

<style>

/* =====================================================
   BASE
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    background:#050505;
}

body{
    background:#050505;
    color:#fff;
    font-family:Arial, Helvetica, sans-serif;
    min-height:100vh;
    overflow-x:hidden;
}

/* =====================================================
   VARIÁVEIS PLAYNIME
===================================================== */

:root{
    --roxo:#a855f7;
    --roxo-claro:#c084fc;
    --fundo:#050505;
    --card:#111111;
    --texto:#ffffff;
    --texto-sec:#a1a1aa;
    --borda:#242424;
    --vermelho:#ff304f;
}

/* =====================================================
   TOPO
===================================================== */

.topbar{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:75px;
    z-index:20;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 20px;

    background:transparent;
}

.top-left{
    display:flex;
    align-items:center;
    gap:15px;
}

.back-btn{
    width:45px;
    height:45px;

    border:none;
    background:rgba(0,0,0,.35);

    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    cursor:pointer;
}

.back-btn svg{
    width:27px;
    height:27px;
}

.logo-mini{
    font-size:25px;
    font-weight:800;
    letter-spacing:-1px;
}

.logo-mini .play{
    color:#fff;
}

.logo-mini .nime{
    color:var(--roxo);
}

/* =====================================================
   HERO
===================================================== */

.hero{
    position:relative;
    width:100%;
    min-height:560px;

    background:#090909;

    overflow:hidden;
}

/*
   A imagem é colocada diretamente.
   Não usamos gradiente preto.
*/

.hero-bg{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    opacity:1;

    filter:none;

    z-index:0;
}

/* Pequena proteção nas bordas,
   sem criar aquele gradiente preto pesado */

.hero-top-fade{
    position:absolute;
    top:0;
    left:0;
    right:0;

    height:90px;

    background:rgba(0,0,0,.12);

    z-index:1;

    pointer-events:none;
}

.hero-content{
    position:relative;
    z-index:3;

    min-height:560px;

    display:flex;
    flex-direction:column;
    justify-content:flex-end;

    padding:0 24px 38px;
}

/* =====================================================
   POSTER
===================================================== */

.poster{
    width:130px;
    height:190px;

    object-fit:cover;

    border-radius:14px;

    box-shadow:
        0 12px 35px rgba(0,0,0,.65);

    margin-bottom:22px;
}

/* =====================================================
   TÍTULO
===================================================== */

.anime-title{
    font-size:35px;
    line-height:1.08;

    font-weight:800;

    max-width:850px;

    margin-bottom:14px;

    text-shadow:
        0 2px 8px rgba(0,0,0,.45);
}

/* =====================================================
   META
===================================================== */

.meta{
    display:flex;
    align-items:center;
    flex-wrap:wrap;

    gap:14px;

    margin-bottom:17px;

    font-size:17px;
}

.rating{
    display:flex;
    align-items:center;
    gap:6px;

    color:#ffd84d;

    font-weight:700;
}

.star{
    font-size:21px;
}

.year{
    color:#fff;
    font-weight:600;
}

/* =====================================================
   GÉNEROS
===================================================== */

.genres{
    display:flex;
    flex-wrap:wrap;

    gap:9px;

    margin-bottom:24px;
}

.genre{
    padding:9px 15px;

    border-radius:30px;

    background:rgba(20,20,20,.76);

    border:1px solid rgba(255,255,255,.12);

    color:#eee;

    font-size:14px;

    backdrop-filter:blur(7px);
}

/* =====================================================
   ÁREA DE AÇÕES
===================================================== */

.actions{
    width:100%;

    display:flex;
    align-items:center;

    min-height:70px;

    padding:10px 4px;

    margin-top:5px;

    border-top:1px solid rgba(255,255,255,.12);
    border-bottom:1px solid rgba(255,255,255,.12);

    gap:28px;
}

.action{
    display:flex;
    align-items:center;
    gap:9px;

    color:#fff;

    font-size:16px;

    border:none;
    background:none;

    cursor:pointer;
}

.action svg{
    width:27px;
    height:27px;

    stroke:#fff;
}

.favorite{
    margin-left:auto;

    width:45px;
    height:45px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:none;
    background:transparent;

    cursor:pointer;
}

.favorite svg{
    width:32px;
    height:32px;

    stroke:#fff;
    fill:none;

    stroke-width:1.8;

    transition:.2s;
}

.favorite.active svg{
    stroke:var(--vermelho);
    fill:var(--vermelho);
}

/* =====================================================
   PAINEL DE INFORMAÇÕES
===================================================== */

.info-panel{
    background:#050505;

    padding:28px 24px 50px;
}

/* =====================================================
   SINOPSE
===================================================== */

.synopsis{
    max-width:900px;

    font-size:17px;
    line-height:1.65;

    color:#e7e7e7;

    display:-webkit-box;
    -webkit-box-orient:vertical;
    -webkit-line-clamp:4;

    overflow:hidden;

    transition:max-height .3s ease;
}

.synopsis.expanded{
    display:block;
}

/* =====================================================
   BOTÃO EXPANDIR
===================================================== */

.synopsis-toggle{
    width:100%;

    margin-top:15px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:none;
    background:transparent;

    color:#fff;

    cursor:pointer;
}

.synopsis-toggle svg{
    width:28px;
    height:28px;

    stroke:#fff;

    transition:.25s;
}

.synopsis-toggle.open svg{
    transform:rotate(180deg);
}

/* =====================================================
   TEMPORADAS
===================================================== */

.seasons-section{
    margin-top:38px;
}

.section-title{
    font-size:26px;

    font-weight:800;

    margin-bottom:20px;
}

.seasons-list{
    display:flex;

    gap:16px;

    overflow-x:auto;

    padding-bottom:10px;

    scrollbar-width:none;
}

.seasons-list::-webkit-scrollbar{
    display:none;
}

.season-card{
    flex:0 0 145px;

    background:#111;

    border:1px solid #222;

    border-radius:14px;

    overflow:hidden;

    cursor:pointer;
}

.season-card img{
    width:100%;
    height:205px;

    object-fit:cover;

    display:block;
}

.season-info{
    padding:11px;
}

.season-name{
    font-size:15px;

    font-weight:700;

    margin-bottom:5px;
}

.season-year{
    font-size:13px;

    color:#999;
}

/* =====================================================
   TOAST
===================================================== */

.toast{
    position:fixed;

    left:50%;
    bottom:25px;

    transform:translate(-50%,30px);

    opacity:0;

    pointer-events:none;

    z-index:100;

    background:#171717;

    border:1px solid #303030;

    color:#fff;

    padding:13px 20px;

    border-radius:12px;

    font-size:14px;

    box-shadow:0 10px 30px rgba(0,0,0,.5);

    transition:.3s;
}

.toast.show{
    opacity:1;

    transform:translate(-50%,0);
}

/* =====================================================
   LOADING
===================================================== */

.loading{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#aaa;

    font-size:16px;
}

/* =====================================================
   RESPONSIVO
===================================================== */

@media(max-width:600px){

    .topbar{
        height:68px;
        padding:0 15px;
    }

    .back-btn{
        width:42px;
        height:42px;
    }

    .logo-mini{
        font-size:23px;
    }

    .hero{
        min-height:580px;
    }

    .hero-content{
        min-height:580px;

        padding:
            0 20px 28px;
    }

    .poster{
        width:115px;
        height:170px;

        margin-bottom:18px;
    }

    .anime-title{
        font-size:31px;
    }

    .meta{
        font-size:15px;
    }

    .genres{
        margin-bottom:18px;
    }

    .genre{
        font-size:13px;
        padding:8px 12px;
    }

    .actions{
        gap:20px;
    }

    .action{
        font-size:14px;
    }

    .action svg{
        width:25px;
        height:25px;
    }

    .info-panel{
        padding:
            24px 20px 45px;
    }

    .synopsis{
        font-size:16px;
    }

    .section-title{
        font-size:24px;
    }

    .season-card{
        flex-basis:135px;
    }

    .season-card img{
        height:190px;
    }
}

</style>

</head>

<body>

<div id="app">

    <div class="loading">
        A carregar...
    </div>

</div>

<div class="toast" id="toast">
    Adicionado aos favoritos
</div>

<script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const TMDB_API_KEY =
    "COLOCA_AQUI_A_TUA_CHAVE_TMDB";

const TMDB_BASE =
    "https://api.themoviedb.org/3";

const TMDB_IMAGE =
    "https://image.tmdb.org/t/p";

const JIKAN_API =
    "https://api.jikan.moe/v4";


/* =====================================================
   ID RECEBIDO PELA URL
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const animeId =
    params.get("id");

const animeTitle =
    params.get("title");


/* =====================================================
   ELEMENTOS
===================================================== */

const app =
    document.getElementById("app");

const toast =
    document.getElementById("toast");


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapeHTML(text){

    if(text === null ||
       text === undefined){

        return "";
    }

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =====================================================
   TMDB REQUEST
===================================================== */

async function tmdbRequest(url){

    if(
        !TMDB_API_KEY ||
        TMDB_API_KEY.includes(
            "COLOCA_AQUI"
        )
    ){

        throw new Error(
            "TMDB API key não configurada."
        );
    }

    const response =
        await fetch(url,{
            headers:{
                Authorization:
                    "Bearer " +
                    TMDB_API_KEY,

                accept:
                    "application/json"
            }
        });

    if(!response.ok){

        throw new Error(
            "TMDB erro " +
            response.status
        );
    }

    return await response.json();
}


/* =====================================================
   PROCURAR ANIME NA TMDB
===================================================== */

async function searchTMDB(title){

    const query =
        encodeURIComponent(title);

    const url =
        `${TMDB_BASE}/search/tv` +
        `?query=${query}` +
        `&language=pt-BR`;

    return await tmdbRequest(url);
}


/* =====================================================
   DETALHES TMDB
===================================================== */

async function getTMDBDetails(id){

    const url =
        `${TMDB_BASE}/tv/${id}` +
        `?language=pt-BR` +
        `&append_to_response=images`;

    return await tmdbRequest(url);
}


/* =====================================================
   JIKAN DETALHES
===================================================== */

async function getJikanDetails(id){

    const response =
        await fetch(
            `${JIKAN_API}/anime/${id}/full`
        );

    if(!response.ok){

        throw new Error(
            "Jikan erro"
        );
    }

    const json =
        await response.json();

    return json.data;
}


/* =====================================================
   ENCONTRAR TMDB PELO NOME
===================================================== */

async function findTMDBAnime(title){

    try{

        const result =
            await searchTMDB(title);

        if(
            result.results &&
            result.results.length
        ){

            return result.results[0];
        }

    }catch(error){

        console.warn(
            "TMDB search:",
            error
        );
    }

    return null;
}


/* =====================================================
   URL IMAGEM
===================================================== */

function tmdbImage(
    path,
    size="original"
){

    if(!path){
        return "";
    }

    return `${TMDB_IMAGE}/${size}${path}`;
}


/* =====================================================
   TOAST
===================================================== */

function showToast(message){

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    setTimeout(()=>{

        toast.classList.remove(
            "show"
        );

    },2200);
}


/* =====================================================
   FAVORITOS
===================================================== */

function favoriteKey(anime){

    return (
        "playnime_favorite_" +
        (
            anime.mal_id ||
            anime.id ||
            anime.title
        )
    );
}


function isFavorite(anime){

    return localStorage.getItem(
        favoriteKey(anime)
    ) === "true";
}


function toggleFavorite(anime){

    const key =
        favoriteKey(anime);

    const active =
        localStorage.getItem(key)
        === "true";

    if(active){

        localStorage.removeItem(
            key
        );

        showToast(
            "Removido dos favoritos"
        );

    }else{

        localStorage.setItem(
            key,
            "true"
        );

        showToast(
            "Adicionado aos favoritos"
        );
    }

    const button =
        document.querySelector(
            ".favorite"
        );

    if(button){

        button.classList.toggle(
            "active",
            !active
        );
    }
}


/* =====================================================
   ÍCONES SVG
===================================================== */

const icons = {

    back: `
        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             stroke-linecap="round"
             stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6"/>
        </svg>
    `,

    share: `
        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             stroke-linecap="round"
             stroke-linejoin="round">
            <circle cx="18" cy="5" r="3"/>
            <circle cx="6" cy="12" r="3"/>
            <circle cx="18" cy="19" r="3"/>
            <path d="M8.6 13.5l6.8 4"/>
            <path d="M15.4 6.5l-6.8 4"/>
        </svg>
    `,

    comment: `
        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             stroke-linecap="round"
             stroke-linejoin="round">
            <path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H8l-4 3v-5.2A7.5 7.5 0 1 1 20 11.5Z"/>
        </svg>
    `,

    heart: `
        <svg viewBox="0 0 24 24"
             stroke="currentColor"
             stroke-width="1.8"
             stroke-linecap="round"
             stroke-linejoin="round">
            <path d="M20.8 8.8c0 5-8.8 10-8.8 10S3.2 13.8 3.2 8.8A4.6 4.6 0 0 1 12 6.1a4.6 4.6 0 0 1 8.8 2.7Z"/>
        </svg>
    `,

    chevron: `
        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             stroke-linecap="round"
             stroke-linejoin="round">
            <path d="M6 9l6 6 6-6"/>
        </svg>
    `
};

<script>

/* =====================================================
   NORMALIZAR DADOS
===================================================== */

function normalizeData(
    jikan,
    tmdb
){

    const title =
        tmdb?.name ||
        tmdb?.original_name ||
        jikan?.title ||
        "Anime";

    const poster =
        tmdb?.poster_path
            ? tmdbImage(
                tmdb.poster_path,
                "w500"
            )
            :
        jikan?.images?.jpg?.large_image_url ||
        jikan?.images?.jpg?.image_url ||
        "";

    const backdrop =
        tmdb?.backdrop_path
            ? tmdbImage(
                tmdb.backdrop_path,
                "original"
            )
            :
        jikan?.images?.jpg?.large_image_url ||
        poster;

    const rating =
        Number(
            tmdb?.vote_average ??
            jikan?.score ??
            0
        );

    const year =
        (
            tmdb?.first_air_date ||
            jikan?.year ||
            ""
        ).toString().substring(0,4);

    let genres = [];

    if(
        tmdb?.genres &&
        tmdb.genres.length
    ){

        genres =
            tmdb.genres.map(
                g => g.name
            );

    }else if(
        jikan?.genres &&
        jikan.genres.length
    ){

        genres =
            jikan.genres.map(
                g => g.name
            );
    }

    const synopsis =
        tmdb?.overview ||
        jikan?.synopsis ||
        "Sinopse não disponível.";

    return {

        id:
            tmdb?.id ||
            jikan?.mal_id,

        mal_id:
            jikan?.mal_id ||
            null,

        tmdb_id:
            tmdb?.id ||
            null,

        title,

        poster,

        backdrop,

        rating,

        year,

        genres,

        synopsis,

        tmdb,

        jikan
    };
}


/* =====================================================
   OBTER TEMPORADAS
===================================================== */

async function getSeasons(anime){

    if(
        !anime.tmdb_id
    ){

        return [];
    }

    try{

        const details =
            anime.tmdb ||
            await getTMDBDetails(
                anime.tmdb_id
            );

        if(
            !details.seasons
        ){

            return [];
        }

        return details.seasons
            .filter(
                season =>
                    season.season_number >= 0
            )
            .map(
                season => ({

                    number:
                        season.season_number,

                    name:
                        season.name ||
                        `Temporada ${season.season_number}`,

                    year:
                        season.air_date
                            ? season.air_date.substring(0,4)
                            : "",

                    poster:
                        season.poster_path
                            ? tmdbImage(
                                season.poster_path,
                                "w500"
                            )
                            : anime.poster
                })
            );

    }catch(error){

        console.warn(
            "Temporadas:",
            error
        );

        return [];
    }
}


/* =====================================================
   HTML TEMPORADAS
===================================================== */

function seasonsHTML(
    seasons
){

    if(
        !seasons ||
        !seasons.length
    ){

        return "";
    }

    return `

        <section class="seasons-section">

            <h2 class="section-title">
                Temporadas
            </h2>

            <div class="seasons-list">

                ${seasons.map(
                    season => `

                    <article
                        class="season-card"
                        onclick="
                            openSeason(
                                ${season.number}
                            )
                        "
                    >

                        <img
                            src="${escapeHTML(
                                season.poster
                            )}"
                            alt="${escapeHTML(
                                season.name
                            )}"
                            loading="lazy"
                        >

                        <div class="season-info">

                            <div class="season-name">
                                ${escapeHTML(
                                    season.name
                                )}
                            </div>

                            ${
                                season.year
                                ?
                                `
                                <div class="season-year">
                                    ${escapeHTML(
                                        season.year
                                    )}
                                </div>
                                `
                                :
                                ""
                            }

                        </div>

                    </article>

                `
                ).join("")}

            </div>

        </section>

    `;
}


/* =====================================================
   RENDER DETALHES
===================================================== */

function renderDetails(
    anime,
    seasons
){

    const favorite =
        isFavorite(anime);

    const genresHTML =
        anime.genres
            .slice(0,6)
            .map(
                genre => `
                    <span class="genre">
                        ${escapeHTML(
                            genre
                        )}
                    </span>
                `
            )
            .join("");


    app.innerHTML = `

        <!-- =========================================
             HERO
        ========================================== -->

        <section class="hero">

            <img
                class="hero-bg"
                src="${escapeHTML(
                    anime.backdrop
                )}"
                alt=""
            >

            <div class="hero-top-fade"></div>


            <!-- =====================================
                 TOPO
            ====================================== -->

            <header class="topbar">

                <div class="top-left">

                    <button
                        class="back-btn"
                        onclick="goBack()"
                        aria-label="Voltar"
                    >

                        ${icons.back}

                    </button>


                    <div class="logo-mini">

                        <span class="play">
                            Play
                        </span>

                        <span class="nime">
                            Nime
                        </span>

                    </div>

                </div>

            </header>


            <!-- =====================================
                 CONTEÚDO HERO
            ====================================== -->

            <div class="hero-content">


                ${
                    anime.poster
                    ?
                    `
                    <img
                        class="poster"
                        src="${escapeHTML(
                            anime.poster
                        )}"
                        alt="${escapeHTML(
                            anime.title
                        )}"
                    >
                    `
                    :
                    ""
                }


                <h1 class="anime-title">

                    ${escapeHTML(
                        anime.title
                    )}

                </h1>


                <div class="meta">

                    <span class="rating">

                        <span class="star">
                            ★
                        </span>

                        ${
                            anime.rating
                            ?
                            anime.rating.toFixed(1)
                            :
                            "N/A"
                        }

                    </span>


                    ${
                        anime.year
                        ?
                        `
                        <span class="year">
                            ${escapeHTML(
                                anime.year
                            )}
                        </span>
                        `
                        :
                        ""
                    }

                </div>


                <div class="genres">

                    ${genresHTML}

                </div>


                <!-- =================================
                     AÇÕES
                ================================== -->

                <div class="actions">


                    <button
                        class="action"
                        onclick="shareAnime()"
                    >

                        ${icons.share}

                        <span>
                            Partilhar
                        </span>

                    </button>


                    <button
                        class="action"
                        onclick="openComments()"
                    >

                        ${icons.comment}

                        <span>
                            Comentários
                        </span>

                    </button>


                    <button
                        class="
                            favorite
                            ${favorite
                                ? "active"
                                : ""
                            }
                        "
                        onclick="
                            toggleFavorite(
                                currentAnime
                            )
                        "
                        aria-label="Favoritos"
                    >

                        ${icons.heart}

                    </button>


                </div>

            </div>

        </section>


        <!-- =========================================
             INFORMAÇÕES
        ========================================== -->

        <main class="info-panel">


            <!-- SINOPSE SEM TÍTULO -->

            <p
                id="synopsis"
                class="synopsis"
            >

                ${escapeHTML(
                    anime.synopsis
                )}

            </p>


            <!-- SETA EMBAIXO -->

            <button
                id="synopsisToggle"
                class="synopsis-toggle"
                onclick="toggleSynopsis()"
                aria-label="Expandir sinopse"
            >

                ${icons.chevron}

            </button>


            <!-- TEMPORADAS -->

            ${seasonsHTML(
                seasons
            )}


        </main>

    `;
}


/* =====================================================
   SINOPSE EXPANDIR / RECOLHER
===================================================== */

function toggleSynopsis(){

    const text =
        document.getElementById(
            "synopsis"
        );

    const button =
        document.getElementById(
            "synopsisToggle"
        );

    if(!text || !button){

        return;
    }

    const expanded =
        text.classList.toggle(
            "expanded"
        );

    button.classList.toggle(
        "open",
        expanded
    );
}


/* =====================================================
   PARTILHAR
===================================================== */

async function shareAnime(){

    const url =
        window.location.href;

    const title =
        currentAnime?.title ||
        "PlayNime";


    if(
        navigator.share
    ){

        try{

            await navigator.share({

                title,

                text:
                    `Confira ${title} no PlayNime`,

                url

            });

        }catch(error){

            console.log(
                "Partilha cancelada"
            );
        }

        return;
    }


    try{

        await navigator.clipboard.writeText(
            url
        );

        showToast(
            "Link copiado"
        );

    }catch(error){

        showToast(
            "Não foi possível partilhar"
        );
    }
}

/* =====================================================
   VARIÁVEL GLOBAL
===================================================== */

let currentAnime = null; 

 <script>

/* =====================================================
   CARREGAR DADOS
===================================================== */

async function loadAnime(){

    try{

        if(
            !animeId &&
            !animeTitle
        ){

            throw new Error(
                "Anime não especificado."
            );
        }


        let jikan = null;

        let tmdb = null;


        /* =============================================
           PRIMEIRO: JIKAN
        ============================================= */

        if(animeId){

            try{

                jikan =
                    await getJikanDetails(
                        animeId
                    );

            }catch(error){

                console.warn(
                    "Jikan indisponível:",
                    error
                );
            }
        }


        /* =============================================
           TÍTULO PARA PESQUISA TMDB
        ============================================= */

        const titleForTMDB =
            jikan?.title ||
            animeTitle ||
            "";


        /* =============================================
           SEGUNDO: TMDB
        ============================================= */

        if(titleForTMDB){

            tmdb =
                await findTMDBAnime(
                    titleForTMDB
                );
        }


        /* =============================================
           SE ENCONTROU TMDB, BUSCAR DETALHES
        ============================================= */

        if(tmdb?.id){

            try{

                tmdb =
                    await getTMDBDetails(
                        tmdb.id
                    );

            }catch(error){

                console.warn(
                    "Detalhes TMDB:",
                    error
                );
            }
        }


        /* =============================================
           SE NENHUMA API RESPONDEU
        ============================================= */

        if(
            !jikan &&
            !tmdb
        ){

            throw new Error(
                "Não foi possível carregar o anime."
            );
        }


        /* =============================================
           NORMALIZAR
        ============================================= */

        currentAnime =
            normalizeData(
                jikan,
                tmdb
            );


        /* =============================================
           TEMPORADAS
        ============================================= */

        const seasons =
            await getSeasons(
                currentAnime
            );


        /* =============================================
           MOSTRAR
        ============================================= */

        renderDetails(
            currentAnime,
            seasons
        );


    }catch(error){

        console.error(
            error
        );


        app.innerHTML = `

            <div
                style="
                    min-height:100vh;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    flex-direction:column;
                    padding:30px;
                    text-align:center;
                    background:#050505;
                "
            >

                <h2
                    style="
                        margin-bottom:12px;
                    "
                >
                    Não foi possível carregar
                </h2>

                <p
                    style="
                        color:#999;
                        margin-bottom:22px;
                    "
                >
                    Verifica a ligação e tenta novamente.
                </p>

                <button
                    onclick="loadAnime()"
                    style="
                        border:none;
                        padding:13px 22px;
                        border-radius:12px;
                        background:#a855f7;
                        color:white;
                        font-weight:700;
                    "
                >
                    Tentar novamente
                </button>

            </div>

        `;
    }
}


/* =====================================================
   INICIAR
===================================================== */

loadAnime();

</script>
