<!DOCTYPE html>
<html lang="pt">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>PlayNime - Detalhes</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

html{
    background:#050505;
}

body{
    background:#050505;
    color:#fff;
    min-height:100vh;
    overflow-x:hidden;
}

/* =====================================================
   TOPO
===================================================== */

.topbar{

    position:fixed;
    top:0;
    left:0;
    right:0;

    height:70px;

    display:flex;
    align-items:center;

    padding:0 22px;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.95),
            rgba(0,0,0,.55),
            transparent
        );

    z-index:50;
}

.logo{

    font-size:25px;
    font-weight:800;
    letter-spacing:-1px;
}

.logo span{
    color:#a84cff;
}

.back{

    width:42px;
    height:42px;

    border:none;
    border-radius:50%;

    background:rgba(20,20,20,.8);

    color:white;

    font-size:28px;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-right:15px;

    cursor:pointer;
}

/* =====================================================
   HERO
===================================================== */

.hero{

    position:relative;

    width:100%;
    min-height:650px;

    display:flex;
    align-items:flex-end;

    padding:0 28px 45px;

    overflow:hidden;
}

.hero-bg{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    opacity:.58;

    filter:saturate(1.1);
}

.hero-gradient{

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.2) 0%,
            rgba(0,0,0,.2) 35%,
            rgba(5,5,5,.72) 65%,
            #050505 100%
        );
}

.hero-content{

    position:relative;

    z-index:2;

    width:100%;

    display:flex;

    align-items:flex-end;

    gap:24px;

    max-width:1100px;

    margin:auto;
}

.poster{

    width:190px;
    height:275px;

    flex-shrink:0;

    object-fit:cover;

    border-radius:14px;

    box-shadow:
        0 15px 40px rgba(0,0,0,.7);
}

.info{

    flex:1;

    min-width:0;
}

.title-row{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;
}

.title{

    font-size:38px;

    line-height:1.05;

    font-weight:800;
}

/* =====================================================
   FAVORITOS
===================================================== */

.favorite-btn{

    flex-shrink:0;

    width:52px;
    height:52px;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.2);

    background:rgba(15,15,15,.75);

    color:#fff;

    font-size:29px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    transition:.25s;
}

.favorite-btn:hover{
    transform:scale(1.08);
}

.favorite-btn.active{

    color:#ff3155;

    border-color:#ff3155;

    box-shadow:
        0 0 18px rgba(255,49,85,.35);
}

/* =====================================================
   META
===================================================== */

.meta{

    display:flex;

    flex-wrap:wrap;

    gap:9px;

    margin-top:17px;
}

.meta-item{

    padding:8px 12px;

    border-radius:8px;

    background:rgba(255,255,255,.1);

    color:#eee;

    font-size:14px;
}

.rating{

    color:#ffd43b;

    font-weight:bold;
}

.year{
    color:#ddd;
}

/* =====================================================
   GENEROS
===================================================== */

.genres{

    display:flex;

    flex-wrap:wrap;

    gap:8px;

    margin-top:14px;
}

.genre{

    padding:7px 12px;

    border-radius:20px;

    background:#181818;

    border:1px solid #292929;

    color:#ddd;

    font-size:13px;
}

/* =====================================================
   SINOPSE
===================================================== */

.synopsis-box{

    margin-top:18px;

    max-width:760px;
}

.synopsis{

    color:#d0d0d0;

    font-size:15px;

    line-height:1.65;

    display:-webkit-box;

    -webkit-line-clamp:3;

    -webkit-box-orient:vertical;

    overflow:hidden;

    transition:.3s;
}

.synopsis.expanded{

    display:block;

    -webkit-line-clamp:unset;
}

.expand-btn{

    margin-top:7px;

    border:none;

    background:none;

    color:#a84cff;

    font-size:25px;

    cursor:pointer;

    width:100%;

    text-align:center;

    transition:.25s;
}

.expand-btn.rotated{
    transform:rotate(180deg);
}

/* =====================================================
   TOAST
===================================================== */

.toast{

    position:fixed;

    left:50%;
    bottom:30px;

    transform:
        translate(-50%,120px);

    background:#181818;

    border:1px solid #333;

    padding:13px 20px;

    border-radius:12px;

    color:#fff;

    font-size:14px;

    z-index:100;

    opacity:0;

    transition:.3s;

    box-shadow:
        0 10px 30px rgba(0,0,0,.5);
}

.toast.show{

    opacity:1;

    transform:
        translate(-50%,0);
}

/* =====================================================
   CONTEUDO
===================================================== */

.main{

    width:100%;

    max-width:1100px;

    margin:auto;

    padding:15px 28px 100px;
}

.section-title{

    font-size:27px;

    font-weight:800;

    margin:25px 0 17px;
}

/* =====================================================
   TEMPORADAS
===================================================== */

.seasons{

    display:flex;

    gap:14px;

    overflow-x:auto;

    padding-bottom:10px;

    scrollbar-width:none;
}

.seasons::-webkit-scrollbar{
    display:none;
}

.season-card{

    flex-shrink:0;

    width:155px;

    background:#151515;

    border:1px solid #252525;

    border-radius:13px;

    overflow:hidden;

    cursor:pointer;

    transition:.25s;
}

.season-card:hover{

    transform:
        translateY(-4px);

    border-color:#8d3fff;
}

.season-image{

    width:100%;

    height:205px;

    object-fit:cover;

    background:#1c1c1c;
}

.season-info{

    padding:11px;
}

.season-name{

    font-size:14px;

    font-weight:bold;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.season-year{

    margin-top:5px;

    color:#999;

    font-size:12px;
}

/* =====================================================
   RESPONSIVO
===================================================== */

@media(max-width:650px){

    .hero{

        min-height:650px;

        padding:
            0
            20px
            30px;
    }

    .hero-content{

        gap:16px;

        align-items:flex-end;
    }

    .poster{

        width:125px;
        height:185px;

        border-radius:11px;
    }

    .title{

        font-size:27px;
    }

    .favorite-btn{

        width:46px;
        height:46px;

        font-size:25px;
    }

    .meta{

        margin-top:10px;
    }

    .meta-item{

        padding:6px 9px;

        font-size:12px;
    }

    .genres{

        margin-top:9px;
    }

    .genre{

        font-size:11px;

        padding:6px 9px;
    }

    .synopsis{

        font-size:13px;

        line-height:1.5;
    }

    .main{

        padding:
            10px
            20px
            90px;
    }

    .section-title{

        font-size:23px;
    }

    .season-card{

        width:130px;
    }

    .season-image{

        height:175px;
    }
}

</style>

</head>

<body>

<header class="topbar">

    <button
        class="back"
        onclick="history.back()">
        ‹
    </button>

    <div class="logo">
        Play<span>Nime</span>
    </div>

</header>


<section class="hero">

    <img
        id="heroBg"
        class="hero-bg"
        src=""
        alt="">

    <div class="hero-gradient"></div>


    <div class="hero-content">

        <img
            id="poster"
            class="poster"
            src=""
            alt="Poster">


        <div class="info">

            <div class="title-row">

                <h1
                    id="title"
                    class="title">
                    Carregando...
                </h1>


                <button
                    id="favoriteBtn"
                    class="favorite-btn"
                    aria-label="Adicionar aos favoritos">

                    ♡

                </button>

            </div>


            <div
                id="meta"
                class="meta">
            </div>


            <div
                id="genres"
                class="genres">
            </div>


            <div class="synopsis-box">

                <p
                    id="synopsis"
                    class="synopsis">
                    Carregando sinopse...
                </p>

                <button
                    id="expandBtn"
                    class="expand-btn"
                    aria-label="Expandir sinopse">

                    ↓

                </button>

            </div>

        </div>

    </div>

</section>


<main class="main">

    <h2 class="section-title">
        Temporadas
    </h2>

    <div
        id="seasons"
        class="seasons">
    </div>

</main>


<div
    id="toast"
    class="toast">
</div>

<script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const JIKAN_API =
    "https://api.jikan.moe/v4";


/*
   IMPORTANTE:

   Não coloques uma chave TMDB verdadeira
   diretamente num repositório GitHub público.

   Por enquanto deixa assim.
   Depois podemos criar o proxy Cloudflare
   para esconder a chave.
*/

const TMDB_API_KEY =
    "COLOQUE_AQUI_A_CHAVE_TMDB";


const TMDB_API =
    "https://api.themoviedb.org/3";


/* =====================================================
   ID DO ANIME
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const animeId =
    params.get("id");


/* =====================================================
   ELEMENTOS
===================================================== */

const titleEl =
    document.getElementById("title");

const posterEl =
    document.getElementById("poster");

const heroBgEl =
    document.getElementById("heroBg");

const metaEl =
    document.getElementById("meta");

const genresEl =
    document.getElementById("genres");

const synopsisEl =
    document.getElementById("synopsis");

const seasonsEl =
    document.getElementById("seasons");

const favoriteBtn =
    document.getElementById("favoriteBtn");

const expandBtn =
    document.getElementById("expandBtn");

const toastEl =
    document.getElementById("toast");


/* =====================================================
   FALLBACK DE IMAGEM
===================================================== */

const FALLBACK_IMAGE =
    "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg"
             width="500"
             height="750">

            <rect
                width="100%"
                height="100%"
                fill="#151515"/>

            <text
                x="50%"
                y="50%"
                fill="#777"
                font-size="28"
                text-anchor="middle"
                dominant-baseline="middle">
                PlayNime
            </text>

        </svg>
    `);


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapeHTML(text){

    if(!text){
        return "";
    }

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =====================================================
   MOSTRAR TOAST
===================================================== */

function showToast(message){

    toastEl.textContent =
        message;

    toastEl.classList.add("show");

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(() => {

            toastEl.classList.remove(
                "show"
            );

        },2200);
}


/* =====================================================
   FAVORITOS
===================================================== */

function getFavorites(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "playNimeFavorites"
            )
        ) || [];

    }catch(error){

        return [];
    }
}


function saveFavorites(list){

    localStorage.setItem(
        "playNimeFavorites",
        JSON.stringify(list)
    );
}


function updateFavoriteButton(){

    const favorites =
        getFavorites();

    const exists =
        favorites.some(
            anime =>
                String(anime.id) ===
                String(animeId)
        );

    if(exists){

        favoriteBtn.classList.add(
            "active"
        );

        favoriteBtn.innerHTML =
            "♥";

    }else{

        favoriteBtn.classList.remove(
            "active"
        );

        favoriteBtn.innerHTML =
            "♡";
    }
}


favoriteBtn.addEventListener(
    "click",
    () => {

        const favorites =
            getFavorites();

        const index =
            favorites.findIndex(
                anime =>
                    String(anime.id) ===
                    String(animeId)
            );


        if(index >= 0){

            favorites.splice(
                index,
                1
            );

            saveFavorites(
                favorites
            );

            updateFavoriteButton();

            showToast(
                "Removido dos favoritos"
            );

        }else{

            const anime = {

                id:
                    animeId,

                title:
                    titleEl.textContent,

                poster:
                    posterEl.src,

                backdrop:
                    heroBgEl.src,

                rating:
                    document
                    .querySelector(
                        ".rating"
                    )?.dataset?.value ||
                    "",

                year:
                    document
                    .querySelector(
                        ".year"
                    )?.dataset?.value ||
                    "",

                genres:
                    Array.from(
                        genresEl
                        .querySelectorAll(
                            ".genre"
                        )
                    ).map(
                        element =>
                            element.textContent
                    )

            };


            favorites.push(
                anime
            );

            saveFavorites(
                favorites
            );

            updateFavoriteButton();

            showToast(
                "Adicionado aos favoritos ❤️"
            );
        }

    }
);


/* =====================================================
   EXPANDIR SINOPSE
===================================================== */

expandBtn.addEventListener(
    "click",
    () => {

        synopsisEl.classList.toggle(
            "expanded"
        );

        expandBtn.classList.toggle(
            "rotated"
        );

    }
);


/* =====================================================
   REQUISIÇÃO JIKAN
===================================================== */

async function getJikanAnime(){

    if(!animeId){
        throw new Error(
            "ID do anime não encontrado."
        );
    }


    const response =
        await fetch(
            `${JIKAN_API}/anime/${animeId}/full`
        );


    if(!response.ok){

        throw new Error(
            "Jikan respondeu com erro."
        );
    }


    const json =
        await response.json();


    if(!json.data){

        throw new Error(
            "Anime não encontrado na Jikan."
        );
    }


    return json.data;
}


/* =====================================================
   TMDB - BUSCAR POR TITULO
===================================================== */

async function getTMDBAnime(title){

    if(
        !TMDB_API_KEY ||
        TMDB_API_KEY ===
        "8e893942e01c23b312df265d558e27fc"
    ){

        return null;
    }


    try{

        const url =
            `${TMDB_API}/search/tv` +
            `?api_key=${encodeURIComponent(
                TMDB_API_KEY
            )}` +
            `&query=${encodeURIComponent(
                title
            )}` +
            `&language=pt-PT`;


        const response =
            await fetch(url);


        if(!response.ok){

            return null;
        }


        const json =
            await response.json();


        if(
            !json.results ||
            !json.results.length
        ){

            return null;
        }


        return json.results[0];

    }catch(error){

        console.warn(
            "TMDB indisponível:",
            error
        );

        return null;
    }
}


/* =====================================================
   IMAGEM JIKAN
===================================================== */

function getJikanPoster(anime){

    return (
        anime?.images?.webp?.large_image_url ||
        anime?.images?.jpg?.large_image_url ||
        anime?.images?.webp?.image_url ||
        anime?.images?.jpg?.image_url ||
        FALLBACK_IMAGE
    );
}


function getJikanBackground(anime){

    return (
        anime?.images?.webp?.large_image_url ||
        anime?.images?.jpg?.large_image_url ||
        getJikanPoster(anime)
    );
}


/* =====================================================
   IMAGEM TMDB
===================================================== */

function getTMDBPoster(item){

    if(
        item &&
        item.poster_path
    ){

        return (
            "https://image.tmdb.org/t/p/w500" +
            item.poster_path
        );
    }

    return null;
}


function getTMDBBackground(item){

    if(
        item &&
        item.backdrop_path
    ){

        return (
            "https://image.tmdb.org/t/p/w1280" +
            item.backdrop_path
        );
    }

    return null;
}


/* =====================================================
   RENDERIZAR INFORMAÇÕES
===================================================== */

function renderAnime(
    anime,
    tmdb
){

    const title =
        anime.title ||
        anime.title_english ||
        anime.title_japanese ||
        "Anime";


    titleEl.textContent =
        title;


    /*
       Jikan é a fonte principal.

       Se TMDB tiver imagem,
       usamos a imagem do TMDB.
    */

    const jikanPoster =
        getJikanPoster(
            anime
        );

    const jikanBackground =
        getJikanBackground(
            anime
        );


    const tmdbPoster =
        getTMDBPoster(
            tmdb
        );

    const tmdbBackground =
        getTMDBBackground(
            tmdb
        );


    posterEl.src =
        tmdbPoster ||
        jikanPoster;


    heroBgEl.src =
        tmdbBackground ||
        jikanBackground;


    posterEl.onerror =
        () => {

            posterEl.src =
                jikanPoster;

        };


    heroBgEl.onerror =
        () => {

            heroBgEl.src =
                jikanBackground;

        };


    /* =================================================
       NOTA
    ================================================= */

    const rating =
        anime.score ??
        tmdb?.vote_average ??
        null;


    /* =================================================
       ANO
    ================================================= */

    let year = "";


    if(anime.year){

        year =
            anime.year;

    }else if(
        anime.aired &&
        anime.aired.from
    ){

        year =
            new Date(
                anime.aired.from
            ).getFullYear();

    }else if(
        tmdb?.first_air_date
    ){

        year =
            new Date(
                tmdb.first_air_date
            ).getFullYear();
    }


    /* =================================================
       META
    ================================================= */

    metaEl.innerHTML = "";


    if(rating){

        const ratingDiv =
            document.createElement(
                "div"
            );

        ratingDiv.className =
            "meta-item rating";

        ratingDiv.dataset.value =
            rating;

        ratingDiv.innerHTML =
            `★ ${Number(rating).toFixed(1)}`;

        metaEl.appendChild(
            ratingDiv
        );
    }


    if(year){

        const yearDiv =
            document.createElement(
                "div"
            );

        yearDiv.className =
            "meta-item year";

        yearDiv.dataset.value =
            year;

        yearDiv.textContent =
            year;

        metaEl.appendChild(
            yearDiv
        );
    }


    /* =================================================
       GENEROS
    ================================================= */

    genresEl.innerHTML =
        "";


    const genres =
        anime.genres || [];


    genres.forEach(
        genre => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "genre";

            div.textContent =
                genre.name;

            genresEl.appendChild(
                div
            );

        }
    );


    /* =================================================
       SINOPSE
    ================================================= */

    const synopsis =
        anime.synopsis ||
        tmdb?.overview ||
        "Sinopse não disponível.";


    synopsisEl.textContent =
        synopsis;


    /* =================================================
       FAVORITO
    ================================================= */

    updateFavoriteButton();


    /* =================================================
       TEMPORADAS
    ================================================= */

    renderSeasons(
        anime
    );
}


/* =====================================================
   TEMPORADAS
===================================================== */

function renderSeasons(anime){

    seasonsEl.innerHTML =
        "";


    const currentYear =
        anime.year ||
        (
            anime.aired?.from
                ? new Date(
                    anime.aired.from
                ).getFullYear()
                : ""
        );


    addSeasonCard({

        id:
            anime.mal_id,

        title:
            anime.title,

        image:
            getJikanPoster(
                anime
            ),

        year:
            currentYear,

        current:
            true
    });


    /*
       Relações do MyAnimeList/Jikan.

       Aqui usamos apenas PREQUEL e SEQUEL
       como temporadas/continuações.
    */

    const relations =
        anime.relations || [];


    relations.forEach(
        relation => {

            const type =
                String(
                    relation.relation || ""
                ).toLowerCase();


            if(
                type !== "prequel" &&
                type !== "sequel"
            ){

                return;
            }


            (relation.entry || [])
                .forEach(
                    entry => {

                        if(
                            entry.type !==
                            "anime"
                        ){

                            return;
                        }


                        addRelatedSeason(
                            entry
                        );

                    }
                );

        }
    );


    if(
        !seasonsEl.children.length
    ){

        seasonsEl.innerHTML =
            `<div style="
                color:#888;
                padding:15px 0;
             ">
                Nenhuma temporada encontrada.
             </div>`;
    }
}


function addSeasonCard(data){

    const card =
        document.createElement(
            "div"
        );

    card.className =
        "season-card";


    card.innerHTML = `

        <img
            class="season-image"
            src="${escapeHTML(
                data.image ||
                FALLBACK_IMAGE
            )}"
            alt="${escapeHTML(
                data.title
            )}">

        <div class="season-info">

            <div class="season-name">

                ${escapeHTML(
                    data.current
                    ? "Temporada atual"
                    : data.title
                )}

            </div>

            <div class="season-year">

                ${escapeHTML(
                    data.year ||
                    ""
                )}

            </div>

        </div>

    `;


    seasonsEl.appendChild(
        card
    );
}


/* =====================================================
   BUSCAR IMAGEM DE UMA TEMPORADA
===================================================== */

async function addRelatedSeason(
    entry
){

    try{

        const response =
            await fetch(
                `${JIKAN_API}/anime/${entry.mal_id}/full`
            );


        if(!response.ok){

            return;
        }


        const json =
            await response.json();


        if(!json.data){

            return;
        }


        const anime =
            json.data;


        addSeasonCard({

            id:
                anime.mal_id,

            title:
                anime.title,

            image:
                getJikanPoster(
                    anime
                ),

            year:
                anime.year ||
                (
                    anime.aired?.from
                        ? new Date(
                            anime.aired.from
                        ).getFullYear()
                        : ""
                ),

            current:
                false
        });

    }catch(error){

        console.warn(
            "Erro ao carregar temporada:",
            error
        );
    }
}

/* =====================================================
   INICIALIZAÇÃO
===================================================== */

async function init(){

    if(!animeId){

        titleEl.textContent =
            "Anime não encontrado";

        synopsisEl.textContent =
            "Nenhum ID de anime foi informado.";

        return;
    }


    try{

        /*
           1º: JIKAN

           A Jikan fornece os dados principais
           e serve como fallback.
        */

        const anime =
            await getJikanAnime();


        /*
           2º: TMDB

           Tentamos procurar o mesmo título
           no TMDB para obter imagens melhores.

           Se TMDB falhar, Jikan continua funcionando.
        */

        const title =
            anime.title ||
            anime.title_english ||
            "";


        const tmdb =
            await getTMDBAnime(
                title
            );


        renderAnime(
            anime,
            tmdb
        );


    }catch(error){

        console.error(
            "Erro ao carregar detalhes:",
            error
        );


        titleEl.textContent =
            "Não foi possível carregar";


        synopsisEl.textContent =
            "Tente novamente dentro de alguns segundos.";


        posterEl.src =
            FALLBACK_IMAGE;

        heroBgEl.src =
            FALLBACK_IMAGE;

    }

}


/* =====================================================
   INICIAR
===================================================== */

init();

</script>
