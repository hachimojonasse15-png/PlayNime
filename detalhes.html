<!DOCTYPE html>
<html lang="pt">
<head>

<title>PlayNime - Detalhes</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

html,
body{
    background:#050505;
    color:#fff;

}

body{
    overflow-x:hidden;
}

button{

}

img{

/* =====================================================
   TOPO
===================================================== */

.topbar{

    position:fixed;

    top:0;
    left:0;
    right:0;

    height:64px;

    display:flex;
    align-items:center;

    padding:0 18px;

    z-index:100;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.95),
            rgba(0,0,0,.45),
            transparent
        );
}

.back-btn{

    width:44px;
    height:44px;

    border:0;
    border-radius:50%;

    background:rgba(0,0,0,.45);

    color:#fff;

    font-size:32px;

    line-height:1;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    backdrop-filter:blur(8px);
}

.top-logo{

    margin-left:14px;

    font-size:23px;

    font-weight:800;

    letter-spacing:-.7px;
}

.top-logo span{
    color:#ff6a00;
}

.top-actions{

    margin-left:auto;

    display:flex;

    gap:10px;
}

.top-action{

    width:42px;
    height:42px;

    border:0;
    border-radius:50%;

    background:rgba(0,0,0,.4);

    color:white;

    font-size:21px;

    cursor:pointer;

    backdrop-filter:blur(8px);
}

/* =====================================================
   HERO / BANNER
===================================================== */

.hero{

    position:relative;

    width:100%;

    min-height:650px;

    display:flex;

    align-items:flex-end;
}

.hero-background{

    width:100%;
    height:100%;

}

.hero-overlay{

    position:absolute;

    inset:0;

    background:

            to bottom,
            rgba(0,0,0,.05) 0%,

}

.hero-content{

    position:relative;

.hero-info{

.title{

.meta-line{

}

.meta-separator{

.genre-list{

    flex-wrap:wrap;

    gap:7px;

}

.genre{

    font-size:13px;

    background:rgba(255,255,255,.10);

    border:1px solid rgba(255,255,255,.13);

    padding:6px 10px;

    border-radius:20px;

    backdrop-filter:blur(6px);

/* =====================================================
   BOTÕES PRINCIPAIS
===================================================== */

.main-actions{

    display:flex;

    align-items:center;

    flex-wrap:wrap;

    gap:10px;

    margin-top:10px;

.watch-btn{

    min-height:52px;

.watch-btn:hover{

.list-btn{

.favorite-btn{

/* =====================================================
   SINOPSE
===================================================== */

.content{

.synopsis-section{

}

.synopsis{

    -webkit-line-clamp:3;

    overflow:hidden;

    transition:.25s;
}

.synopsis.expanded{

}

.expand-btn{

}

.expand-btn.rotated{

}

/* =====================================================
   TÍTULOS DE SECÇÃO
===================================================== */

.section-title{

    font-size:25px;

    font-weight:800;

    margin:
        28px
        0
        15px;
}

/* =====================================================
   SELETOR DE TEMPORADA
===================================================== */

.season-selector{

    position:relative;

    width:100%;

    max-width:430px;
}

.season-button{

    width:100%;

    min-height:50px;

    padding:
        0
        16px;

    border:1px solid #292929;

    border-radius:8px;

    background:#151515;

    color:#fff;

    font-size:15px;

    font-weight:700;

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:space-between;

    text-align:left;
}

.season-arrow{

    font-size:18px;

    color:#aaa;

    transition:.2s;
}

.season-button.open

    transform:rotate(180deg);
}

.season-menu{

    position:absolute;

    left:0;
    right:0;

    top:calc(100% + 6px);

    overflow-y:auto;

    background:#161616;

    border:1px solid #303030;

    border-radius:8px;

    padding:6px;

    z-index:40;

        0 15px 40px rgba(0,0,0,.65);

    display:none;
}

.season-menu.open{
    display:block;
}

.season-option{

    width:100%;

    border:0;

    border-radius:6px;

    padding:
        12px
        13px;

    background:transparent;

    color:#ddd;

    text-align:left;

    cursor:pointer;

    font-size:14px;
}

.season-option:hover{
    background:#252525;
}

.season-option.active{

    background:#ff6a00;

}

/* =====================================================
   EPISÓDIOS
===================================================== */

.episode-header{

    align-items:center;

    justify-content:space-between;

    gap:15px;

    margin-top:25px;

    margin-bottom:12px;
}

.episode-header .section-title{
    margin:0;
}

.sort-btn{

    border:1px solid #292929;

    color:#ddd;

    border-radius:7px;

    padding:
        11px
        13px;

    cursor:pointer;

    font-size:13px;

    font-weight:700;
}

.episodes{

    display:flex;

    flex-direction:column;

    gap:9px;

    max-width:950px;
}

.episode{

    width:100%;

    display:flex;

    align-items:center;

    gap:13px;

    padding:7px;

    border-radius:9px;

    background:#101010;

    border:1px solid #181818;

    cursor:pointer;

    transition:.2s;
}

.episode:hover{

    background:#181818;

    border-color:#292929;

.episode-image{

    width:150px;

    height:85px;

    object-fit:cover;

    border-radius:7px;

    background:#1c1c1c;

.episode-info{

    min-width:0;

    flex:1;
}

.episode-title{

    font-size:15px;

    font-weight:800;

    color:#fff;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.episode-meta{

    margin-top:6px;

    color:#999;

    font-size:13px;

    display:flex;

    flex-wrap:wrap;

    gap:7px;
}

.language{

    color:#ccc;
}

.episode-number{

    color:#ff6a00;

    font-weight:800;
}

.episode-play{

    width:40px;
    height:40px;

    flex-shrink:0;

    border-radius:50%;

    background:#191919;

    color:#ff6a00;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:17px;
}

/* =====================================================
   LOADING
===================================================== */

.loading{

    padding:25px 0;

    color:#777;

    text-align:center;
}

.spinner{

    width:30px;
    height:30px;

    margin:
        0
        auto
        10px;

    border-radius:50%;

    border:3px solid #222;

    border-top-color:#ff6a00;

    animation:
        spin .8s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }
}

/* =====================================================
   TOAST
===================================================== */

.toast{

    position:fixed;

    left:50%;

    bottom:25px;

    z-index:200;

    padding:
        12px
        18px;

    border-radius:9px;

    background:#1b1b1b;

    border:1px solid #333;

    color:#fff;

    font-size:14px;

    opacity:0;

    pointer-events:none;

    transform:
        translate(-50%,30px);

    transition:.25s;
}

.toast.show{

    opacity:1;

    transform:
        translate(-50%,0);
}

/* =====================================================

}

</style>

      <script>

/* =====================================================
   CONFIGURAÇÃO DAS APIS
===================================================== */

const JIKAN_API =
    "https://api.jikan.moe/v4";

const TMDB_API =
    "https://api.themoviedb.org/3";


/*
   Chave TMDB fornecida.

   IMPORTANTE:
   se o projeto ficar público no GitHub,
   restringe esta chave no painel do TMDB
   ao teu domínio.
*/

const TMDB_API_KEY =
    "8e893942e01c23b312df265d558e27fc";


/* =====================================================
   PARAMETROS DA URL
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const animeId =
    params.get("id");

const titleParam =
    params.get("title");


let selectedSeasonNumber =
    Number(
        params.get("season") || 1
    );


/* =====================================================
   ELEMENTOS
===================================================== */

const titleEl =
    document.getElementById("title");

const heroBgEl =
    document.getElementById("heroBg");

const metaLineEl =
    document.getElementById("metaLine");

const genresEl =
    document.getElementById("genres");

const synopsisEl =
    document.getElementById("synopsis");

const expandBtn =
    document.getElementById("expandBtn");

const favoriteBtn =
    document.getElementById("favoriteBtn");

const myListBtn =
    document.getElementById("myListBtn");

const shareBtn =
    document.getElementById("shareBtn");

const watchBtn =
    document.getElementById("watchBtn");

const seasonButton =
    document.getElementById("seasonButton");

const seasonMenu =
    document.getElementById("seasonMenu");

const selectedSeasonEl =
    document.getElementById("selectedSeason");

const episodesEl =
    document.getElementById("episodes");

const sortButton =
    document.getElementById("sortButton");

const toastEl =
    document.getElementById("toast");


/* =====================================================
   ESTADO
===================================================== */

let currentAnime =
    null;

let currentTMDB =
    null;

let currentTMDBDetails =
    null;

let seasons =
    [];

let currentEpisodes =
    [];

let sortAscending =
    true;


/* =====================================================
   FALLBACK DE IMAGEM
===================================================== */

const FALLBACK_IMAGE =
    "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg"
             width="800"
             height="450">

            <rect
                width="100%"
                height="100%"
                fill="#171717"/>

            <text
                x="50%"
                y="50%"
                fill="#777"
                font-size="32"
                text-anchor="middle"
                dominant-baseline="middle">
                PlayNime
            </text>

        </svg>
    `);


/* =====================================================
   UTILITÁRIOS
===================================================== */

function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";
    }

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


function sleep(ms){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );
}


function getYearFromDate(date){

    if(!date){
        return "";
    }

    const year =
        new Date(date)
            .getFullYear();

    return Number.isNaN(year)
        ? ""
        : year;
}


function showToast(message){

    toastEl.textContent =
        message;

    toastEl.classList.add(
        "show"
    );

    clearTimeout(
        window.__playNimeToast
    );

    window.__playNimeToast =
        setTimeout(
            () => {

                toastEl.classList.remove(
                    "show"
                );

            },
            2300
        );
}


/* =====================================================
   IMAGENS JIKAN
===================================================== */

function jikanPoster(anime){

    return (
        anime?.images?.webp?.large_image_url ||
        anime?.images?.jpg?.large_image_url ||
        anime?.images?.webp?.image_url ||
        anime?.images?.jpg?.image_url ||
        FALLBACK_IMAGE
    );
}


function jikanBackground(anime){

    return jikanPoster(
        anime
    );
}


/* =====================================================
   IMAGENS TMDB
===================================================== */

function tmdbPoster(item){

    if(
        item &&
        item.poster_path
    ){

        return (
            "https://image.tmdb.org/t/p/w500" +
            item.poster_path
        );
    }

    return null;
}


function tmdbBackdrop(item){

    if(
        item &&
        item.backdrop_path
    ){

        return (
            "https://image.tmdb.org/t/p/w1280" +
            item.backdrop_path
        );
    }

    return null;
}


/* =====================================================
   JIKAN - ANIME
===================================================== */

async function getJikanAnime(){

    if(!animeId){

        throw new Error(
            "ID do anime não encontrado."
        );
    }

    const response =
        await fetch(
            `${JIKAN_API}/anime/${animeId}/full`
        );

    if(!response.ok){

        throw new Error(
            `Jikan erro ${response.status}`
        );
    }

    const json =
        await response.json();

    if(!json.data){

        throw new Error(
            "Anime não encontrado."
        );
    }

    return json.data;
}


/* =====================================================
   JIKAN - EPISÓDIOS
===================================================== */

async function getJikanEpisodes(
    malId,
    page = 1
){

    const response =
        await fetch(
            `${JIKAN_API}/anime/${malId}/episodes?page=${page}`
        );

    if(!response.ok){

        throw new Error(
            `Jikan episódios ${response.status}`
        );
    }

    const json =
        await response.json();

    return {

        data:
            json.data || [],

        hasNext:
            Boolean(
                json.pagination?.has_next_page
            )

    };
}


async function getAllJikanEpisodes(
    malId
){

    let all = [];

    let page = 1;

    let hasNext = true;

    while(
        hasNext &&
        page <= 10
    ){

        const result =
            await getJikanEpisodes(
                malId,
                page
            );

        all =
            all.concat(
                result.data
            );

        hasNext =
            result.hasNext;

        page++;

        if(hasNext){

            await sleep(
                350
            );
        }
    }

    return all;
}


/* =====================================================
   TMDB - PESQUISA
===================================================== */

async function getTMDBSearch(
    title
){

    if(
        !TMDB_API_KEY ||
        !title
    ){

        return null;
    }

    try{

        const url =
            `${TMDB_API}/search/tv` +
            `?api_key=${encodeURIComponent(
                TMDB_API_KEY
            )}` +
            `&query=${encodeURIComponent(
                title
            )}` +
            `&language=pt-PT`;

        const response =
            await fetch(
                url
            );

        if(!response.ok){

            return null;
        }

        const json =
            await response.json();

        if(
            !Array.isArray(
                json.results
            ) ||
            !json.results.length
        ){

            return null;
        }

        return json.results[0];

    }catch(error){

        console.warn(
            "TMDB pesquisa falhou:",
            error
        );

        return null;
    }
}

async function getJikanSeasons(
    anime
){

    const result = [];

    /*
       A obra atual será a primeira
       temporada.
    */

    result.push({

        id:
            anime.mal_id,

        number:
            1,

        title:
            anime.title,

        image:
            jikanPoster(anime),

        year:
            anime.year ||
            getYearFromDate(
                anime.aired?.from
            ),

        malId:
            anime.mal_id,

        source:
            "jikan"

    });


    /*
       Procurar continuações.
    */

    const relations =
        anime.relations || [];

    const relatedIds = [];


    relations.forEach(
        relation => {

            const type =
                String(
                    relation.relation || ""
                ).toLowerCase();

            if(
                type !== "sequel"
            ){

                return;
            }

            (
                relation.entry || []
            ).forEach(
                entry => {

                    if(
                        entry.type ===
                        "anime" &&
                        entry.mal_id
                    ){

                        relatedIds.push(
                            entry.mal_id
                        );
                    }

                }
            );

        }
    );


    /*
       Evitar chamadas repetidas.
    */

    const uniqueIds =
        [
            ...new Set(
                relatedIds
            )
        ];


    for(
        const id of uniqueIds
    ){

        try{

            await sleep(
                350
            );

            const response =
                await fetch(
                    `${JIKAN_API}/anime/${id}`
                );

            if(!response.ok){

                continue;
            }

            const json =
                await response.json();

            if(!json.data){

                continue;
            }

            const item =
                json.data;

            result.push({

                id:
                    item.mal_id,

                title:
                    item.title,

                image:
                    jikanPoster(item),

                year:
                    item.year ||
                    getYearFromDate(
                        item.aired?.from
                    ),

                malId:
                    item.mal_id,

                source:
                    "jikan"

            });

        }catch(error){

            console.warn(
                "Erro ao carregar sequência:",
                error
            );
        }
    }


    return result;
}

        )

            season => ({

                image:

                            season.poster_path
                        )
                        : FALLBACK_IMAGE,

                year:
                    getYearFromDate(
                        season.air_date
                    ),

                episodeCount:
                    season.episode_count,

                source:
                    "tmdb",

                tmdbId:
                    details.id

            })
        );
}


/* =====================================================
   NORMALIZAR TEMPORADAS
===================================================== */

function normalizeSeasons(
    jikanSeasons,
    tmdbSeasons
){

    /*
       Se TMDB possui temporadas,
       usamos TMDB para que o seletor
       mostre corretamente Season 1,
       Season 2, Season 3, etc.
    */

    if(
        tmdbSeasons &&
        tmdbSeasons.length
    ){

        return tmdbSeasons
            .filter(
                season =>
                    season.number >= 1
            )
            .sort(
                (a,b) =>
                    a.number -
                    b.number
            );
    }


    /*
       Caso TMDB falhe,
       usamos Jikan.
    */

    if(
        jikanSeasons &&
        jikanSeasons.length
    ){

        return jikanSeasons
            .map(
                (season,index) => ({

                    ...season,

                    number:
                        index + 1

                })
            );
    }


    return [];
}

function normalizeTMDBEpisodes(
    season
){

    if(
        !season ||
        !Array.isArray(
            season.episodes
        )
    ){

        return [];
    }


    return season.episodes.map(
        episode => ({

            number:
                episode.episode_number,

            title:
                episode.name ||
                `Episódio ${episode.episode_number}`,

            duration:
                episode.runtime
                    ? `${episode.runtime} minutos`
                    : "23 minutos",

            image:
                episode.still_path
                    ? (
                        "https://image.tmdb.org/t/p/w500" +
                        episode.still_path
                    )
                    : FALLBACK_IMAGE,

            overview:
                episode.overview || "",

            source:
                "tmdb"

        })
    );
}


/* =====================================================
   JIKAN - EPISÓDIOS NORMALIZADOS
===================================================== */

function normalizeJikanEpisodes(
    episodes
){

    return episodes.map(
        episode => ({

            number:
                episode.mal_id
                    ? episode.mal_id
                    : episode.episode_id,

            /*
               O número verdadeiro do episódio
               vem de episode.mal_id apenas em
               alguns formatos. episode.title
               continua sendo a fonte principal.
            */

            title:
                episode.title ||
                `Episódio ${episode.episode_id || ""}`,

            duration:
                episode.duration
                    ? formatDuration(
                        episode.duration
                    )
                    : "23 minutos",

            image:
                episode.images?.jpg?.image_url ||
                episode.images?.webp?.image_url ||
                FALLBACK_IMAGE,

            overview:
                episode.synopsis || "",

            episodeId:
                episode.mal_id,

            source:
                "jikan"

        })
    );
}


function formatDuration(
    duration
){

    if(
        typeof duration ===
        "number"
    ){

        return `${duration} minutos`;
    }

    if(
        duration &&
        typeof duration ===
        "string"
    ){

        return duration;
    }

    return "23 minutos";
}

===================================================== */

async function loadEpisodesForSeason(
    seasonNumber
){

    episodesEl.innerHTML = `
        <div class="loading">

            <div class="spinner"></div>

            Carregando episódios da
            Temporada ${seasonNumber}...

        </div>
    `;


    currentEpisodes = [];


    /*
       PRIMEIRA TENTATIVA:
       TMDB
    */

    if(
        currentTMDBDetails &&
        currentTMDBDetails.id
    ){

        const tmdbSeason =
            await getTMDBSeason(
                currentTMDBDetails.id,
                seasonNumber
            );


        const tmdbEpisodes =
            normalizeTMDBEpisodes(
                tmdbSeason
            );


        if(
            tmdbEpisodes.length
        ){

            currentEpisodes =
                tmdbEpisodes;

            renderEpisodes();

            return;
        }
    }


    /*
       SEGUNDA TENTATIVA:
       JIKAN
    */

    let jikanSeason = null;


    if(
        seasons &&
        seasons.length
    ){

        jikanSeason =
            seasons.find(
                season =>
                    Number(
                        season.number
                    ) ===
                    Number(
                        seasonNumber
                    )
            );
    }


    const malId =
        jikanSeason?.malId ||
        currentAnime?.mal_id;


    if(malId){

        try{

            const episodes =
                await getAllJikanEpisodes(
                    malId
                );


            currentEpisodes =
                normalizeJikanEpisodes(
                    episodes
                );

        }catch(error){

            console.warn(
                "Jikan episódios falhou:",
                error
            );

        }
    }


    renderEpisodes();
}

        episodesEl.innerHTML = `
            <div style="
                padding:25px 0;
                color:#777;
                text-align:center;
            ">
                Tenta novamente dentro de alguns segundos.
            </div>
        `;

        return;
    }


    /*
       Render inicial
    */

    renderAnime(
        anime || {},
        tmdb
    );


    /* =================================================
       4. DETALHES TMDB
    ================================================= */

    if(tmdb?.id){

        currentTMDBDetails =
            await getTMDBDetails(
                tmdb.id
            );
    }


    /* =================================================
       5. TEMPORADAS
    ================================================= */

    let jikanSeasons =
        [];


    if(anime){

        try{

            jikanSeasons =
                await getJikanSeasons(
                    anime
                );

        }catch(error){

            console.warn(
                "Jikan temporadas falhou:",
                error
            );
        }
    }


    const tmdbSeasons =
        getTMDBSeasons(
            currentTMDBDetails
        );


    seasons =
        normalizeSeasons(
            jikanSeasons,
            tmdbSeasons
        );


    /*
       Se não houver temporadas,
       criar uma temporária.
    */

    if(
        !seasons.length
    ){

        seasons = [

            {

                number:1,

                title:
                    "Temporada 1",

                image:
                    jikanPoster(
                        anime
                    ),

                malId:
                    anime?.mal_id,

                source:
                    "jikan"

            }

        ];
    }


    /*
       Garantir que a temporada escolhida
       existe.
    */

    const exists =
        seasons.some(
            season =>
                Number(
                    season.number
                ) ===
                Number(
                    selectedSeasonNumber
                )
        );


    if(!exists){

        selectedSeasonNumber =
            Number(
                seasons[0].number
            ) || 1;
    }


    selectedSeasonEl.textContent =
        `Temporada ${selectedSeasonNumber}`;


    renderSeasonMenu();


    /* =================================================
       6. EPISÓDIOS
    ================================================= */

    await loadEpisodesForSeason(
        selectedSeasonNumber
    );

}


/* =====================================================
   INICIAR
===================================================== */

init();

</script>

</body>
</html>
