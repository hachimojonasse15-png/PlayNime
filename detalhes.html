<!DOCTYPE html>
<html lang="pt">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0,user-scalable=no">

<title>PlayNime - Detalhes</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

html,body{
    background:#050505;
    color:#fff;
    min-height:100%;
}

body{
    overflow-x:hidden;
}

/* ==============================
   HEADER
============================== */

.header{

    position:fixed;

    top:0;
    left:0;
    right:0;

    height:70px;

    display:flex;
    align-items:center;

    padding:0 22px;

    z-index:50;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.95),
            rgba(0,0,0,.45),
            transparent
        );
}

.back-button{

    width:42px;
    height:42px;

    border:0;
    border-radius:50%;

    background:rgba(20,20,20,.8);

    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
}

.logo{

    margin-left:14px;

    font-size:25px;
    font-weight:800;
    letter-spacing:-1px;
}

.logo span{
    color:#a84cff;
}

/* ==============================
   HERO
============================== */

.hero{

    position:relative;

    width:100%;
    min-height:650px;

    display:flex;
    align-items:flex-end;

    padding:0 25px 38px;

    overflow:hidden;
}

.hero-background{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    opacity:.48;

    filter:saturate(1.1);
}

.hero-overlay{

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.12) 0%,
            rgba(0,0,0,.2) 35%,
            rgba(5,5,5,.82) 73%,
            #050505 100%
        );
}

.hero-content{

    position:relative;

    z-index:2;

    width:100%;
    max-width:1050px;

    margin:auto;
}

/* ==============================
   POSTER
============================== */

.poster-container{

    width:185px;
    height:270px;

    margin-bottom:22px;

    border-radius:14px;

    overflow:hidden;

    box-shadow:
        0 18px 45px rgba(0,0,0,.7);
}

.poster{

    width:100%;
    height:100%;

    object-fit:cover;
}

/* ==============================
   TÍTULO
============================== */

.title{

    font-size:38px;

    line-height:1.08;

    font-weight:800;

    max-width:850px;

    margin-bottom:15px;
}

/* ==============================
   META
============================== */

.meta{

    display:flex;

    align-items:center;

    flex-wrap:wrap;

    gap:10px;

    margin-bottom:15px;
}

.meta-item{

    color:#ddd;

    font-size:15px;

    font-weight:500;
}

.meta-separator{

    color:#777;

    font-size:16px;
}

.rating{

    color:#ffd34d;

    font-weight:700;
}

/* ==============================
   GÉNEROS
============================== */

.genres{

    display:flex;

    flex-wrap:wrap;

    gap:8px;

    margin-bottom:22px;
}

.genre{

    padding:7px 13px;

    border-radius:20px;

    background:#171717;

    border:1px solid #292929;

    color:#ddd;

    font-size:13px;
}

/* ==============================
   AÇÕES
============================== */

.actions{

    display:flex;

    align-items:center;

    gap:27px;

    margin-bottom:25px;
}

.action-button{

    border:0;

    background:none;

    color:#ddd;

    cursor:pointer;

    display:flex;

    align-items:center;

    gap:7px;

    font-size:14px;

    transition:.2s;
}

.action-button:hover{
    color:#fff;
}

.action-icon{

    width:25px;
    height:25px;

    stroke:currentColor;

    fill:none;

    stroke-width:1.8;

    stroke-linecap:round;

    stroke-linejoin:round;
}

/* ==============================
   FAVORITO
============================== */

.favorite{

    margin-left:auto;

    border:0;

    background:none;

    padding:4px;

    cursor:pointer;

    color:#fff;

    transition:.25s;
}

.favorite svg{

    width:34px;
    height:34px;

    fill:none;

    stroke:currentColor;

    stroke-width:1.8;

    stroke-linecap:round;

    stroke-linejoin:round;

    transition:.25s;
}

.favorite.active{

    color:#ff3155;
}

.favorite.active svg{

    fill:#ff3155;

    stroke:#ff3155;
}

/* ==============================
   SINOPSE
============================== */

.synopsis-section{

    max-width:850px;

    border-top:1px solid rgba(255,255,255,.1);

    padding-top:18px;
}

.synopsis-header{

    width:100%;

    display:flex;

    align-items:center;

    justify-content:space-between;

    cursor:pointer;

    user-select:none;
}

.synopsis-title{

    font-size:21px;

    font-weight:700;
}

.chevron{

    width:28px;
    height:28px;

    color:#aaa;

    transition:.25s;
}

.chevron svg{

    width:100%;
    height:100%;

    fill:none;

    stroke:currentColor;

    stroke-width:2;

    stroke-linecap:round;

    stroke-linejoin:round;
}

.synopsis-header.open .chevron{

    transform:rotate(180deg);

    color:#a84cff;
}

.synopsis{

    color:#cfcfcf;

    font-size:15px;

    line-height:1.7;

    margin-top:10px;

    display:-webkit-box;

    -webkit-box-orient:vertical;

    -webkit-line-clamp:3;

    overflow:hidden;

    transition:.25s;
}

.synopsis.expanded{

    display:block;

    -webkit-line-clamp:unset;
}

/* ==============================
   CONTEÚDO
============================== */

.main{

    max-width:1050px;

    margin:auto;

    padding:10px 25px 100px;
}

.section-title{

    font-size:26px;

    font-weight:800;

    margin:30px 0 17px;
}

/* ==============================
   TEMPORADAS
============================== */

.seasons{

    display:flex;

    gap:15px;

    overflow-x:auto;

    scrollbar-width:none;

    padding-bottom:10px;
}

.seasons::-webkit-scrollbar{
    display:none;
}

.season-card{

    flex-shrink:0;

    width:150px;

    background:#141414;

    border:1px solid #252525;

    border-radius:13px;

    overflow:hidden;

    transition:.25s;

    cursor:pointer;
}

.season-card:hover{

    transform:translateY(-4px);

    border-color:#9b43ff;
}

.season-image{

    width:100%;
    height:205px;

    object-fit:cover;

    background:#1a1a1a;
}

.season-info{

    padding:11px;
}

.season-name{

    font-size:14px;

    font-weight:700;
}

.season-year{

    color:#888;

    font-size:12px;

    margin-top:5px;
}

/* ==============================
   TOAST
============================== */

.toast{

    position:fixed;

    left:50%;
    bottom:30px;

    transform:
        translate(-50%,100px);

    opacity:0;

    background:#171717;

    border:1px solid #333;

    border-radius:10px;

    padding:12px 18px;

    font-size:14px;

    color:#fff;

    z-index:100;

    transition:.3s;

    box-shadow:
        0 10px 30px rgba(0,0,0,.5);
}

.toast.show{

    opacity:1;

    transform:
        translate(-50%,0);
}

/* ==============================
   RESPONSIVO
============================== */

@media(max-width:650px){

    .header{
        height:64px;
        padding:0 18px;
    }

    .logo{
        font-size:23px;
    }

    .hero{

        min-height:700px;

        padding:
            0 20px
            30px;
    }

    .poster-container{

        width:145px;
        height:215px;

        margin-bottom:18px;

        border-radius:12px;
    }

    .title{

        font-size:30px;

        max-width:100%;
    }

    .meta{

        gap:7px;

        margin-bottom:12px;
    }

    .meta-item{
        font-size:13px;
    }

    .genres{

        gap:7px;

        margin-bottom:18px;
    }

    .genre{

        padding:6px 10px;

        font-size:11px;
    }

    .actions{

        gap:20px;

        margin-bottom:20px;
    }

    .action-button{

        font-size:12px;
    }

    .action-icon{

        width:23px;
        height:23px;
    }

    .favorite svg{

        width:32px;
        height:32px;
    }

    .synopsis-title{

        font-size:19px;
    }

    .synopsis{

        font-size:14px;

        line-height:1.6;
    }

    .main{

        padding:
            5px
            20px
            90px;
    }

    .section-title{

        font-size:23px;
    }

    .season-card{

        width:130px;
    }

    .season-image{

        height:175px;
    }
}

</style>

</head>

<body>

<!-- ==============================
     HEADER
============================== -->

<header class="header">

    <button
        class="back-button"
        onclick="history.back()"
        aria-label="Voltar">

        <svg
            width="25"
            height="25"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round">

            <path d="M15 18l-6-6 6-6"/>

        </svg>

    </button>


    <div class="logo">
        Play<span>Nime</span>
    </div>

</header>


<!-- ==============================
     HERO
============================== -->

<section class="hero">

    <img
        id="heroBackground"
        class="hero-background"
        src=""
        alt="">

    <div class="hero-overlay"></div>


    <div class="hero-content">

        <div class="poster-container">

            <img
                id="poster"
                class="poster"
                src=""
                alt="">

        </div>


        <h1
            id="animeTitle"
            class="title">

        </h1>

            class="meta">

        <!-- ==========================
             AÇÕES

        <div class="actions">


            <!-- PARTILHAR -->

            <button
                id="shareButton"
                class="action-button"
                type="button">

                <svg

                    viewBox="0 0 24 24">

                    <circle
                        cx="18"

                    <circle

                    <circle

                        r="2"/>

                    <line
                        x1="8"

                    <line

                </svg>

            <!-- COMENTÁRIOS -->

            <button
                id="commentsButton"

                type="button">

                <svg
                    class="action-icon"
                    viewBox="0 0 24 24">

                    <path
                        d="M20 11.5
                           a7.5 7.5 0 0 1-7.5 7.5

                           L4 20l1.2-3.7
                           A7.5 7.5 0 1 1 20 11.5z"/>

                </svg>

                <span>Comentários</span>

            </button>


            <!-- FAVORITO -->

            <button
                id="favoriteButton"
                class="favorite"

                <svg
                    viewBox="0 0 24 24">

                    <path

                           c0 5.5-8.8 10.2-8.8 10.2

                    </svg>

                id="synopsis"

                Carregando sinopse...

            </p>

        </div>

    </div>

</section>


<!-- ==============================
     TEMPORADAS
============================== -->

<main class="main">

    <h2 class="section-title">
        Temporadas
    </h2>

    <div
        id="seasons"
        class="seasons">
    </div>

</main>


<div
    id="toast"
    class="toast">
</div>

<script>

/* ==========================================
   APIs
========================================== */

const JIKAN_API =
    "https://api.jikan.moe/v4";

const TMDB_API =
    "https://api.themoviedb.org/3";

const TMDB_API_KEY =
    "8e893942e01c23b312df265d558e27fc";


/* ==========================================
   ID DO ANIME
========================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const animeId =
    params.get("id");


/* ==========================================
   ELEMENTOS
========================================== */

const titleEl =
    document.getElementById(
        "animeTitle"
    );

const posterEl =
    document.getElementById(
        "poster"
    );

const backgroundEl =
    document.getElementById(
        "heroBackground"
    );

const metaEl =
    document.getElementById(
        "meta"
    );

const genresEl =
    document.getElementById(
        "genres"
    );

const synopsisEl =
    document.getElementById(
        "synopsis"
    );

const synopsisHeader =
    document.getElementById(
        "synopsisHeader"
    );

const favoriteButton =
    document.getElementById(
        "favoriteButton"
    );

const shareButton =
    document.getElementById(
        "shareButton"
    );

const commentsButton =
    document.getElementById(
        "commentsButton"
    );

const seasonsEl =
    document.getElementById(
        "seasons"
    );

const toast =
    document.getElementById(
        "toast"
    );


/* ==========================================
   FALLBACK
========================================== */

const FALLBACK =
    "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg"
             width="500"
             height="750">

            <rect
                width="100%"
                height="100%"
                fill="#151515"/>

            <text
                x="50%"
                y="50%"
                text-anchor="middle"
                fill="#777"
                font-size="30">

                PlayNime

            </text>

        </svg>
    `);


/* ==========================================
   TOAST
========================================== */

function showToast(text){

    toast.textContent =
        text;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        window.toastTimeout
    );

    window.toastTimeout =
        setTimeout(() => {

            toast.classList.remove(
                "show"
            );

        },2200);
}


/* ==========================================
   SINOPSE EXPANDIR / RECOLHER
========================================== */

synopsisHeader.addEventListener(
    "click",
    () => {

        synopsisEl.classList.toggle(
            "expanded"
        );

        synopsisHeader.classList.toggle(
            "open"
        );

    }
);


/* ==========================================
   FAVORITOS
========================================== */

function getFavorites(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "playNimeFavorites"
            )
        ) || [];

    }catch(error){

        return [];

    }
}


function saveFavorites(
    favorites
){

    localStorage.setItem(
        "playNimeFavorites",
        JSON.stringify(
            favorites
        )
    );
}


function isFavorite(){

    return getFavorites()
        .some(
            anime =>
                String(anime.id) ===
                String(animeId)
        );
}


function updateFavorite(){

    if(isFavorite()){

        favoriteButton.classList.add(
            "active"
        );

    }else{

        favoriteButton.classList.remove(
            "active"
        );

    }
}


favoriteButton.addEventListener(
    "click",
    () => {

        const favorites =
            getFavorites();

        const index =
            favorites.findIndex(
                anime =>
                    String(anime.id) ===
                    String(animeId)
            );


        if(index !== -1){

            favorites.splice(
                index,
                1
            );

            saveFavorites(
                favorites
            );

            updateFavorite();

            showToast(
                "Removido dos favoritos"
            );

            return;
        }


        const favoriteAnime = {

            id:
                animeId,

            title:
                titleEl.textContent,

            poster:
                posterEl.src,

            background:
                backgroundEl.src

        };


        favorites.push(
            favoriteAnime
        );

        saveFavorites(
            favorites
        );

        updateFavorite();

        showToast(
            "Adicionado aos favoritos"
        );

    }
);


/* ==========================================
   PARTILHAR
========================================== */

shareButton.addEventListener(
    "click",
    async () => {

        const shareData = {

            title:
                titleEl.textContent,

            text:
                "Confira este anime no PlayNime",

            url:
                window.location.href

        };


        try{

            if(
                navigator.share
            ){

                await navigator.share(
                    shareData
                );

            }else{

                await navigator.clipboard.writeText(
                    window.location.href
                );

                showToast(
                    "Link copiado"
                );

            }

        }catch(error){

            console.log(
                "Partilha cancelada"
            );

        }

    }
);


/* ==========================================
   COMENTÁRIOS
========================================== */

commentsButton.addEventListener(
    "click",
    () => {

        showToast(
            "Comentários estarão disponíveis em breve"
        );

    }
);


/* ==========================================
   JIKAN
========================================== */

async function getJikan(){

    const response =
        await fetch(
            `${JIKAN_API}/anime/${animeId}/full`
        );


    if(!response.ok){

        throw new Error(
            "Erro Jikan"
        );

    }


    const json =
        await response.json();


    if(!json.data){

        throw new Error(
            "Anime não encontrado"
        );

    }


    return json.data;
}


/* ==========================================
   TMDB
========================================== */

async function getTMDB(
    title
){

    if(
        !TMDB_API_KEY ||
        TMDB_API_KEY ===
        "8e893942e01c23b312df265d558e27fc"
    ){

        return null;
    }


    try{

        const url =
            `${TMDB_API}/search/tv` +
            `?api_key=${encodeURIComponent(
                TMDB_API_KEY
            )}` +
            `&query=${encodeURIComponent(
                title
            )}` +
            `&language=pt-PT`;


        const response =
            await fetch(
                url
            );


        if(!response.ok){

            return null;

        }


        const json =
            await response.json();


        return json.results?.[0]
            || null;

    }catch(error){

        console.log(
            "TMDB indisponível"
        );

        return null;

    }
}


/* ==========================================
   IMAGENS
========================================== */

function jikanPoster(
    anime
){

    return (
        anime?.images?.webp?.large_image_url ||
        anime?.images?.jpg?.large_image_url ||
        FALLBACK
    );
}


function jikanBackground(
    anime
){

    return (
        anime?.images?.webp?.large_image_url ||
        anime?.images?.jpg?.large_image_url ||
        FALLBACK
    );
}


function tmdbPoster(
    tmdb
){

    if(
        tmdb?.poster_path
    ){

        return (
            "https://image.tmdb.org/t/p/w500" +
            tmdb.poster_path
        );

    }

    return null;
}


function tmdbBackground(
    tmdb
){

    if(
        tmdb?.backdrop_path
    ){

        return (
            "https://image.tmdb.org/t/p/w1280" +
            tmdb.backdrop_path
        );

    }

    return null;
}


/* ==========================================
   RENDER
========================================== */

function renderAnime(
    anime,
    tmdb
){

    const title =
        anime.title ||
        anime.title_english ||
        "Anime";


    titleEl.textContent =
        title;


    const poster =
        tmdbPoster(tmdb) ||
        jikanPoster(anime);


    const background =
        tmdbBackground(tmdb) ||
        jikanBackground(anime);


    posterEl.src =
        poster;

    backgroundEl.src =
        background;


    posterEl.onerror =
        () => {

            posterEl.src =
                jikanPoster(anime);

        };


    backgroundEl.onerror =
        () => {

            backgroundEl.src =
                jikanBackground(anime);

        };


    /* ======================================
       NOTA + ANO
    ====================================== */

    const rating =
        anime.score ??
        tmdb?.vote_average;


    let year = "";


    if(anime.year){

        year =
            anime.year;

    }else if(
        anime.aired?.from
    ){

        year =
            new Date(
                anime.aired.from
            ).getFullYear();

    }else if(
        tmdb?.first_air_date
    ){

        year =
            new Date(
                tmdb.first_air_date
            ).getFullYear();

    }


    metaEl.innerHTML =
        "";


    if(rating){

        metaEl.innerHTML += `

            <span
                class="meta-item rating">

                ★ ${Number(
                    rating
                ).toFixed(1)}

            </span>

            <span
                class="meta-separator">

                •

            </span>

        `;

    }


    if(year){

        metaEl.innerHTML += `

            <span
                class="meta-item">

                ${year}

            </span>

        `;

    }


    /* ======================================
       GÉNEROS
    ====================================== */

    genresEl.innerHTML =
        "";


    (anime.genres || [])
        .forEach(
            genre => {

                const element =
                    document.createElement(
                        "span"
                    );

                element.className =
                    "genre";

                element.textContent =
                    genre.name;

                genresEl.appendChild(
                    element
                );

            }
        );


    /* ======================================
       SINOPSE
    ====================================== */

    synopsisEl.textContent =
        anime.synopsis ||
        tmdb?.overview ||
        "Sinopse não disponível.";


    /* ======================================
       FAVORITO
    ====================================== */

    updateFavorite();


    /* ======================================
       TEMPORADAS
    ====================================== */

    renderSeasons(
        anime
    );
}


/* ==========================================
   TEMPORADAS
========================================== */

function renderSeasons(
    anime
){

    seasonsEl.innerHTML =
        "";


    addSeason(
        anime,
        "Temporada atual"
    );


    const relations =
        anime.relations || [];


    relations.forEach(
        relation => {

            const type =
                String(
                    relation.relation ||
                    ""
                ).toLowerCase();


            if(
                type !== "sequel" &&
                type !== "prequel"
            ){

                return;

            }


            (relation.entry || [])
                .forEach(
                    entry => {

                        if(
                            entry.type ===
                            "anime"
                        ){

                            loadSeason(
                                entry.mal_id
                            );

                        }

                    }
                );

        }
    );
}


function addSeason(
    anime,
    label
){

    const card =
        document.createElement(
            "div"
        );

    card.className =
        "season-card";


    const year =
        anime.year ||
        (
            anime.aired?.from
                ? new Date(
                    anime.aired.from
                ).getFullYear()
                : ""
        );


    card.innerHTML = `

        <img
            class="season-image"
            src="${jikanPoster(
                anime
            )}"
            alt="">

        <div
            class="season-info">

            <div
                class="season-name">

                ${label}

            </div>

            <div
                class="season-year">

                ${year || ""}

            </div>

        </div>

    `;


    seasonsEl.appendChild(
        card
    );
}


async function loadSeason(
    id
){

    try{

        const response =
            await fetch(
                `${JIKAN_API}/anime/${id}/full`
            );


        if(!response.ok){

            return;

        }


        const json =
            await response.json();


        if(!json.data){

            return;

        }


        addSeason(
            json.data,
            json.data.title
        );

    }catch(error){

        console.log(
            "Erro ao carregar temporada"
        );

    }
}


/* ==========================================
   INICIAR
========================================== */

async function init(){

    try{

        if(!animeId){

            throw new Error(
                "ID ausente"
            );

        }


        const anime =
            await getJikan();


        const title =
            anime.title ||
            anime.title_english ||
            "";


        const tmdb =
            await getTMDB(
                title
            );


        renderAnime(
            anime,
            tmdb
        );


    }catch(error){

        console.error(
            error
        );


        titleEl.textContent =
            "Anime não encontrado";


        synopsisEl.textContent =
            "Não foi possível carregar os detalhes deste anime.";


        posterEl.src =
            FALLBACK;

        backgroundEl.src =
            FALLBACK;

    }

}


init();

</script>
