<!DOCTYPE html>
<html lang="pt">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>PlayNime - Detalhes</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

html{
    background:#080808;
}

body{
    background:#080808;
    color:#fff;
    min-height:100vh;
    overflow-x:hidden;
}

/* ===============================
   VARIÁVEIS
================================ */

:root{
    --purple:#9b4dff;
    --purple-light:#b875ff;
    --yellow:#ffd43b;
    --red:#ff3b4f;
    --card:#151515;
    --border:#272727;
    --muted:#a7a7a7;
}

/* ===============================
   BANNER
================================ */

.hero{
    position:relative;
    width:100%;
    min-height:560px;
    background:#101010;
    overflow:hidden;
}

.hero-backdrop{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
}

.hero-content{
    position:absolute;
    left:28px;
    right:28px;
    bottom:35px;
    z-index:3;
}

.top-actions{
    position:absolute;
    top:25px;
    left:22px;
    right:22px;
    display:flex;
    justify-content:space-between;
    z-index:5;
}

.icon-button{
    width:48px;
    height:48px;
    border:1px solid rgba(255,255,255,.25);
    border-radius:15px;
    background:rgba(0,0,0,.35);
    backdrop-filter:blur(8px);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

.icon-button svg{
    width:25px;
    height:25px;
    stroke:currentColor;
}

.hero-title{
    font-size:42px;
    font-weight:800;
    line-height:1.08;
    max-width:850px;
    margin-bottom:18px;
    text-shadow:0 2px 12px rgba(0,0,0,.85);
}

.meta-row{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:15px;
    margin-bottom:18px;
}

.rating{
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--yellow);
    font-size:20px;
    font-weight:700;
}

.rating svg{
    width:22px;
    height:22px;
    fill:var(--yellow);
    stroke:var(--yellow);
}

.year{
    color:#fff;
    font-size:19px;
    font-weight:600;
}

.genre-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.genre{
    padding:9px 16px;
    border:1px solid rgba(255,255,255,.25);
    border-radius:22px;
    background:rgba(0,0,0,.42);
    backdrop-filter:blur(7px);
    color:#fff;
    font-size:14px;
}

/* ===============================
   ÁREA PRINCIPAL
================================ */

.main{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:0 28px 80px;
}

/* ===============================
   AÇÕES
================================ */

.action-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    padding:22px 0;
    border-bottom:1px solid var(--border);
}

.action-card{
    min-height:90px;
    border:1px solid var(--border);
    background:#111;
    border-radius:18px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    color:#fff;
    cursor:pointer;
    transition:.2s;
}

.action-card:hover{
    background:#181818;
    border-color:#3b3b3b;
}

.action-card svg{
    width:28px;
    height:28px;
    stroke:currentColor;
}

.action-card span{
    font-size:14px;
    color:#ddd;
}

.favorite-icon{
    color:#fff;
}

.favorite-card.active{
    border-color:var(--red);
}

.favorite-card.active .favorite-icon{
    color:var(--red);
    fill:var(--red);
}

/* ===============================
   TOAST
================================ */

.toast{
    position:fixed;
    left:50%;
    bottom:30px;
    transform:translate(-50%,20px);
    background:#1b1b1b;
    border:1px solid #333;
    color:#fff;
    padding:13px 20px;
    border-radius:12px;
    opacity:0;
    pointer-events:none;
    z-index:100;
    transition:.25s;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* ===============================
   SINOPSE
================================ */

.synopsis{
    padding:25px 0 10px;
}

.synopsis-text{
    color:#fff;
    font-size:17px;
    line-height:1.7;
    max-height:115px;
    overflow:hidden;
    transition:max-height .35s ease;
}

.synopsis-text.expanded{
    max-height:2000px;
}

.synopsis-toggle{
    width:100%;
    height:45px;
    border:0;
    background:transparent;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
}

.synopsis-toggle svg{
    width:27px;
    height:27px;
    stroke:#fff;
    transition:.25s;
}

.synopsis-toggle.open svg{
    transform:rotate(180deg);
}

/* ===============================
   TEMPORADAS
================================ */

.seasons{
    margin-top:28px;
}

.season-selector{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#151515;
    border:1px solid var(--border);
    border-radius:15px;
    padding:16px 18px;
    color:#fff;
    font-size:16px;
    cursor:pointer;
}

.season-selector svg{
    width:22px;
    height:22px;
    stroke:#fff;
}

.season-list{
    display:none;
    margin-top:8px;
    background:#151515;
    border:1px solid var(--border);
    border-radius:15px;
    overflow:hidden;
}

.season-list.show{
    display:block;
}

.season-option{
    padding:15px 18px;
    color:#fff;
    border-bottom:1px solid #252525;
    cursor:pointer;
}

.season-option:last-child{
    border-bottom:0;
}

.season-option:hover{
    background:#202020;
}

.season-option.selected{
    background:#241435;
    color:var(--purple-light);
}

/* ===============================
   EPISÓDIOS
================================ */

.episodes{
    margin-top:25px;
}

.episode{
    display:flex;
    gap:14px;
    padding:12px 0;
    border-bottom:1px solid var(--border);
    cursor:pointer;
}

.episode-thumb{
    width:120px;
    height:68px;
    border-radius:9px;
    object-fit:cover;
    background:#181818;
    flex-shrink:0;
}

.episode-info{
    display:flex;
    flex-direction:column;
    justify-content:center;
    min-width:0;
}

.episode-title{
    color:#fff;
    font-size:15px;
    font-weight:700;
    line-height:1.35;
}

.episode-meta{
    color:#999;
    font-size:13px;
    margin-top:7px;
}

.loading{
    color:#888;
    text-align:center;
    padding:30px 0;
}

/* ===============================
   RESPONSIVO
================================ */

@media(max-width:600px){

    .hero{
        min-height:500px;
    }

    .hero-content{
        left:20px;
        right:20px;
        bottom:28px;
    }

    .hero-title{
        font-size:34px;
    }

    .main{
        padding-left:20px;
        padding-right:20px;
    }

    .action-grid{
        gap:8px;
    }

    .action-card{
        min-height:82px;
    }

    .action-card span{
        font-size:13px;
    }

    .episode-thumb{
        width:105px;
        height:60px;
    }
}

</style>
</head>

<body>

<div class="hero">

    <img
        id="heroBackdrop"
        class="hero-backdrop"
        src=""
        alt="">

    <div class="top-actions">

        <button
            class="icon-button"
            onclick="history.back()"
            aria-label="Voltar">

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2">

                <path d="M19 12H5"/>
                <path d="M12 19l-7-7 7-7"/>

            </svg>

        </button>

        <button
            class="icon-button"
            onclick="showToast('Notificações')"
            aria-label="Notificações">

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2">

                <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
                <path d="M10 21h4"/>

            </svg>

        </button>

    </div>

    <div class="hero-content">

        <h1
            id="animeTitle"
            class="hero-title">
            Carregando...
        </h1>

        <div class="meta-row">

            <div class="rating">

                <svg
                    viewBox="0 0 24 24">

                    <path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1L12 2z"/>

                </svg>

                <span id="animeRating">--</span>

            </div>

            <div
                id="animeYear"
                class="year">
                ----
            </div>

        </div>

        <div
            id="genreRow"
            class="genre-row">
        </div>

    </div>

</div>

<div class="main">

    <div class="action-grid">

        <button
            class="action-card"
            onclick="shareAnime()">

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2">

                <circle cx="18" cy="5" r="3"/>
                <circle cx="6" cy="12" r="3"/>
                <circle cx="18" cy="19" r="3"/>
                <path d="M8.6 13.5l6.8 4"/>
                <path d="M15.4 6.5l-6.8 4"/>

            </svg>

            <span>Partilhar</span>

        </button>

        <button
            class="action-card"
            onclick="openComments()">

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2">

                <path d="M20 11.5a7.5 7.5 0 0 1-8 7.5 8.8 8.8 0 0 1-3.5-.7L4 20l1.3-3.7A7.1 7.1 0 0 1 4 11.5 7.5 7.5 0 0 1 12 4a7.5 7.5 0 0 1 8 7.5z"/>

            </svg>

            <span>Comentários</span>

        </button>

        <button
            id="favoriteButton"
            class="action-card favorite-card"
            onclick="toggleFavorite()">

            <svg
                class="favorite-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8">

                <path d="M20.8 8.7c0 5.5-8.8 11-8.8 11S3.2 14.2 3.2 8.7A4.7 4.7 0 0 1 12 6.2a4.7 4.7 0 0 1 8.8 2.5z"/>

            </svg>

            <span>Favoritos</span>

        </button>

    </div>

    <div class="synopsis">

        <div
            id="synopsisText"
            class="synopsis-text">
            Carregando sinopse...
        </div>

        <button
            id="synopsisToggle"
            class="synopsis-toggle"
            onclick="toggleSynopsis()"
            aria-label="Expandir sinopse">

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2">

                <path d="M6 9l6 6 6-6"/>

            </svg>

        </button>

    </div>

    <div class="seasons">

        <button
            id="seasonSelector"
            class="season-selector"
            onclick="toggleSeasonList()">

            <span id="selectedSeason">
                Temporada 1
            </span>

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2">

                <path d="M6 9l6 6 6-6"/>

            </svg>

        </button>

        <div
            id="seasonList"
            class="season-list">
        </div>

    </div>

    <div
        id="episodes"
        class="episodes">

        <div class="loading">
            Carregando episódios...
        </div>

    </div>

</div>

<div
    id="toast"
    class="toast">
</div>

<script>

/* ==========================================
   CONFIGURAÇÃO
========================================== */

const JIKAN_API =
    "https://api.jikan.moe/v4";

const TMDB_API_KEY =
    "COLE_SUA_CHAVE_TMDB_AQUI";

const TMDB_API =
    "https://api.themoviedb.org/3";

const TMDB_IMAGE =
    "https://image.tmdb.org/t/p/original";

const TMDB_POSTER =
    "https://image.tmdb.org/t/p/w500";

const params =
    new URLSearchParams(
        window.location.search
    );

const animeId =
    params.get("id");

let animeData = null;
let tmdbData = null;
let selectedSeasonNumber = 1;
let seasonsData = [];

/* ==========================================
   INÍCIO
========================================== */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        if(!animeId){

            document.getElementById(
                "animeTitle"
            ).textContent =
                "Anime não encontrado";

            return;
        }

        loadAnime();

    }
);

                  <script>

/* ==========================================
   CARREGAR ANIME JIKAN
========================================== */

async function loadAnime(){

    try{

        const response =
            await fetch(
                `${JIKAN_API}/anime/${animeId}/full`
            );

        if(!response.ok){
            throw new Error(
                "Erro Jikan"
            );
        }

        const json =
            await response.json();

        animeData =
            json.data;

        renderAnime();

        await findTMDBAnime();

    }catch(error){

        console.error(error);

        document.getElementById(
            "animeTitle"
        ).textContent =
            "Não foi possível carregar o anime";

    }

}

/* ==========================================
   MOSTRAR DADOS
========================================== */

function renderAnime(){

    const title =
        animeData.title ||
        animeData.title_english ||
        "Anime";

    document.getElementById(
        "animeTitle"
    ).textContent =
        title;

    const score =
        animeData.score;

    document.getElementById(
        "animeRating"
    ).textContent =
        score
        ? Number(score).toFixed(2)
        : "--";

    let year = "----";

    if(animeData.aired){

        const from =
            animeData.aired.from;

        if(from){

            year =
                new Date(from)
                .getFullYear();

        }

    }

    document.getElementById(
        "animeYear"
    ).textContent =
        year;

    const genres =
        [
            ...(animeData.genres || []),
            ...(animeData.themes || [])
        ];

    const genreRow =
        document.getElementById(
            "genreRow"
        );

    genreRow.innerHTML = "";

    genres
        .slice(0,5)
        .forEach(item => {

            const el =
                document.createElement(
                    "div"
                );

            el.className =
                "genre";

            el.textContent =
                item.name;

            genreRow.appendChild(
                el
            );

        });

    const synopsis =
        animeData.synopsis ||
        "Sinopse indisponível.";

    document.getElementById(
        "synopsisText"
    ).textContent =
        synopsis;

    setJikanPoster();

    loadJikanEpisodes();

}

/* ==========================================
   POSTER TEMPORÁRIO JIKAN
========================================== */

function setJikanPoster(){

    const image =
        animeData.images &&
        animeData.images.jpg &&
        animeData.images.jpg.large_image_url;

    if(image){

        document.getElementById(
            "heroBackdrop"
        ).src =
            image;

    }

}

/* ==========================================
   BUSCAR NO TMDB
========================================== */

async function findTMDBAnime(){

    if(
        !TMDB_API_KEY ||
        TMDB_API_KEY ===
        "COLE_SUA_CHAVE_TMDB_AQUI"
    ){

        console.warn(
            "Chave TMDB ainda não configurada."
        );

        return;

    }

    try{

        const title =
            animeData.title_english ||
            animeData.title;

        const url =
            `${TMDB_API}/search/tv` +
            `?api_key=${encodeURIComponent(TMDB_API_KEY)}` +
            `&query=${encodeURIComponent(title)}` +
            `&language=pt-BR`;

        const response =
            await fetch(url);

        if(!response.ok){
            return;
        }

        const json =
            await response.json();

        if(
            !json.results ||
            !json.results.length
        ){

            return;
        }

        /* tenta encontrar o resultado
           mais parecido */

        const originalTitle =
            animeData.title;

        let result =
            json.results.find(
                item =>
                    item.name &&
                    item.name.toLowerCase()
                    === title.toLowerCase()
            );

        if(!result){

            result =
                json.results.find(
                    item =>
                        item.original_name &&
                        item.original_name
                        .toLowerCase()
                        === originalTitle
                        .toLowerCase()
                );

        }

        if(!result){

            result =
                json.results[0];

        }

        tmdbData =
            result;

        applyTMDBBanner();

        await loadTMDBDetails();

    }catch(error){

        console.warn(
            "TMDB indisponível:",
            error
        );

    }

}

/* ==========================================
   APLICAR BANNER TMDB
========================================== */

function applyTMDBBanner(){

    if(
        !tmdbData ||
        !tmdbData.backdrop_path
    ){

        return;
    }

    const banner =
        TMDB_IMAGE +
        tmdbData.backdrop_path;

    const image =
        document.getElementById(
            "heroBackdrop"
        );

    image.src =
        banner;

}

/* ==========================================
   DETALHES TMDB
========================================== */

async function loadTMDBDetails(){

    if(
        !tmdbData ||
        !tmdbData.id
    ){

        return;
    }

    try{

        const url =
            `${TMDB_API}/tv/${tmdbData.id}` +
            `?api_key=${encodeURIComponent(TMDB_API_KEY)}` +
            `&language=pt-BR`;

        const response =
            await fetch(url);

        if(!response.ok){
            return;
        }

        const data =
            await response.json();

        tmdbData =
            {
                ...tmdbData,
                ...data
            };

        createSeasonList();

    }catch(error){

        console.warn(error);

    }

}

/* ==========================================
   TEMPORADAS
========================================== */

function createSeasonList(){

    if(
        !tmdbData ||
        !tmdbData.seasons
    ){

        createFallbackSeason();

        return;
    }

    seasonsData =
        tmdbData.seasons
        .filter(
            season =>
                season.season_number >= 0
        );

    if(!seasonsData.length){

        createFallbackSeason();

        return;
    }

    const list =
        document.getElementById(
            "seasonList"
        );

    list.innerHTML = "";

    seasonsData.forEach(
        season => {

            const option =
                document.createElement(
                    "div"
                );

            option.className =
                "season-option";

            if(
                season.season_number ===
                selectedSeasonNumber
            ){

                option.classList.add(
                    "selected"
                );

            }

            option.textContent =
                season.season_number === 0
                ? "Especiais"
                : `Temporada ${season.season_number}`;

            option.onclick =
                () => {

                    selectedSeasonNumber =
                        season.season_number;

                    document.getElementById(
                        "selectedSeason"
                    ).textContent =
                        option.textContent;

                    document
                        .querySelectorAll(
                            ".season-option"
                        )
                        .forEach(
                            el =>
                                el.classList
                                .remove(
                                    "selected"
                                )
                        );

                    option.classList.add(
                        "selected"
                    );

                    document
                        .getElementById(
                            "seasonList"
                        )
                        .classList
                        .remove(
                            "show"
                        );

                    loadTMDBEpisodes(
                        selectedSeasonNumber
                    );

                };

            list.appendChild(
                option
            );

        }
    );

    loadTMDBEpisodes(
        selectedSeasonNumber
    );

}

/* ==========================================
   TEMPORADA FALLBACK
========================================== */

function createFallbackSeason(){

    seasonsData = [
        {
            season_number:1,
            name:"Temporada 1"
        }
    ];

    document.getElementById(
        "selectedSeason"
    ).textContent =
        "Temporada 1";

    loadJikanEpisodes();

}

<script>

/* ==========================================
   EPISÓDIOS TMDB
========================================== */

async function loadTMDBEpisodes(
    seasonNumber
){

    if(
        !tmdbData ||
        !tmdbData.id
    ){

        loadJikanEpisodes();

        return;
    }

    const episodes =
        document.getElementById(
            "episodes"
        );

    episodes.innerHTML =
        `<div class="loading">
            Carregando episódios...
        </div>`;

    try{

        const url =
            `${TMDB_API}/tv/${tmdbData.id}` +
            `/season/${seasonNumber}` +
            `?api_key=${encodeURIComponent(TMDB_API_KEY)}` +
            `&language=pt-BR`;

        const response =
            await fetch(url);

        if(!response.ok){

            loadJikanEpisodes();

            return;
        }

        const json =
            await response.json();

        if(
            !json.episodes ||
            !json.episodes.length
        ){

            loadJikanEpisodes();

            return;
        }

        renderEpisodes(
            json.episodes
        );

    }catch(error){

        console.warn(error);

        loadJikanEpisodes();

    }

}

/* ==========================================
   EPISÓDIOS JIKAN
========================================== */

async function loadJikanEpisodes(){

    if(!animeId){
        return;
    }

    const episodes =
        document.getElementById(
            "episodes"
        );

    episodes.innerHTML =
        `<div class="loading">
            Carregando episódios...
        </div>`;

    try{

        const response =
            await fetch(
                `${JIKAN_API}/anime/${animeId}/episodes?page=1`
            );

        if(!response.ok){

            episodes.innerHTML = "";

            return;
        }

        const json =
            await response.json();

        const data =
            json.data || [];

        renderEpisodes(
            data
        );

    }catch(error){

        console.warn(error);

        episodes.innerHTML = "";

    }

}

/* ==========================================
   RENDER EPISÓDIOS
========================================== */

function renderEpisodes(
    episodeList
){

    const container =
        document.getElementById(
            "episodes"
        );

    container.innerHTML = "";

    if(
        !episodeList ||
        !episodeList.length
    ){

        container.innerHTML =
            `<div class="loading">
                Nenhum episódio disponível.
            </div>`;

        return;
    }

    episodeList.forEach(
        (episode,index) => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "episode";

            let image =
                "";

            let number =
                episode.episode_number;

            let title =
                episode.name ||
                episode.title ||
                `Episódio ${number || index+1}`;

            let duration =
                "";

            if(
                episode.still_path
            ){

                image =
                    "https://image.tmdb.org/t/p/w300" +
                    episode.still_path;

            }else if(
                animeData &&
                animeData.images &&
                animeData.images.jpg
            ){

                image =
                    animeData.images.jpg
                    .large_image_url;

            }

            if(
                episode.runtime
            ){

                duration =
                    `${episode.runtime} min`;

            }else{

                duration =
                    "24 min";

            }

            item.innerHTML = `

                <img
                    class="episode-thumb"
                    src="${escapeHTML(image)}"
                    alt="">

                <div class="episode-info">

                    <div class="episode-title">
                        ${escapeHTML(
                            number
                            ? `${number}. ${title}`
                            : title
                        )}
                    </div>

                    <div class="episode-meta">
                        ${escapeHTML(duration)}
                    </div>

                </div>

            `;

            item.onclick =
                () => {

                    showToast(
                        "Episódio selecionado"
                    );

                };

            container.appendChild(
                item
            );

        }
    );

}

/* ==========================================
   EXPANDIR SINOPSE
========================================== */

function toggleSynopsis(){

    const text =
        document.getElementById(
            "synopsisText"
        );

    const button =
        document.getElementById(
            "synopsisToggle"
        );

    text.classList.toggle(
        "expanded"
    );

    button.classList.toggle(
        "open"
    );

}

/* ==========================================
   TEMPORADA MENU
========================================== */

function toggleSeasonList(){

    document.getElementById(
        "seasonList"
    ).classList.toggle(
        "show"
    );

}

/* ==========================================
   FAVORITOS
========================================== */

function toggleFavorite(){

    if(!animeData){
        return;
    }

    const button =
        document.getElementById(
            "favoriteButton"
        );

    const key =
        `playnime_favorite_${animeId}`;

    const active =
        localStorage.getItem(
            key
        ) === "true";

    if(active){

        localStorage.removeItem(
            key
        );

        button.classList.remove(
            "active"
        );

        showToast(
            "Removido dos favoritos"
        );

    }else{

        localStorage.setItem(
            key,
            "true"
        );

        button.classList.add(
            "active"
        );

        showToast(
            "Adicionado aos favoritos"
        );

    }

}

/* ==========================================
   VERIFICAR FAVORITO
========================================== */

function checkFavorite(){

    const key =
        `playnime_favorite_${animeId}`;

    if(
        localStorage.getItem(key)
        === "true"
    ){

        document
            .getElementById(
                "favoriteButton"
            )
            .classList
            .add(
                "active"
            );

    }

}

/* ==========================================
   PARTILHAR
========================================== */

async function shareAnime(){

    const title =
        animeData &&
        animeData.title
        ? animeData.title
        : "Anime";

    const url =
        window.location.href;

    try{

        if(
            navigator.share
        ){

            await navigator.share({

                title:
                    `PlayNime - ${title}`,

                text:
                    `Veja ${title} no PlayNime`,

                url:
                    url

            });

        }else{

            await navigator.clipboard.writeText(
                url
            );

            showToast(
                "Link copiado"
            );

        }

    }catch(error){

        console.log(error);

    }

}

/* ==========================================
   COMENTÁRIOS
========================================== */

function openComments(){

    showToast(
        "Comentários em breve"
    );

}

/* ==========================================
   NOTIFICAÇÃO
========================================== */

function showToast(
    message
){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    setTimeout(
        () => {

            toast.classList.remove(
                "show"
            );

        },
        2200
    );

}

/* ==========================================
   SEGURANÇA HTML
========================================== */

function escapeHTML(
    value
){

    return String(
        value || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}

   FINAL
========================================== */

checkFavorite();
