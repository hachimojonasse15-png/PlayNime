<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Detalhes - PlayNime</title>

<style>

/* =====================================================
   BASE
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

html,
body{
    background:#070707;
    color:#fff;
    min-height:100vh;
}

body{
    padding-bottom:50px;
}


/* =====================================================
   TOPO
===================================================== */

.top-bar{

    position:fixed;

    top:0;
    left:0;
    right:0;

    height:56px;

    padding:0 14px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    z-index:100;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.8),
            transparent
        );
}

.top-right{

    display:flex;

    gap:10px;
}

.icon-button{

    width:40px;
    height:40px;

    border:0;

    border-radius:50%;

    background:
        rgba(20,20,20,.7);

    color:#fff;

    display:flex;

    align-items:center;
    justify-content:center;

    backdrop-filter:blur(10px);

    cursor:pointer;
}

.icon-button svg{

    width:22px;
    height:22px;

    fill:none;

    stroke:currentColor;

    stroke-width:2;

    stroke-linecap:round;
    stroke-linejoin:round;
}


/* =====================================================
   HERO
===================================================== */

.hero{

    width:100%;

    height:380px;

    position:relative;

    overflow:hidden;

    background:#111;
}

.hero-image{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;
}

.hero-bottom{

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:140px;

    background:
        linear-gradient(
            to top,
            #070707 10%,
            rgba(7,7,7,.7),
            transparent
        );
}


/* =====================================================
   CONTEÚDO
===================================================== */

.details{

    position:relative;

    margin-top:-8px;

    padding:0 16px;

    z-index:5;
}

.title{

    font-size:28px;

    font-weight:800;

    line-height:1.15;

    margin-bottom:10px;

    letter-spacing:-.3px;
}


/* =====================================================
   META
===================================================== */

.meta{

    display:flex;

    align-items:center;

    flex-wrap:wrap;

    gap:8px;

    margin-bottom:16px;

    font-size:13px;

    color:#cfcfcf;
}

.rating-badge{

    background:#e50914;

    color:#fff;

    font-size:12px;

    font-weight:700;

    padding:2px 7px;

    border-radius:4px;

    line-height:1.3;
}

.meta-text{

    color:#cfcfcf;
}


/* =====================================================
   AÇÕES
===================================================== */

.actions{

    display:grid;

    grid-template-columns:
        1fr 1fr 1fr;

    gap:6px;

    margin-bottom:22px;
}

.action{

    min-height:68px;

    border:none;

    background:transparent;

    color:#fff;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:6px;

    cursor:pointer;

    position:relative;
}

.action svg{

    width:26px;
    height:26px;

    fill:none;

    stroke:currentColor;

    stroke-width:1.8;

    stroke-linecap:round;
    stroke-linejoin:round;
}

.action span{

    font-size:12px;

    color:#aaa;
}

.action .count{

    position:absolute;

    top:2px;
    right:18px;

    background:#e50914;

    color:#fff;

    font-size:10px;

    font-weight:700;

    padding:1px 5px;

    border-radius:8px;

    line-height:1.3;
}

.favorite-button.active svg{

    fill:#ff304f;

    stroke:#ff304f;
}

.favorite-button.active span{

    color:#ff304f;
}

.like-button.active svg{

    fill:#fff;

    stroke:#fff;
}


/* =====================================================
   SINOPSE
===================================================== */

.synopsis{

    margin-bottom:20px;
}

.synopsis-text{

    color:#e0e0e0;

    font-size:14px;

    line-height:1.6;

    display:-webkit-box;

    -webkit-box-orient:vertical;

    -webkit-line-clamp:4;

    overflow:hidden;
}

.synopsis-text.expanded{

    display:block;

    -webkit-line-clamp:unset;
}

.synopsis-toggle{

    width:100%;

    margin-top:6px;

    border:0;

    background:transparent;

    color:#aaa;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:4px;

    cursor:pointer;
}

.synopsis-toggle svg{

    width:20px;
    height:20px;

    fill:none;

    stroke:currentColor;

    stroke-width:2;

    stroke-linecap:round;
    stroke-linejoin:round;

    transition:
        transform .25s;
}


/* =====================================================
   TEMPORADAS
===================================================== */

.seasons-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    margin-bottom:12px;
}

.season-selector{

    flex:1;

    min-height:44px;

    padding:0 14px;

    border:1px solid #2a2a2a;

    border-radius:10px;

    background:#121212;

    color:#fff;

    display:flex;

    align-items:center;

    justify-content:space-between;

    cursor:pointer;

    font-size:14px;

    font-weight:600;
}

.season-selector svg{

    width:18px;
    height:18px;

    fill:none;

    stroke:#aaa;

    stroke-width:2;
}

.season-arrow{

    transition:
        transform .2s;
}

.season-arrow.open{

    transform:rotate(180deg);
}

.sort-btn{

    min-height:44px;

    padding:0 12px;

    border:1px solid #2a2a2a;

    border-radius:10px;

    background:#121212;

    color:#ccc;

    font-size:13px;

    display:flex;

    align-items:center;

    gap:6px;

    white-space:nowrap;

    cursor:pointer;
}

.sort-btn svg{

    width:16px;
    height:16px;

    fill:none;

    stroke:currentColor;

    stroke-width:2;
}

.season-menu{

    display:none;

    margin-top:6px;

    border:1px solid #2a2a2a;

    border-radius:10px;

    background:#111;

    overflow:hidden;

    margin-bottom:10px;
}

.season-menu.open{

    display:block;
}

.season-option{

    width:100%;

    padding:13px 14px;

    border:0;

    border-bottom:1px solid #222;

    background:transparent;

    color:#ddd;

    text-align:left;

    font-size:14px;

    cursor:pointer;
}

.season-option:last-child{

    border-bottom:0;
}

.season-option.active{

    color:#b66cff;

    background:#18121f;
}


/* =====================================================
   EPISÓDIOS
===================================================== */

.episodes{

    margin-top:4px;
}

.episode{

    display:flex;

    gap:12px;

    padding:11px 0;

    border-bottom:1px solid #1a1a1a;

    cursor:pointer;
}

.episode:active{

    opacity:.75;
}

.episode-image{

    width:112px;
    height:66px;

    flex:0 0 112px;

    border-radius:8px;

    overflow:hidden;

    background:#151515;
}

.episode-image img{

    width:100%;
    height:100%;

    object-fit:cover;
}

.episode-info{

    min-width:0;

    display:flex;

    flex-direction:column;

    justify-content:center;
}

.episode-title{

    font-size:13.5px;

    color:#fff;

    line-height:1.35;

    margin-bottom:5px;

    font-weight:500;
}

.episode-runtime{

    color:#777;

    font-size:12px;
}


/* =====================================================
   LOADING / TOAST
===================================================== */

.loading{

    padding:80px 20px;

    text-align:center;

    color:#777;

    font-size:14px;
}

.toast{

    position:fixed;

    left:50%;

    bottom:28px;

    transform:
        translate(-50%,20px);

    background:#181818;

    border:1px solid #303030;

    padding:12px 18px;

    border-radius:10px;

    font-size:13px;

    color:#fff;

    opacity:0;

    pointer-events:none;

    transition:
        opacity .25s,
        transform .25s;

    z-index:500;
}

.toast.show{

    opacity:1;

    transform:
        translate(-50%,0);
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:400px){

    .hero{
        height:340px;
    }

    .title{
        font-size:25px;
    }

    .episode-image{

        width:100px;

        flex-basis:100px;

        height:60px;
    }

}

</style>

</head>

<script>

/* =====================================================
   TMDB
===================================================== */

const TMDB_TOKEN =
    "eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiI4ZTg5Mzk0MmUwMWMyM2IzMTJkZjI2NWQ1NThlMjdmYyIsIm5iZiI6MTc4MTI0MDM4Ni41NzIsInN1YiI6IjZhMmI5MjQyOGQ2YWJiNWQyNWUzYjk5OCIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.dbWkox1kPJDn85ah8IcU-ut5CotlJjPSFsYPEoJi080";


const TMDB_API =
    "https://api.themoviedb.org/3";


const TMDB_IMAGE =
    "https://image.tmdb.org/t/p/";


const TMDB_LANGUAGE =
    "pt-BR";


/* =====================================================
   URL
===================================================== */

const parametros =
    new URLSearchParams(
        window.location.search
    );


const animeId =
    parametros.get("id");


/* =====================================================
   ESTADO
===================================================== */

let animeAtual = null;

let temporadas = [];

let temporadaAtual = 1;

let sinopseExpandida = false;

let curtido = false;


/* =====================================================
   ELEMENTOS
===================================================== */

const heroImage =
    document.getElementById(
        "hero-image"
    );

const loading =
    document.getElementById(
        "details-loading"
    );

const content =
    document.getElementById(
        "details-content"
    );

const title =
    document.getElementById(
        "anime-title"
    );

const ratingBadge =
    document.getElementById(
        "rating-badge"
    );

const animeMeta =
    document.getElementById(
        "anime-meta"
    );

const synopsis =
    document.getElementById(
        "anime-synopsis"
    );

const synopsisArrow =
    document.getElementById(
        "synopsis-arrow"
    );

const seasonName =
    document.getElementById(
        "season-name"
    );

const seasonMenu =
    document.getElementById(
        "season-menu"
    );

const seasonArrow =
    document.getElementById(
        "season-arrow"
    );

const episodes =
    document.getElementById(
        "episodes"
    );

const favoriteButton =
    document.getElementById(
        "favorite-button"
    );

const favoriteLabel =
    document.getElementById(
        "favorite-label"
    );

const likeButton =
    document.getElementById(
        "like-button"
    );

  /* =====================================================
   PEDIDO À TMDB
===================================================== */

async function tmdbFetch(endpoint){

    const resposta =
        await fetch(
            TMDB_API + endpoint,
            {
                method:"GET",

                headers:{
                    "Authorization":
                        "Bearer " +
                        TMDB_TOKEN,

                    "accept":
                        "application/json"
                }
            }
        );


    if(!resposta.ok){

        throw new Error(
            "TMDB HTTP " +
            resposta.status
        );

    }


    return await resposta.json();

}


/* =====================================================
   IMAGEM TMDB
===================================================== */

function imagemTMDB(
    caminho,
    tamanho = "w780"
){

    if(!caminho){

        return "";

    }


    return (
        TMDB_IMAGE +
        tamanho +
        caminho
    );

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escaparHTML(texto){

    return String(texto || "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   GÉNEROS
===================================================== */

function limparGenero(nome){

    const mapa = {

        "Action & Adventure":
            "Ação e Aventura",

        "Sci-Fi & Fantasy":
            "Ficção Científica e Fantasia",

        "Animation":
            "Animação",

        "Comedy":
            "Comédia",

        "Drama":
            "Drama",

        "Fantasy":
            "Fantasia",

        "Mystery":
            "Mistério",

        "Horror":
            "Terror",

        "Romance":
            "Romance",

        "Action":
            "Ação",

        "Adventure":
            "Aventura"

    };


    return mapa[nome] || nome;

}


/* =====================================================
   CARREGAR DETALHES
===================================================== */

async function carregarDetalhes(){

    if(!animeId){

        mostrarErro(
            "Anime não encontrado. " +
            "Use ?id=XXXX"
        );

        return;

    }


    if(
        !TMDB_TOKEN ||
        TMDB_TOKEN ===
        "SEU_TOKEN_READ_ACCESS_AQUI"
    ){

        mostrarErro(
            "Configure o token Read Access do TMDB."
        );

        return;

    }


    try{

        const dados =
            await tmdbFetch(
                "/tv/" +
                encodeURIComponent(
                    animeId
                ) +
                "?language=" +
                encodeURIComponent(
                    TMDB_LANGUAGE
                )
            );


        const ratingsData =
            await tmdbFetch(
                "/tv/" +
                encodeURIComponent(
                    animeId
                ) +
                "/content_ratings"
            ).catch(
                () => ({
                    results:[]
                })
            );


        animeAtual =
            dados;


        mostrarDetalhes(
            dados,
            ratingsData
        );


        temporadas =
            Array.isArray(
                dados.seasons
            )
                ? dados.seasons.filter(
                    temporada =>
                        temporada.season_number >= 1
                )
                : [];


        if(
            temporadas.length
        ){

            temporadaAtual =
                temporadas[0]
                    .season_number;


            criarMenuTemporadas();


            await carregarEpisodios(
                temporadaAtual
            );

        }
        else{

            episodes.innerHTML = `

                <div class="loading">

                    Nenhum episódio
                    disponível.

                </div>

            `;

        }

    }
    catch(erro){

        console.error(
            "Erro ao carregar detalhes:",
            erro
        );


        mostrarErro(
            "Não foi possível carregar os detalhes."
        );

    }

}


/* =====================================================
   MOSTRAR DETALHES
===================================================== */

function mostrarDetalhes(
    anime,
    ratingsData
){

    const nome =
        anime.name ||
        anime.original_name ||
        "Anime sem título";


    title.textContent =
        nome;


    /* =================================================
       RATING
    ================================================= */

    let rating =
        "16";


    if(
        ratingsData &&
        Array.isArray(
            ratingsData.results
        )
    ){

        const br =
            ratingsData.results.find(
                r =>
                    r.iso_3166_1 === "BR"
            );


        const us =
            ratingsData.results.find(
                r =>
                    r.iso_3166_1 === "US"
            );


        const r =
            br ||
            us ||
            ratingsData.results[0];


        if(r){

            /*
               Aqui o rating é convertido
               para número como você pediu.
            */

            const valor =
                String(
                    r.rating || ""
                )
                .toUpperCase()
                .trim();


            if(
                valor === "TV-MA" ||
                valor === "18" ||
                valor === "R"
            ){

                rating = "18";

            }
            else if(
                valor === "TV-14" ||
                valor === "14"
            ){

                rating = "14";

            }
            else if(
                valor === "TV-PG" ||
                valor === "12"
            ){

                rating = "12";

            }
            else if(
                valor === "TV-G" ||
                valor === "L"
            ){

                rating = "L";

            }
            else{

                const numero =
                    valor.match(
                        /\d+/
                    );


                rating =
                    numero
                        ? numero[0]
                        : "16";

            }

        }

    }


    ratingBadge.textContent =
        rating;


    ratingBadge.style.display =
        "inline-block";


    /* =================================================
       GÉNEROS
    ================================================= */

    const generos =
        Array.isArray(
            anime.genres
        )
            ? anime.genres
                .map(
                    genero =>
                        limparGenero(
                            genero.name
                        )
                )
                .filter(Boolean)
                .slice(0,3)
                .join(", ")
            : "";


    /* =================================================
       ANO
    ================================================= */

    const ano =
        anime.first_air_date
            ? anime.first_air_date.substring(
                0,
                4
            )
            : "";


    animeMeta.textContent =
        (
            generos
                ? generos + " • "
                : ""
        ) +
        (
            ano ||
            "Ano desconhecido"
        );


    /* =================================================
       SINOPSE
    ================================================= */

    synopsis.textContent =
        anime.overview ||
        "Sinopse não disponível.";


    /* =================================================
       BANNER
    ================================================= */

    const banner =
        anime.backdrop_path ||
        anime.poster_path;


    if(banner){

        heroImage.src =
            imagemTMDB(
                banner,
                "w1280"
            );


        heroImage.alt =
            nome;

    }
    else{

        heroImage.removeAttribute(
            "src"
        );

    }


    /* =================================================
       FINALIZAR LOADING
    ================================================= */

    atualizarFavorito();


    loading.style.display =
        "none";


    content.style.display =
        "block";

}


/* =====================================================
   ERRO
===================================================== */

function mostrarErro(
    mensagem
){

    loading.textContent =
        mensagem;


    loading.style.display =
        "block";


    content.style.display =
        "none";

}


/* =====================================================
   SINOPSE
===================================================== */

function alternarSinopse(){

    sinopseExpandida =
        !sinopseExpandida;


    if(
        sinopseExpandida
    ){

        synopsis.classList.add(
            "expanded"
        );


        synopsisArrow.style.transform =
            "rotate(180deg)";

    }
    else{

        synopsis.classList.remove(
            "expanded"
        );


        synopsisArrow.style.transform =
            "rotate(0deg)";

    }

}


/* =====================================================
   MENU DE TEMPORADAS
===================================================== */

function alternarMenuTemporadas(){

    seasonMenu.classList.toggle(
        "open"
    );


    seasonArrow.classList.toggle(
        "open"
    );

}


/* =====================================================
   CRIAR MENU
===================================================== */

function criarMenuTemporadas(){

    seasonMenu.innerHTML =
        temporadas
            .map(
                temporada => {

                    const numero =
                        temporada.season_number;


                    const ativa =
                        numero ===
                        temporadaAtual
                            ? "active"
                            : "";


                    return `

                        <button
                            class="
                                season-option
                                ${ativa}
                            "
                            onclick="
                                selecionarTemporada(
                                    ${numero},
                                    event
                                )
                            ">

                            Temporada
                            ${numero}

                        </button>

                    `;

                }
            )
            .join("");

}


/* =====================================================
   SELECIONAR TEMPORADA
===================================================== */

async function selecionarTemporada(
    numero,
    evento
){

    if(evento){

        evento.stopPropagation();

    }


    temporadaAtual =
        Number(numero);


    seasonName.textContent =
        "Temporada " +
        temporadaAtual +
        " (Legendado)";


    seasonMenu.classList.remove(
        "open"
    );


    seasonArrow.classList.remove(
        "open"
    );


    criarMenuTemporadas();


    await carregarEpisodios(
        temporadaAtual
    );

}


/* =====================================================
   CARREGAR EPISÓDIOS
===================================================== */

async function carregarEpisodios(
    numero
){

    episodes.innerHTML = `

        <div class="loading">

            Carregando episódios...

        </div>

    `;


    try{

        const dados =
            await tmdbFetch(
                "/tv/" +
                encodeURIComponent(
                    animeId
                ) +
                "/season/" +
                encodeURIComponent(
                    numero
                ) +
                "?language=" +
                encodeURIComponent(
                    TMDB_LANGUAGE
                )
            );


        const lista =
            Array.isArray(
                dados.episodes
            )
                ? dados.episodes
                : [];


        if(!lista.length){

            episodes.innerHTML = `

                <div class="loading">

                    Nenhum episódio
                    disponível.

                </div>

            `;

            return;

        }


        episodes.innerHTML =
            lista
                .map(
                    criarEpisodio
                )
                .join("");

    }
    catch(erro){

        console.error(
            "Erro nos episódios:",
            erro
        );


        episodes.innerHTML = `

            <div class="loading">

                Não foi possível
                carregar os episódios.

            </div>

        `;

    }

}


/* =====================================================
   CRIAR EPISÓDIO
===================================================== */

function criarEpisodio(ep){

    const numero =
        ep.episode_number;


    const nome =
        ep.name ||
        "Episódio " +
        numero;


    const runtime =
        ep.runtime
            ? ep.runtime +
              " minutos"
            : "Duração não disponível";


    const imagem =
        ep.still_path
            ? imagemTMDB(
                ep.still_path,
                "w300"
            )
            : "";


    return `

        <article
            class="episode">

            <div
                class="episode-image">

                ${
                    imagem
                    ?
                    `
                    <img
                        src="${imagem}"
                        alt="${escaparHTML(
                            nome
                        )}"
                        loading="lazy">
                    `
                    :
                    ""
                }

            </div>


            <div
                class="episode-info">

                <div
                    class="episode-title">

                    ${numero}.
                    ${escaparHTML(
                        nome
                    )}

                </div>


                <div
                    class="episode-runtime">

                    ${escaparHTML(
                        runtime
                    )}

                </div>

            </div>

        </article>

    `;

}

 /* =====================================================
   FAVORITOS
===================================================== */

function obterFavoritos(){

    try{

        const dados =
            localStorage.getItem(
                "playnime_favoritos"
            );


        if(!dados){

            return [];

        }


        const favoritos =
            JSON.parse(
                dados
            );


        return Array.isArray(
            favoritos
        )
            ? favoritos
            : [];

    }
    catch(erro){

        console.error(
            "Erro nos favoritos:",
            erro
        );

        return [];

    }

}


/* =====================================================
   VERIFICAR FAVORITO
===================================================== */

function ehFavorito(){

    if(!animeAtual){

        return false;

    }


    return obterFavoritos()
        .some(
            anime =>
                String(
                    anime?.id
                ) ===
                String(
                    animeAtual.id
                )
        );

}


/* =====================================================
   GUARDAR FAVORITOS
===================================================== */

function salvarFavoritos(
    favoritos
){

    try{

        localStorage.setItem(
            "playnime_favoritos",
            JSON.stringify(
                favoritos
            )
        );


        return true;

    }
    catch(erro){

        console.error(
            "Erro ao guardar favoritos:",
            erro
        );


        return false;

    }

}


/* =====================================================
   ATUALIZAR FAVORITO
===================================================== */

function atualizarFavorito(){

    if(
        ehFavorito()
    ){

        favoriteButton.classList.add(
            "active"
        );


        favoriteLabel.textContent =
            "Favoritado";

    }
    else{

        favoriteButton.classList.remove(
            "active"
        );


        favoriteLabel.textContent =
            "Favoritar";

    }

}


/* =====================================================
   ALTERNAR FAVORITO
===================================================== */

function alternarFavorito(){

    if(!animeAtual){

        mostrarToast(
            "Anime ainda não carregado"
        );

        return;

    }


    let favoritos =
        obterFavoritos();


    const existe =
        favoritos.some(
            anime =>
                String(
                    anime?.id
                ) ===
                String(
                    animeAtual.id
                )
        );


    if(existe){

        favoritos =
            favoritos.filter(
                anime =>
                    String(
                        anime?.id
                    ) !==
                    String(
                        animeAtual.id
                    )
            );


        salvarFavoritos(
            favoritos
        );


        atualizarFavorito();


        mostrarToast(
            "Removido dos favoritos"
        );


        return;

    }


    favoritos.push({

        id:
            animeAtual.id,

        name:
            animeAtual.name,

        original_name:
            animeAtual.original_name,

        poster_path:
            animeAtual.poster_path,

        backdrop_path:
            animeAtual.backdrop_path,

        vote_average:
            animeAtual.vote_average,

        first_air_date:
            animeAtual.first_air_date,

        genres:
            animeAtual.genres || []

    });


    salvarFavoritos(
        favoritos
    );


    atualizarFavorito();


    mostrarToast(
        "Adicionado aos favoritos"
    );

}


/* =====================================================
   CURTIR
===================================================== */

function alternarCurtir(){

    curtido =
        !curtido;


    if(curtido){

        likeButton.classList.add(
            "active"
        );


        mostrarToast(
            "Curtido"
        );

    }
    else{

        likeButton.classList.remove(
            "active"
        );


        mostrarToast(
            "Curtida removida"
        );

    }

}


/* =====================================================
   PARTILHAR
===================================================== */

async function partilharAnime(){

    if(!animeAtual){

        return;

    }


    const nome =
        animeAtual.name ||
        "Anime";


    const url =
        window.location.href;


    try{

        if(
            navigator.share
        ){

            await navigator.share({

                title:nome,

                text:
                    "Confira " +
                    nome +
                    " no PlayNime.",

                url:url

            });


            return;

        }


        if(
            navigator.clipboard
        ){

            await navigator.clipboard.writeText(
                url
            );


            mostrarToast(
                "Link copiado"
            );

        }

    }
    catch(erro){

        console.error(
            "Erro ao partilhar:",
            erro
        );

    }

}


/* =====================================================
   COMENTÁRIOS
===================================================== */

function abrirComentarios(){

    mostrarToast(
        "Comentários em breve"
    );

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer = null;


function mostrarToast(
    mensagem
){

    const toast =
        document.getElementById(
            "toast"
        );


    if(!toast){

        return;

    }


    toast.textContent =
        mensagem;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* =====================================================
   INICIAR
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        carregarDetalhes();

    }
);

</script>
