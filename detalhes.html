<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Detalhes - PlayNime</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
html,body{background:#070707;color:#fff;min-height:100vh}
body{padding-bottom:40px}
button{border:0;background:none;color:inherit;font:inherit;cursor:pointer}
.top-bar{position:fixed;top:0;left:0;right:0;height:56px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;z-index:100;background:linear-gradient(to bottom,rgba(0,0,0,.85),transparent)}
.top-right{display:flex;gap:8px}
.icon-button{width:38px;height:38px;border-radius:50%;background:rgba(20,20,20,.72);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
.icon-button svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hero{width:100%;height:390px;position:relative;overflow:hidden;background:#111}
.hero-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-bottom{position:absolute;left:0;right:0;bottom:0;height:180px;background:linear-gradient(to top,#070707 8%,rgba(7,7,7,.72),transparent)}
.continue-button{position:absolute;left:16px;bottom:40px;z-index:6;display:flex;align-items:center;justify-content:center;gap:8px;background:#e50914;color:#fff;font-weight:700;font-size:15px;padding:13px 24px;border-radius:30px;box-shadow:0 4px 10px rgba(0,0,0,.5)}
.continue-button svg{width:18px;height:18px;fill:currentColor;stroke:none}
.details{position:relative;margin-top:-8px;padding:0 16px;z-index:5}
.title{font-size:27px;font-weight:800;line-height:1.15;margin-bottom:9px}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-bottom:14px;font-size:13px;color:#ccc}
.rating-badge{background:#e50914;color:#fff;font-size:11px;font-weight:700;padding:3px 7px;border-radius:4px}
.meta-text{color:#cfcfcf}
/* Ícones menores conforme pedido */
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-bottom:20px}
.action{min-height:45px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative}
.action svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.action span{font-size:11px;color:#999}
.favorite-button.active svg{fill:#ff304f;stroke:#ff304f}
.favorite-button.active span{color:#ff304f}
.like-button.active svg{fill:#fff;stroke:#fff}
.synopsis{margin-bottom:20px;max-height:90px;overflow:hidden;transition:max-height .3s}
.synopsis.expanded{max-height:1000px}
.synopsis-text{color:#ddd;font-size:14px;line-height:1.6;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden}
.synopsis.expanded .synopsis-text{display:block;-webkit-line-clamp:unset}
.synopsis-toggle{width:100%;margin-top:5px;padding:3px;display:flex;align-items:center;justify-content:center;color:#999}
.synopsis-toggle svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;transition:transform .25s}
.synopsis-toggle.open svg{transform:rotate(180deg)}
.seasons-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.season-selector{flex:1;min-height:43px;padding:0 13px;border:1px solid #292929;border-radius:9px;background:#121212;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600}
.season-selector svg{width:17px;height:17px;fill:none;stroke:#aaa;stroke-width:2}
.sort-btn{min-height:43px;padding:0 11px;border:1px solid #292929;border-radius:9px;background:#121212;color:#bbb;font-size:12px;display:flex;align-items:center;gap:5px}
.sort-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2}
.season-menu{display:none;margin-top:5px;border:1px solid #292929;border-radius:9px;background:#111;overflow:hidden;margin-bottom:9px}
.season-menu.open{display:block}
.season-option{width:100%;padding:12px 13px;border-bottom:1px solid #222;background:transparent;color:#ddd;text-align:left;font-size:13px}
.season-option:last-child{border-bottom:0}
.season-option.active{color:#b66cff;background:#18121f}
.episodes{margin-top:3px}
.episode{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid #1a1a1a}
.episode-image{width:108px;height:63px;flex:0 0 108px;border-radius:7px;overflow:hidden;background:#151515}
.episode-image img{width:100%;height:100%;object-fit:cover}
.episode-info{min-width:0;display:flex;flex-direction:column;justify-content:center}
.episode-title{font-size:13px;line-height:1.35;margin-bottom:4px}
.episode-runtime{font-size:11px;color:#777}
.loading{padding:75px 20px;text-align:center;color:#777;font-size:14px}
.loader{width:28px;height:28px;border:3px solid #292929;border-top-color:#a855f7;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);background:#181818;border:1px solid #303030;padding:11px 17px;border-radius:9px;font-size:12px;color:#fff;opacity:0;pointer-events:none;transition:.25s;z-index:500;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:400px){
.hero{height:350px}
.title{font-size:25px}
.episode-image{width:100px;flex-basis:100px;height:59px}
}
</style>
</head>
<body>
<header class="top-bar">
<button class="icon-button" onclick="history.back()" aria-label="Voltar">
<svg viewBox="0 0 24 24"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
</button>
<div class="top-right">
<button class="icon-button" onclick="mostrarToast('Notificações em breve')" aria-label="Notificações">
<svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path><path d="M10 21h4"></path></svg>
</button>
<button class="icon-button" onclick="partilharAnime()" aria-label="Compartilhar">
<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M8.6 13.5l6.8 4"></path><path d="M15.4 6.5l-6.8 4"></path></svg>
</button>
</div>
</header>
<section class="hero">
<img id="hero-image" class="hero-image" src="" alt="">
<div class="hero-bottom"></div>
<button class="continue-button" onclick="mostrarToast('Reproduzindo...')">
<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
Continuar
</button>
</section>
<main class="details">
<div id="details-loading" class="loading"><div class="loader"></div>Carregando detalhes...</div>
<div id="details-content" style="display:none">
<h1 id="anime-title" class="title"></h1>
<div class="meta"><span id="rating-badge" class="rating-badge" style="display:none"></span><span id="anime-meta" class="meta-text"></span></div>
<div class="actions">
<button class="action" onclick="abrirComentarios()">
<svg viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-8 7.5 8 8 0 0 1-3.5-.8L4 20l1.8-3.8A7.3 7.3 0 0 1 4 11.5 7.5 7.5 0 0 1 12 4a7.5 7.5 0 0 1 8 7.5z"></path></svg>
<span>Comentários</span>
</button>
<button id="like-button" class="action like-button" onclick="alternarCurtir()">
<svg viewBox="0 0 24 24"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg>
<span>Curtir</span>
</button>
<button id="favorite-button" class="action favorite-button" onclick="alternarFavorito()">
<svg viewBox="0 0 24 24"><path d="M20.8 8.6c0 5.5-8.8 11-8.8 11S3.2 14.1 3.2 8.6A4.6 4.6 0 0 1 12 6.4a4.6 4.6 0 0 1 8.8 2.2z"></path></svg>
<span id="favorite-label">Favoritar</span>
</button>
</div>
<section class="synopsis" id="synopsis-section">
<div id="anime-synopsis" class="synopsis-text"></div>
<button id="synopsis-toggle" class="synopsis-toggle" onclick="alternarSinopse()">
<svg id="synopsis-arrow" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"></path></svg>
</button>
</section>
<section class="seasons">
<div class="seasons-header">
<div id="season-selector" class="season-selector" onclick="alternarMenuTemporadas()"><span id="season-name">Temporada 1</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"></path></svg></div>
<button class="sort-btn" onclick="alternarOrdem()">Antigos <svg viewBox="0 0 24 24"><path d="M3 6h18M6 12h12M9 18h6"></path></svg></button>
</div>
<div id="season-menu" class="season-menu"></div>
<div id="episodes" class="episodes"></div>
</section>
</div>
</main>
<div id="toast" class="toast"></div>
<script>
const JIKAN="https://api.jikan.moe/v4";
const params=new URLSearchParams(location.search);
const animeId=params.get("mal")||params.get("id");
let animeAtual=null,temporadas=[],temporadaAtual=1,sinopseExpandida=false,curtido=false,ordemAntiga=true;
const heroImage=document.getElementById("hero-image"),loading=document.getElementById("details-loading"),content=document.getElementById("details-content"),title=document.getElementById("anime-title"),rating=document.getElementById("rating-badge"),meta=document.getElementById("anime-meta"),synopsis=document.getElementById("anime-synopsis"),toggle=document.getElementById("synopsis-toggle"),seasonName=document.getElementById("season-name"),seasonMenu=document.getElementById("season-menu"),episodes=document.getElementById("episodes"),fav=document.getElementById("favorite-button"),favLabel=document.getElementById("favorite-label"),like=document.getElementById("like-button");
function esc(v){return String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function mostrarToast(t){const x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),2200)}
function partilharAnime(){if(navigator.share)navigator.share({title:animeAtual?.title||"PlayNime",url:location.href}).catch(()=>{});else mostrarToast("Link copiado")}
function abrirComentarios(){mostrarToast("Ainda não existem comentários")}
function alternarCurtir(){curtido=!curtido;like.classList.toggle("active",curtido)}
function alternarFavorito(){if(!animeAtual)return;let f=JSON.parse(localStorage.getItem("playnime_favoritos")||"[]"),id=String(animeAtual.mal_id),i=f.findIndex(x=>String(x.mal_id)==id);if(i>=0){f.splice(i,1);fav.classList.remove("active");favLabel.textContent="Favoritar"}else{f.push({mal_id:animeAtual.mal_id,title:animeAtual.title,image:animeAtual.images?.jpg?.large_image_url||""});fav.classList.add("active");favLabel.textContent="Favoritado"}localStorage.setItem("playnime_favoritos",JSON.stringify(f))}
function verificarFavorito(){let f=JSON.parse(localStorage.getItem("playnime_favoritos")||"[]");if(f.some(x=>String(x.mal_id)==String(animeAtual.mal_id))){fav.classList.add("active");favLabel.textContent="Favoritado"}}
function alternarSinopse(){sinopseExpandida=!sinopseExpandida;document.getElementById("synopsis-section").classList.toggle("expanded",sinopseExpandida);toggle.classList.toggle("open",sinopseExpandida)}
function alternarMenuTemporadas(){seasonMenu.classList.toggle("open")}
function alternarOrdem(){ordemAntiga=!ordemAntiga;renderEpisodios()}
async function get(url){let r=await fetch(JIKAN+url);if(!r.ok)throw Error("Jikan "+r.status);return r.json()}
function imagem(a){return a?.images?.jpg?.large_image_url||a?.images?.jpg?.image_url||""}
async function carregar(){
if(!animeId){loading.innerHTML="Anime não encontrado.";return}
try{
// Loader de 1 segundo conforme pedido
await new Promise(r=>setTimeout(r,1000));
animeAtual=await get("/anime/"+encodeURIComponent(animeId)+"/full").then(x=>x.data);
if(!animeAtual)throw Error("anime");
heroImage.src=imagem(animeAtual);
heroImage.alt=esc(animeAtual.title);
title.textContent=animeAtual.title||"Anime";
if(animeAtual.score){rating.textContent="★ "+animeAtual.score;rating.style.display="inline-block"}
let gs=(animeAtual.genres||[]).map(x=>x.name).slice(0,4).join(" • ");
meta.textContent=[animeAtual.year||animeAtual.aired?.prop?.from?.slice(0,4),gs].filter(Boolean).join(" • ");
synopsis.textContent=animeAtual.synopsis||"Sinopse não disponível.";
verificarFavorito();
content.style.display="block";
loading.style.display="none";
await carregarTemporadas();
}catch(e){loading.innerHTML="Não foi possível carregar os detalhes.<br><button onclick='location.reload()' style='margin-top:14px;padding:10px 16px;background:#a855f7;border-radius:9px;color:#fff'>Tentar novamente</button>"}
}
async function carregarTemporadas(){
try{
let dados=await get("/anime/"+encodeURIComponent(animeId)+"/episodes?limit=100").then(x=>x.data||[]);
temporadas=[{num:1,nome:"Temporada 1",eps:dados}];
renderTemporadas();
renderEpisodios();
}catch(e){episodes.innerHTML="<div class='loading'>Episódios indisponíveis.</div>"}
}
function renderTemporadas(){seasonMenu.innerHTML=temporadas.map((s,i)=>"<button class='season-option "+(i==temporadaAtual-1?"active":"")+"' onclick='selecionarTemporada("+i+")'>"+esc(s.nome)+"</button>").join("")}
function selecionarTemporada(i){temporadaAtual=i+1;seasonName.textContent=temporadas[i].nome;seasonMenu.classList.remove("open");renderTemporadas();renderEpisodios()}
function renderEpisodios(){let s=temporadas[temporadaAtual-1];if(!s){episodes.innerHTML="";return}let a=[...(s.eps||[])];if(ordemAntiga)a.reverse();episodes.innerHTML=a.map(e=>"<article class='episode' onclick=\"mostrarToast('Episódio "+e.mal_id+"')\"><div class='episode-image'><img src='"+esc(e.images?.jpg?.image_url||imagem(animeAtual))+"' loading='lazy'></div><div class='episode-info'><div class='episode-title'>"+esc("Episódio "+(e.mal_id||"")+" • "+(e.title||"Sem título"))+"</div><div class='episode-runtime'>"+esc(e.duration||"")+"</div></div></article>").join("")||"<div class='loading'>Nenhum episódio encontrado.</div>"}
carregar();
</script>
</body>
</html>
