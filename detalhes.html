<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>PlayNime - Detalhes</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    background:#080808;
}

body{
    background:#080808;
    color:#fff;
    font-family:Arial, Helvetica, sans-serif;
    overflow-x:hidden;
}

/* =====================================================
   HERO
===================================================== */

.hero{
    position:relative;
    width:100%;
    min-height:560px;
    overflow:hidden;
}

.hero-bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    z-index:0;
}

/* Pequeno escurecimento apenas para leitura,
   sem aquele gradiente preto pesado */

.hero::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:130px;
    background:linear-gradient(
        transparent,
        rgba(8,8,8,.92)
    );
    z-index:1;
}

.top-bar{
    position:absolute;
    top:0;
    left:0;
    right:0;
    z-index:5;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:18px 20px;
}

.back-btn{
    width:44px;
    height:44px;

    border:none;
    border-radius:50%;

    background:rgba(0,0,0,.42);
    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:27px;
    cursor:pointer;
}

.logo{
    font-size:25px;
    font-weight:800;
}

.logo span{
    color:#a855f7;
}

.top-actions{
    display:flex;
    gap:10px;
}

.top-icon{
    width:44px;
    height:44px;

    border:1px solid rgba(255,255,255,.12);
    border-radius:50%;

    background:rgba(0,0,0,.4);

    color:#fff;
    font-size:20px;

    display:flex;
    align-items:center;
    justify-content:center;
}

/* =====================================================
   HERO CONTENT
===================================================== */

.hero-content{
    position:absolute;
    left:20px;
    right:20px;
    bottom:45px;

    z-index:3;
}

.anime-title{
    font-size:34px;
    line-height:1.08;
    margin-bottom:13px;
    font-weight:800;
}

.meta{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:14px;

    margin-bottom:16px;
}

.rating{
    color:#c084fc;
    font-weight:700;
}

.year{
    color:#ddd;
}

.genre-list{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.genre{
    padding:8px 13px;

    border-radius:20px;

    background:rgba(25,25,25,.78);
    border:1px solid rgba(255,255,255,.1);

    color:#ddd;
    font-size:13px;
}

/* =====================================================
   MAIN
===================================================== */

.main{
    position:relative;
    z-index:4;

    padding:0 20px 40px;
    margin-top:-1px;
}

/* =====================================================
   ACTIONS
===================================================== */

.actions{
    display:flex;
    align-items:center;

    gap:28px;

    padding:20px 0;

    border-bottom:1px solid rgba(255,255,255,.08);
}

.action{
    display:flex;
    align-items:center;
    gap:9px;

    background:none;
    border:none;

    color:#fff;
    font-size:15px;

    cursor:pointer;
}

.action-icon{
    width:25px;
    height:25px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:24px;
}

.favorite-icon{
    font-size:31px;
    line-height:1;

    color:#fff;

    transition:
        color .2s ease,
        transform .2s ease;
}

.favorite.active .favorite-icon{
    color:#ff315b;
    transform:scale(1.08);
}

/* =====================================================
   SECTION TITLE
===================================================== */

.section-title{
    font-size:24px;
    font-weight:800;

    margin-top:27px;
    margin-bottom:12px;
}

/* =====================================================
   SYNOPSIS
===================================================== */

.synopsis-wrap{
    border-bottom:1px solid rgba(255,255,255,.08);
    padding-bottom:15px;
}

.synopsis{
    color:#d2d2d2;
    font-size:16px;
    line-height:1.65;

    display:-webkit-box;
    -webkit-box-orient:vertical;
    -webkit-line-clamp:4;
    overflow:hidden;

    transition:max-height .3s ease;
}

.synopsis.expanded{
    display:block;
}

/* seta fica ABAIXO */

.synopsis-toggle{
    width:100%;

    margin-top:10px;

    border:none;
    background:none;

    color:#b565ff;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
}

.chevron{
    font-size:25px;

    transition:transform .25s ease;
}

.synopsis-wrap.expanded .chevron{
    transform:rotate(180deg);
}

/* =====================================================
   INFO
===================================================== */

.info-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;

    margin-top:20px;
}

.info-card{
    background:#121212;

    border:1px solid rgba(255,255,255,.07);

    border-radius:14px;

    padding:15px;
}

.info-label{
    color:#858585;
    font-size:12px;
    margin-bottom:6px;
}

.info-value{
    color:#fff;
    font-size:15px;
    font-weight:700;
}

/* =====================================================
   SEASONS
===================================================== */

.seasons{
    display:flex;
    gap:14px;

    overflow-x:auto;

    padding-bottom:8px;

    scrollbar-width:none;
}

.seasons::-webkit-scrollbar{
    display:none;
}

.season-card{
    flex:0 0 135px;

    background:#121212;

    border-radius:13px;

    overflow:hidden;

    border:1px solid rgba(255,255,255,.07);
}

.season-card img{
    width:100%;
    height:190px;

    object-fit:cover;

    display:block;
}

.season-name{
    padding:10px;

    font-weight:700;
    font-size:14px;
}

/* =====================================================
   TOAST
===================================================== */

.toast{
    position:fixed;

    left:50%;
    bottom:25px;

    transform:
        translate(-50%,120px);

    z-index:100;

    background:#181818;

    border:1px solid rgba(168,85,247,.35);

    color:#fff;

    padding:13px 20px;

    border-radius:12px;

    font-size:14px;

    opacity:0;

    transition:
        opacity .25s ease,
        transform .25s ease;
}

.toast.show{
    opacity:1;

    transform:
        translate(-50%,0);
}
/* =====================================================
   AJUSTE FINAL PLAYNIME
===================================================== */

@media (max-width:600px){

    .hero{
        min-height:540px;
    }

    .hero-content{
        left:18px;
        right:18px;
        bottom:38px;
    }

    .anime-title{
        font-size:32px;
    }

    .main{
        padding-left:18px;
        padding-right:18px;
    }

    .actions{
        justify-content:space-between;
        gap:12px;
    }

    .action{
        font-size:14px;
    }

    .action-icon{
        font-size:23px;
    }

    .favorite-icon{
        font-size:34px;
    }

    .info-grid{
        grid-template-columns:1fr 1fr;
    }

}

@media (min-width:700px){

    .hero-content,
    .main{
        max-width:1000px;
        margin-left:auto;
        margin-right:auto;
    }

      }
</style>

</head>

<body>

<div class="hero">

    <img
        id="heroBackground"
        class="hero-bg"
        src=""
        alt="">

    <div class="top-bar">

        <button
            class="back-btn"
            onclick="history.back()">
            ‹
        </button>

        <div class="logo">
            Play<span>Nime</span>
        </div>

        <div class="top-actions">

            <button class="top-icon">
                ⌕
            </button>

        </div>

    </div>

    <div class="hero-content">

        <h1
            id="animeTitle"
            class="anime-title">
            Carregando...
        </h1>

        <div class="meta">

            <span
                id="animeRating"
                class="rating">
                ★ —
            </span>

            <span
                id="animeYear"
                class="year">
                —
            </span>

        </div>

        <div
            id="genres"
            class="genre-list">
        </div>

    </div>

</div>


<main class="main">

    <!-- AÇÕES -->

    <div class="actions">

        <button
            class="action"
            onclick="shareAnime()">

            <span class="action-icon">
                ♧
            </span>

            <span>
                Partilhar
            </span>

        </button>


        <button
            class="action"
            onclick="showToast('Comentários em breve')">

            <span class="action-icon">
                ◯
            </span>

            <span>
                Comentários
            </span>

        </button>


        <button
            id="favoriteButton"
            class="action favorite"
            onclick="toggleFavorite()">

            <span
                id="favoriteIcon"
                class="favorite-icon">
                ♡
            </span>

            <span>
                Favoritos
            </span>

        </button>

    </div>


    <!-- SINOPSE -->

    <h2 class="section-title">
        Sinopse
    </h2>

    <div
        id="synopsisWrap"
        class="synopsis-wrap">

        <p
            id="synopsis"
            class="synopsis">
            Carregando sinopse...
        </p>

        <button
            id="synopsisToggle"
            class="synopsis-toggle"
            onclick="toggleSynopsis()">

            <span class="chevron">
               ⌄
            </span>

        </button>

    </div>


    <!-- INFORMAÇÕES -->

    <h2 class="section-title">
        Informações
    </h2>

    <div class="info-grid">

        <div class="info-card">

            <div class="info-label">
                Ano
            </div>

            <div
                id="infoYear"
                class="info-value">
                —
            </div>

        </div>


        <div class="info-card">

            <div class="info-label">
                Nota
            </div>

            <div
                id="infoRating"
                class="info-value">
                —
            </div>

        </div>

    </div>


    <!-- TEMPORADAS -->

    <h2 class="section-title">
        Temporadas
    </h2>

    <div
        id="seasons"
        class="seasons">
    </div>

</main>


<div
    id="toast"
    class="toast">
</div>


<script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const JIKAN_API =
    "https://api.jikan.moe/v4";

const TMDB_API =
    "https://api.themoviedb.org/3";

/*
   COLOQUE A SUA CHAVE TMDB AQUI
*/

const TMDB_API_KEY =
    "SUA_CHAVE_TMDB";


/* =====================================================
   ID DO ANIME
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const animeId =
    params.get("id");


/* =====================================================
   ELEMENTOS
===================================================== */

const heroBackground =
    document.getElementById(
        "heroBackground"
    );

const animeTitle =
    document.getElementById(
        "animeTitle"
    );

const animeRating =
    document.getElementById(
        "animeRating"
    );

const animeYear =
    document.getElementById(
        "animeYear"
    );

const infoYear =
    document.getElementById(
        "infoYear"
    );

const infoRating =
    document.getElementById(
        "infoRating"
    );

const genres =
    document.getElementById(
        "genres"
    );

const synopsis =
    document.getElementById(
        "synopsis"
    );

const seasons =
    document.getElementById(
        "seasons"
    );


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapeHTML(text){

    if(!text){
        return "";
    }

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =====================================================
   BUSCAR ANIME NO JIKAN
===================================================== */

async function loadAnime(){

    if(!animeId){

        animeTitle.textContent =
            "Anime não encontrado";

        return;
    }

    try{

        const response =
            await fetch(
                `${JIKAN_API}/anime/${animeId}/full`
            );

        if(!response.ok){

            throw new Error(
                "Erro ao buscar anime"
            );
        }

        const json =
            await response.json();

        const anime =
            json.data;

        window.currentAnime =
            anime;


        /* =========================
           TÍTULO
        ========================= */

        animeTitle.textContent =
            anime.title ||
            anime.title_english ||
            "Sem título";


        /* =========================
           NOTA
        ========================= */

        const score =
            anime.score;

        animeRating.textContent =
            score
                ? `★ ${score}`
                : "★ —";

        infoRating.textContent =
            score
                ? `${score}/10`
                : "Sem nota";


        /* =========================
           ANO
        ========================= */

        let year = "—";

        if(anime.year){

            year = anime.year;

        }else if(
            anime.aired &&
            anime.aired.from
        ){

            year =
                new Date(
                    anime.aired.from
                ).getFullYear();

        }

        animeYear.textContent =
            year;

        infoYear.textContent =
            year;


        /* =========================
           GÉNEROS
        ========================= */

        genres.innerHTML = "";

        const genreData =
            anime.genres || [];

        genreData.forEach(
            genre => {

                const tag =
                    document.createElement(
                        "span"
                    );

                tag.className =
                    "genre";

                tag.textContent =
                    genre.name;

                genres.appendChild(
                    tag
                );

            }
        );


        /* =========================
           SINOPSE
        ========================= */

        synopsis.textContent =
            anime.synopsis ||
            "Sinopse não disponível.";


        /* =========================
           TEMPORADAS
        ========================= */

        await loadSeasons(
            anime
        );


        /* =========================
           TMDB
        ========================= */

        await loadTMDBBackground(
            anime
        );


        /* =========================
           FAVORITO
        ========================= */

        updateFavoriteButton();

    }catch(error){

        console.error(
            "Erro:",
            error
        );

        animeTitle.textContent =
            "Não foi possível carregar";

        synopsis.textContent =
            "Ocorreu um erro ao carregar as informações deste anime.";
    }

}


/* =====================================================
   BUSCAR FUNDO NO TMDB
===================================================== */

async function loadTMDBBackground(
    anime
){

    if(
        !TMDB_API_KEY ||
        TMDB_API_KEY ===
        "SUA_CHAVE_TMDB"
    ){

        /*
           Se ainda não colocou a chave,
           usamos temporariamente a imagem
           do Jikan.
        */

        const fallback =
            anime.images &&
            anime.images.jpg &&
            anime.images.jpg.large_image_url;

        if(fallback){

            heroBackground.src =
                fallback;
        }

        return;
    }


    try{

        const searchTitle =
            anime.title_english ||
            anime.title ||
            anime.title_japanese;


        const url =
            `${TMDB_API}/search/multi` +
            `?api_key=${TMDB_API_KEY}` +
            `&language=pt-PT` +
            `&query=${encodeURIComponent(
                searchTitle
            )}`;


        const response =
            await fetch(url);


        if(!response.ok){

            throw new Error(
                "TMDB search failed"
            );
        }


        const json =
            await response.json();


        const results =
            (json.results || [])
                .filter(
                    item =>
                        item.media_type === "tv" ||
                        item.media_type === "movie"
                );


        const result =
            results.find(
                item =>
                    item.backdrop_path
            ) ||
            results.find(
                item =>
                    item.poster_path
            );


        if(result){

            if(result.backdrop_path){

                heroBackground.src =
                    `https://image.tmdb.org/t/p/original${result.backdrop_path}`;

            }else if(
                result.poster_path
            ){

                heroBackground.src =
                    `https://image.tmdb.org/t/p/original${result.poster_path}`;

            }

        }else{

            useJikanFallback(
                anime
            );
        }

    }catch(error){

        console.warn(
            "TMDB indisponível:",
            error
        );

        useJikanFallback(
            anime
        );
    }

}


/* =====================================================
   FALLBACK JIKAN
===================================================== */

function useJikanFallback(
    anime
){

    const image =
        anime.images &&
        anime.images.jpg &&
        (
            anime.images.jpg
                .large_image_url ||
            anime.images.jpg
                .image_url
        );

    if(image){

        heroBackground.src =
            image;
    }

                 }

      /* =====================================================
   TEMPORADAS
===================================================== */

async function loadSeasons(
    anime
){

    seasons.innerHTML = "";


    /*
       O anime principal aparece
       como uma temporada.
    */

    addSeasonCard(
        anime,
        "Temporada 1"
    );


    /*
       Tentamos encontrar relações
       de sequências/prequelas no Jikan.
    */

    if(
        !anime.relations ||
        !Array.isArray(anime.relations)
    ){

        return;
    }


    let seasonNumber = 2;


    for(
        const relation of anime.relations
    ){

        if(
            relation.relation !==
            "Sequel"
        ){

            continue;
        }


        if(
            !relation.entry ||
            !relation.entry.length
        ){

            continue;
        }


        const entry =
            relation.entry[0];


        try{

            const response =
                await fetch(
                    `${JIKAN_API}/anime/${entry.mal_id}`
                );


            if(!response.ok){

                continue;
            }


            const json =
                await response.json();


            if(json.data){

                addSeasonCard(
                    json.data,
                    `Temporada ${seasonNumber}`
                );

                seasonNumber++;

            }

        }catch(error){

            console.warn(
                "Erro ao carregar temporada:",
                error
            );

        }


        /*
           Pequeno intervalo para
           não sobrecarregar a API.
        */

        await sleep(350);

    }

}


/* =====================================================
   CRIAR CARD DA TEMPORADA
===================================================== */

function addSeasonCard(
    anime,
    label
){

    const image =
        anime.images &&
        anime.images.jpg &&
        (
            anime.images.jpg
                .large_image_url ||
            anime.images.jpg
                .image_url
        );


    const card =
        document.createElement(
            "div"
        );

    card.className =
        "season-card";


    card.innerHTML = `

        <img
            src="${image || ""}"
            alt="${escapeHTML(
                anime.title
            )}"
            loading="lazy">

        <div class="season-name">
            ${escapeHTML(label)}
        </div>

    `;


    seasons.appendChild(
        card
    );

}


/* =====================================================
   SLEEP
===================================================== */

function sleep(ms){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* =====================================================
   SINOPSE
===================================================== */

function toggleSynopsis(){

    const wrap =
        document.getElementById(
            "synopsisWrap"
        );

    const text =
        document.getElementById(
            "synopsis"
        );


    const expanded =
        wrap.classList.toggle(
            "expanded"
        );


    if(expanded){

        text.classList.add(
            "expanded"
        );

    }else{

        text.classList.remove(
            "expanded"
        );

    }

}


/* =====================================================
   FAVORITOS
===================================================== */

function getFavorites(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "playnime_favorites"
            )
        ) || [];

    }catch(error){

        return [];

    }

}


/* =====================================================
   SALVAR FAVORITOS
===================================================== */

function saveFavorites(
    favorites
){

    localStorage.setItem(
        "playnime_favorites",
        JSON.stringify(
            favorites
        )
    );

}


/* =====================================================
   ALTERAR FAVORITO
===================================================== */

function toggleFavorite(){

    if(
        !window.currentAnime
    ){

        return;
    }


    const anime =
        window.currentAnime;


    let favorites =
        getFavorites();


    const id =
        anime.mal_id;


    const exists =
        favorites.some(
            item =>
                item.id === id
        );


    if(exists){

        favorites =
            favorites.filter(
                item =>
                    item.id !== id
            );


        saveFavorites(
            favorites
        );


        updateFavoriteButton();


        showToast(
            "Removido dos favoritos"
        );


    }else{

        favorites.push({

            id:
                anime.mal_id,

            title:
                anime.title,

            image:
                anime.images?.jpg
                    ?.large_image_url ||
                anime.images?.jpg
                    ?.image_url ||
                "",

            score:
                anime.score || null

        });


        saveFavorites(
            favorites
        );


        updateFavoriteButton();


        showToast(
            "Adicionado aos favoritos"
        );

    }

}


/* =====================================================
   ATUALIZAR CORAÇÃO
===================================================== */

function updateFavoriteButton(){

    if(
        !window.currentAnime
    ){

        return;
    }


    const button =
        document.getElementById(
            "favoriteButton"
        );

    const icon =
        document.getElementById(
            "favoriteIcon"
        );


    const favorites =
        getFavorites();


    const id =
        window.currentAnime
            .mal_id;


    const active =
        favorites.some(
            item =>
                item.id === id
        );


    if(active){

        button.classList.add(
            "active"
        );

        icon.textContent =
            "♥";

    }else{

        button.classList.remove(
            "active"
        );

        icon.textContent =
            "♡";

    }

}


/* =====================================================
   PARTILHAR
===================================================== */

async function shareAnime(){

    if(
        !window.currentAnime
    ){

        return;
    }


    const anime =
        window.currentAnime;


    const title =
        anime.title ||
        "Anime";


    const shareData = {

        title:
            `PlayNime - ${title}`,

        text:
            `Confira ${title} no PlayNime.`,

        url:
            window.location.href

    };


    try{

        if(
            navigator.share
        ){

            await navigator.share(
                shareData
            );

        }else{

            await navigator
                .clipboard
                .writeText(
                    window.location.href
                );

            showToast(
                "Link copiado"
            );

        }

    }catch(error){

        console.log(
            "Partilha cancelada"
        );

    }

}


/* =====================================================
   TOAST
===================================================== */

function showToast(
    message
){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        window.toastTimer
    );


    window.toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* =====================================================
   INICIAR
===================================================== */

loadAnime();
