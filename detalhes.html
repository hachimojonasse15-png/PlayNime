<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title></title>
<style>
:root{--bg:#0b0d10;--card:#11151a;--muted:#8a93a1;--text:#e6eef7;--accent:#4da3ff;--ok:#2ecc71;--warn:#f39c12;--danger:#e74c3c;--radius:14px}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
.container{max-width:980px;margin:0 auto;padding:16px}
.topbar{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,rgba(11,13,16,.95),rgba(11,13,16,.6));backdrop-filter:saturate(120%) blur(8px);border-bottom:1px solid rgba(255,255,255,.06)}
.topbar.row{display:flex;gap:10px;align-items:center;padding:10px 16px}
.btn{background:#1a2028;border:1px solid rgba(255,255,255,.08);color:var(--text);padding:10px 14px;border-radius:12px;font-weight:600;cursor:pointer}
.btn:active{transform:translateY(1px)}
.btn-ghost{background:transparent}
.icon-btn{background:transparent;border:none;color:var(--text);padding:8px;border-radius:10px;cursor:pointer}
.badge{font-size:12px;padding:4px 8px;border-radius:999px;background:#1a2028;border:1px solid rgba(255,255,255,.08)}
.hero{position:relative;overflow:hidden;border-radius:var(--radius)}
.hero.backdrop{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(20px) saturate(120%);opacity:.35}
.hero.content{position:relative;display:grid;grid-template-columns:160px 1fr;gap:16px;padding:16px}
.poster{width:160px;aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:#0f1318;border:1px solid rgba(255,255,255,.06)}
.title{font-size:22px;font-weight:800;margin:0}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;color:var(--muted);font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12px;padding:4px 8px;border-radius:999px;background:#151b22;border:1px solid rgba(255,255,255,.06)}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.section{margin-top:18px;background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius);padding:14px}
.section h3{margin:0 0 10px 0;font-size:16px}
.synopsis{color:#c9d3df;line-height:1.6}
.seasons{display:flex;gap:8px;flex-wrap:wrap}
.season-btn{padding:8px 12px;border-radius:10px;background:#151b22;border:1px solid rgba(255,255,255,.08);cursor:pointer}
.season-btn.active{background:var(--accent);color:#061220;border-color:transparent}
.episodes{display:grid;grid-template-columns:1fr;gap:10px}
.ep{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:#0f1318;border:1px solid rgba(255,255,255,.06);cursor:pointer}
.ep:hover{background:#131a22}
.ep.thumb{width:120px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#0c0f13;flex:0 0 120px}
.ep.info{flex:1;min-width:0}
.ep.num{font-weight:700}
.ep.runtime{color:var(--muted);font-size:12px}
.comments.comment{background:#0f1318;border:1px solid rgba(255,255,255,.06);padding:10px;border-radius:10px;margin-bottom:8px}
.comment-head{display:flex;gap:8px;align-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:#1a2028}
.comment-form{display:flex;gap:8px;margin-top:10px}
.comment-form input{flex:1;background:#0f1318;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px;color:var(--text)}
.loader{padding:20px;text-align:center;color:var(--muted)}
.error{padding:12px;border-radius:10px;background:rgba(231,76,60,.12);border:1px solid rgba(231,76,60,.35);color:#ffb3ad}
.topbar.title{font-size:16px}
@media(max-width:700px){
 .hero.content{grid-template-columns:1fr}
 .poster{width:120px}
 .ep.thumb{width:100px}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="row">
    <button class="icon-btn" onclick="voltarHome()" aria-label="Voltar">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="title" id="topTitle">Detalhes</div>
    <div style="margin-left:auto;display:flex;gap:8px">
      <button class="icon-btn" onclick="compartilharAnime()" aria-label="Compartilhar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 12v7a1 1 0 001 1h14a1 1 0 001-1v-7" stroke="currentColor" stroke-width="2"/><path d="M12 3v12M8 7l4-4 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="favoriteBtn" class="icon-btn" onclick="toggleFavorito()" aria-label="Favorito">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z" stroke="currentColor" stroke-width="2"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="container" id="page">
  <div id="loader" class="loader">Carregando...</div>
  <div id="erro" class="error" style="display:none"></div>
  <div id="content" style="display:none">
    <div class="hero">
      <div class="backdrop" id="backdrop"></div>
      <div class="content">
        <div class="poster"><img id="poster" src="" alt=""></div>
        <div>
          <h1 class="title" id="title"></h1>
          <div class="meta" id="meta"></div>
          <div class="tags" id="genres"></div>
          <div class="actions">
            <button class="btn" onclick="playPrimeiro()">▶ Assistir</button>
            <button class="btn btn-ghost" onclick="abrirTrailer()">Trailer</button>
          </div>
        </div>
      </div>
    </div>

    <div class="section">
      <h3>Sinopse</h3>
      <div class="synopsis" id="synopsis"></div>
    </div>

    <div class="section" id="seasonsWrap" style="display:none">
      <h3>Temporadas</h3>
      <div class="seasons" id="seasons"></div>
    </div>

    <div class="section">
      <h3>Episódios</h3>
      <div id="episodes" class="episodes"></div>
    </div>

    <div class="section comments">
      <h3>Comentários</h3>
      <div id="commentsList"></div>
      <form class="comment-form" onsubmit="enviarComentario(event)">
        <input id="commentInput" placeholder="Escreve um comentário..." required>
        <button class="btn">Enviar</button>
      </form>
    </div>
  </div>
</div>

<script>
  const API_KEY = "8e893942e01c23b312df265d558e27fc"; // TMDB
const IMG_BASE = "https://image.tmdb.org/t/p/";
let animeAtual = null;
let temporadaAtual = 1;

function qs(k){return new URLSearchParams(location.search).get(k)}
function esc(s){return (s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function formatRuntime(min){ if(!min) return ""; const h=Math.floor(min/60),m=min%60; return h?`${h}h ${m}m`:`${m}m`}

async function fetchJSON(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error("Erro api");
  return r.json();
}

async function carregarDetalhes(){
  try{
    const id = qs("id");
    const tipo = qs("tipo") || "tv";
    if(!id) throw new Error("ID não encontrado");

    const data = await fetchJSON(`https://api.themoviedb.org/3/${tipo}/${id}?api_key=${API_KEY}&language=pt-BR&append_to_response=credits,videos`);
    animeAtual = data;

    document.getElementById("title").textContent = data.name || data.title;
    document.getElementById("topTitle").textContent = data.name || data.title;
    document.getElementById("poster").src = data.poster_path? IMG_BASE+"w500"+data.poster_path : "";
    document.getElementById("backdrop").style.backgroundImage = `url(${IMG_BASE}w1280${data.backdrop_path})`;
    document.getElementById("synopsis").textContent = data.overview || "Sem sinopse disponível.";

    const meta = [];
    if(data.first_air_date) meta.push(new Date(data.first_air_date).getFullYear());
    if(data.number_of_seasons) meta.push(`${data.number_of_seasons} Temporadas`);
    if(data.vote_average) meta.push(`⭐ ${data.vote_average.toFixed(1)}`);
    document.getElementById("meta").innerHTML = meta.map(m=>`<span class="badge">${m}</span>`).join("");

    document.getElementById("genres").innerHTML = (data.genres||[]).map(g=>`<span class="tag">${g.name}</span>`).join("");

    if(tipo==="tv" && data.seasons){
      montarSeasons(data.seasons);
    } else {
      document.getElementById("seasonsWrap").style.display="none";
      montarEpisodiosFilme(data);
    }

    atualizarFavorito();
    carregarComentarios();

    document.getElementById("loader").style.display="none";
    document.getElementById("content").style.display="block";
  }catch(e){
    document.getElementById("loader").style.display="none";
    document.getElementById("erro").style.display="block";
    document.getElementById("erro").textContent = "Não foi possível carregar os detalhes.";
  }
}

function montarSeasons(seasons){
  const wrap = document.getElementById("seasons");
  wrap.innerHTML = "";
  seasons.filter(s=>s.season_number>0).forEach(s=>{
    const btn = document.createElement("button");
    btn.className = "season-btn" + (s.season_number===temporadaAtual?" active":"");
    btn.textContent = `Temporada ${s.season_number}`;
    btn.onclick = ()=>{ temporadaAtual=s.season_number; montarEpisodios(s); document.querySelectorAll(".season-btn").forEach(b=>b.classList.remove("active")); btn.classList.add("active"); }
    wrap.appendChild(btn);
  });
  document.getElementById("seasonsWrap").style.display="block";
  const primeira = seasons.find(s=>s.season_number===1) || seasons[0];
  montarEpisodios(primeira);
}

async function montarEpisodios(season){
  const wrap = document.getElementById("episodes");
  wrap.innerHTML = '<div class="loader">Carregando episódios...</div>';
  try{
    const data = await fetchJSON(`https://api.themoviedb.org/3/tv/${animeAtual.id}/season/${season.season_number}?api_key=${API_KEY}&language=pt-BR`);
    wrap.innerHTML = "";
    (data.episodes||[]).forEach(ep=>{
      const div = document.createElement("div");
      div.className="ep";
      div.onclick=()=>playEpisodio(ep.season_number, ep.episode_number);
      div.innerHTML=`
        <div class="thumb"><img loading="lazy" src="${ep.still_path?IMG_BASE+"w300"+ep.still_path:""}" alt=""></div>
        <div class="info">
          <div class="num">${ep.episode_number}. ${esc(ep.name)}</div>
          <div class="runtime">${formatRuntime(ep.runtime)}</div>
        </div>
      `;
      wrap.appendChild(div);
    });
  }catch(e){
    wrap.innerHTML = '<div class="error">Erro ao carregar episódios</div>';
  }
}

function montarEpisodiosFilme(data){
  const wrap = document.getElementById("episodes");
  wrap.innerHTML = `
    <div class="ep" onclick="playFilme()">
      <div class="thumb"><img src="${IMG_BASE+"w300"+data.backdrop_path}" alt=""></div>
      <div class="info">
        <div class="num">1. ${esc(data.title)}</div>
        <div class="runtime">${formatRuntime(data.runtime)}</div>
      </div>
    </div>
  `;
}

function playEpisodio(s,e){ location.href=`player.html?tipo=tv&id=${animeAtual.id}&s=${s}&e=${e}` }
function playFilme(){ location.href=`player.html?tipo=movie&id=${animeAtual.id}` }
function playPrimeiro(){ if(animeAtual.number_of_seasons) playEpisodio(1,1); else playFilme() }

function toggleFavorito(){
  let favs = JSON.parse(localStorage.getItem("playnime_favoritos")||"[]");
  const idx = favs.findIndex(f=>f.id===animeAtual.id);
  if(idx>-1){ favs.splice(idx,1) } else { favs.push({id:animeAtual.id, name:animeAtual.name||animeAtual.title, poster:animeAtual.poster_path}) }
  localStorage.setItem("playnime_favoritos", JSON.stringify(favs));
  atualizarFavorito();
}

function atualizarFavorito(){
  const favs = JSON.parse(localStorage.getItem("playnime_favoritos")||"[]");
  const ativo = favs.some(f=>f.id===animeAtual.id);
  document.getElementById("favoriteBtn").classList.toggle("active", ativo);
}

function compartilharAnime(){
  const url = location.href;
  if(navigator.share){ navigator.share({title:animeAtual.name, url}) } else { navigator.clipboard.writeText(url); alert("Link copiado!") }
}

function voltarHome(){ location.href="index.html" }

function carregarComentarios(){
  const key = `comentarios_${animeAtual.id}`;
  const list = JSON.parse(localStorage.getItem(key)||"[]");
  const wrap = document.getElementById("commentsList");
  wrap.innerHTML = list.map(c=>`<div class="comment"><div class="comment-head"><div class="avatar"></div><b>${esc(c.nome)}</b></div><div>${esc(c.texto)}</div></div>`).join("") || "<p style='color:var(--muted)'>Seja o primeiro a comentar</p>";
}

function enviarComentario(e){
  e.preventDefault();
  const input = document.getElementById("commentInput");
  const key = `comentarios_${animeAtual.id}`;
  const list = JSON.parse(localStorage.getItem(key)||"[]");
  list.push({nome:"Você", texto:input.value, data:Date.now()});
  localStorage.setItem(key, JSON.stringify(list));
  input.value="";
  carregarComentarios();
}

document.addEventListener("DOMContentLoaded", carregarDetalhes);
</script>
</body>
</html>
