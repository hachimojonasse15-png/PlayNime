<!DOCTYPE html>
<html lang="pt">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>PlayNime - Detalhes</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    min-height:100%;
    background:#080808;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow-x:hidden;
}

/* =====================================================
   TOPO
===================================================== */

.topbar{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:82px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:18px 22px;

    z-index:20;
}

.top-left,
.top-right{
    display:flex;
    align-items:center;
    gap:18px;
}

.icon-btn{
    width:42px;
    height:42px;

    border:0;
    background:rgba(0,0,0,.32);

    color:#fff;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
}

.icon-btn svg{
    width:23px;
    height:23px;

    fill:none;
    stroke:currentColor;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

/* =====================================================
   HERO
===================================================== */

.hero{
    position:relative;

    width:100%;
    min-height:690px;

    display:flex;
    align-items:flex-end;

    overflow:hidden;

    background:#080808;
}

.hero-backdrop{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:0;
}

/* escurecimento leve apenas para leitura */
.hero::after{
    content:"";

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:55%;

    background:linear-gradient(
        to bottom,
        transparent 0%,
        rgba(0,0,0,.18) 35%,
        rgba(0,0,0,.72) 100%
    );

    z-index:1;

    pointer-events:none;
}

.hero-content{
    position:relative;

    width:100%;

    padding:0 24px 28px;

    z-index:3;
}

.poster{
    display:none;
}

/* =====================================================
   TITULO
===================================================== */

.title{
    max-width:95%;

    font-size:34px;
    line-height:1.08;

    font-weight:800;

    margin-bottom:14px;

    text-shadow:0 2px 8px rgba(0,0,0,.6);
}

/* =====================================================
   METADADOS
===================================================== */

.meta{
    display:flex;
    align-items:center;

    flex-wrap:wrap;

    gap:12px;

    margin-bottom:16px;
}

.rating{
    display:flex;
    align-items:center;

    gap:6px;

    color:#ffffff;

    font-size:17px;
    font-weight:700;
}

.star{
    width:18px;
    height:18px;
}

.star svg{
    width:100%;
    height:100%;

    fill:#ffffff;
    stroke:#ffffff;
}

.year{
    font-size:16px;
    color:#eee;
    font-weight:600;
}

.age{
    min-width:32px;
    height:25px;

    padding:0 7px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#222;

    border-radius:5px;

    font-size:13px;
    font-weight:700;
}

.type{
    color:#ddd;
    font-size:15px;
}

/* =====================================================
   GENEROS
===================================================== */

.genres{
    display:flex;

    flex-wrap:wrap;

    gap:9px;

    margin-bottom:22px;
}

.genre{
    padding:8px 15px;

    border-radius:20px;

    background:rgba(20,20,20,.75);

    border:1px solid rgba(255,255,255,.12);

    color:#eee;

    font-size:14px;
}

/* =====================================================
   CONTEUDO ABAIXO DO HERO
===================================================== */

.details-body{
    position:relative;

    background:#080808;

    padding:0 22px 80px;

    z-index:5;
}

/* =====================================================
   ACOES
===================================================== */

.actions{
    width:100%;

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:10px;

    padding:14px 0 18px;

    border-bottom:1px solid #202020;
}

.action{
    min-height:78px;

    border:1px solid #1e1e1e;

    background:#111;

    border-radius:13px;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:7px;

    color:#fff;

    cursor:pointer;

    transition:.2s;
}

.action:active{
    transform:scale(.96);
}

.action svg{
    width:25px;
    height:25px;

    fill:none;
    stroke:#fff;

    stroke-width:2;

    stroke-linecap:round;
    stroke-linejoin:round;
}

.action span{
    font-size:13px;
    color:#ddd;
}

/* =====================================================
   FAVORITO
===================================================== */

.favorite-action.active svg{
    fill:#ff3154;
    stroke:#ff3154;
}

.favorite-action.active span{
    color:#ff3154;
}

/* =====================================================
   SINOPSE
===================================================== */

.synopsis{
    padding-top:24px;
}

.synopsis-text{
    color:#fff;

    font-size:17px;

    line-height:1.65;

    white-space:pre-line;
}

.synopsis-text.collapsed{
    display:-webkit-box;

    -webkit-line-clamp:4;
    -webkit-box-orient:vertical;

    overflow:hidden;
}

/* =====================================================
   SETA DA SINOPSE
===================================================== */

.synopsis-toggle{
    width:100%;

    height:48px;

    border:0;

    background:transparent;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#fff;

    cursor:pointer;
}

.synopsis-toggle svg{
    width:25px;
    height:25px;

    fill:none;
    stroke:#fff;

    stroke-width:2.5;

    stroke-linecap:round;
    stroke-linejoin:round;

    transition:.25s;
}

.synopsis-toggle.open svg{
    transform:rotate(180deg);
}

/* =====================================================
   TEMPORADAS
===================================================== */

.season-area{
    padding-top:22px;
}

.season-row{
    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:12px;

    margin-bottom:15px;
}

.season-select,
.oldest-btn{
    border:1px solid #242424;

    background:#121212;

    color:#fff;

    border-radius:10px;

    min-height:44px;

    padding:0 15px;

    font-size:14px;

    display:flex;
    align-items:center;

    gap:8px;

    cursor:pointer;
}

.season-select svg,
.oldest-btn svg{
    width:19px;
    height:19px;

    fill:none;
    stroke:currentColor;

    stroke-width:2;

    stroke-linecap:round;
    stroke-linejoin:round;
}

/* =====================================================
   EPISODIOS
===================================================== */

.episodes{
    display:flex;

    flex-direction:column;

    gap:13px;
}

.episode{
    width:100%;

    min-height:80px;

    display:flex;

    align-items:center;

    gap:12px;

    cursor:pointer;
}

.episode-thumb{
    width:105px;
    height:62px;

    flex:none;

    object-fit:cover;

    border-radius:7px;

    background:#151515;
}

.episode-info{
    min-width:0;
}

.episode-title{
    font-size:15px;

    font-weight:700;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    margin-bottom:7px;
}

.episode-duration{
    color:#999;

    font-size:13px;
}

/* =====================================================
   MODAL TEMPORADAS
===================================================== */

.season-modal{
    position:fixed;

    inset:0;

    background:rgba(0,0,0,.72);

    display:none;

    align-items:flex-end;

    justify-content:center;

    z-index:100;
}

.season-modal.show{
    display:flex;
}

.season-box{
    width:100%;

    max-height:78vh;

    overflow-y:auto;

    background:#111;

    border-radius:20px 20px 0 0;

    padding:20px;
}

.season-header{
    display:flex;

    align-items:center;
    justify-content:space-between;

    margin-bottom:16px;
}

.season-header h3{
    font-size:20px;
}

.close-season{
    width:38px;
    height:38px;

    border:0;

    background:#1e1e1e;

    color:#fff;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;
}

.close-season svg{
    width:20px;
    height:20px;

    fill:none;
    stroke:#fff;

    stroke-width:2;
}

.season-option{
    width:100%;

    min-height:48px;

    margin-bottom:8px;

    border:1px solid #242424;

    background:#191919;

    color:#fff;

    border-radius:9px;

    text-align:left;

    padding:0 15px;

    cursor:pointer;
}

.season-option.active{
    background:#8b3dff;

    border-color:#8b3dff;
}

/* =====================================================
   TOAST
===================================================== */

.toast{
    position:fixed;

    left:50%;

    bottom:28px;

    transform:
        translate(-50%,20px);

    opacity:0;

    pointer-events:none;

    background:#171717;

    color:#fff;

    border:1px solid #292929;

    border-radius:10px;

    padding:12px 18px;

    font-size:14px;

    z-index:200;

    transition:.25s;
}

.toast.show{
    opacity:1;

    transform:
        translate(-50%,0);
}

</style>
</head>

<body>

<div class="hero">

    <img
        id="backdrop"

        src=""

    <div class="topbar">

        <div class="top-left">

            <button

      <script>

/* =====================================================
   TMDB
===================================================== */

const TMDB_API_KEY =
    "COLOQUE_AQUI_A_SUA_CHAVE_TMDB";

const TMDB_BASE =
    "https://api.themoviedb.org/3";

const TMDB_IMAGE =
    "https://image.tmdb.org/t/p/";

/*
   O TMDB permite montar as URLs das imagens
   usando o caminho retornado pelo objeto da série.
*/

function tmdbImage(path, size="original"){

    if(!path){
        return "";
    }

    return TMDB_IMAGE + size + path;
}


/* =====================================================
   ID / TÍTULO RECEBIDO
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

let tmdbId =
    params.get("tmdbId");

const titleFromUrl =
    params.get("title");


/* =====================================================
   ESTADO
===================================================== */

let anime = null;

let selectedSeasonNumber = 1;

let episodes = [];

let oldestFirst = true;


/* =====================================================
   ELEMENTOS
===================================================== */

const backdrop =
    document.getElementById("backdrop");

const animeTitle =
    document.getElementById("animeTitle");

const animeRating =
    document.getElementById("animeRating");

const animeYear =
    document.getElementById("animeYear");

const animeAge =
    document.getElementById("animeAge");

const animeType =
    document.getElementById("animeType");

const genres =
    document.getElementById("genres");

const synopsisText =
    document.getElementById("synopsisText");

const synopsisToggle =
    document.getElementById("synopsisToggle");

const episodesBox =
    document.getElementById("episodes");

const selectedSeason =
    document.getElementById("selectedSeason");

const seasonModal =
    document.getElementById("seasonModal");

const seasonOptions =
    document.getElementById("seasonOptions");

const toast =
    document.getElementById("toast");

const favoriteBtn =
    document.getElementById("favoriteBtn");


/* =====================================================
   FETCH TMDB
===================================================== */

async function tmdbFetch(url){

    const response =
        await fetch(url,{

            headers:{
                "Authorization":
                    "Bearer " + TMDB_API_KEY,

                "Content-Type":
                    "application/json;charset=utf-8"
            }

        });

    if(!response.ok){

        throw new Error(
            "TMDB HTTP " +
            response.status
        );

    }

    return await response.json();
}


/* =====================================================
   BUSCAR ANIME PELO ID
===================================================== */

async function getAnimeById(id){

    const url =
        TMDB_BASE +
        "/tv/" +
        encodeURIComponent(id) +
        "?language=pt-BR&append_to_response=content_ratings";

    return await tmdbFetch(url);
}


/* =====================================================
   BUSCAR PELO NOME
===================================================== */

async function searchAnime(title){

    const url =
        TMDB_BASE +
        "/search/tv" +
        "?query=" +
        encodeURIComponent(title) +
        "&language=pt-BR&include_adult=false";

    const data =
        await tmdbFetch(url);

    if(
        !data.results ||
        !data.results.length
    ){

        throw new Error(
            "Anime não encontrado no TMDB."
        );

    }

    return data.results[0];
}


/* =====================================================
   CARREGAR DETALHES
===================================================== */

async function loadAnime(){

    try{

        if(!tmdbId){

            if(!titleFromUrl){

                throw new Error(
                    "Nenhum anime foi informado."
                );

            }

            const result =
                await searchAnime(
                    titleFromUrl
                );

            tmdbId =
                result.id;

        }

        anime =
            await getAnimeById(
                tmdbId
            );

        renderAnime();

        await loadSeason(
            selectedSeasonNumber
        );

    }
    catch(error){

        console.error(error);

        animeTitle.textContent =
            "Não foi possível carregar";

        synopsisText.textContent =
            "Não foi possível obter os dados deste anime no TMDB.";

    }

}


/* =====================================================
   RENDERIZAR ANIME
===================================================== */

function renderAnime(){

    if(!anime){
        return;
    }

    /* BACKDROP */

    backdrop.src =
        tmdbImage(
            anime.backdrop_path ||
            anime.poster_path,
            "original"
        );


    /* TITULO */

    animeTitle.textContent =
        anime.name ||
        anime.original_name ||
        "Anime";


    /* NOTA */

    const vote =
        Number(anime.vote_average || 0);

    animeRating.textContent =
        vote.toFixed(1);


    /* ANO */

    const date =
        anime.first_air_date || "";

    animeYear.textContent =
        date ?
        date.substring(0,4) :
        "-";


    /* TIPO */

    animeType.textContent =
        "Série";


    /* CLASSIFICAÇÃO */

    animeAge.textContent =
        getAgeRating(
            anime
        );


    /* GÉNEROS */

    genres.innerHTML = "";

    if(
        anime.genres &&
        anime.genres.length
    ){

        anime.genres.forEach(
            genre => {

                const item =
                    document.createElement(
                        "span"
                    );

                item.className =
                    "genre";

                item.textContent =
                    genre.name;

                genres.appendChild(
                    item
                );

            }
        );

    }


    /* SINOPSE */

    synopsisText.textContent =
        anime.overview ||
        "Sinopse indisponível.";


    /* FAVORITO */

    updateFavoriteButton();

}


/* =====================================================
   CLASSIFICAÇÃO
===================================================== */

function getAgeRating(data){

    try{

        const results =
            data
            .content_ratings
            ?.results || [];

        const pt =
            results.find(
                item =>
                    item.iso_3166_1 === "BR"
            );

        if(pt && pt.rating){
            return pt.rating;
        }

        const us =
            results.find(
                item =>
                    item.iso_3166_1 === "US"
            );

        if(us && us.rating){
            return us.rating;
        }

    }
    catch(e){}

    return "12";

}


/* =====================================================
   TEMPORADAS
===================================================== */

function validSeasons(){

    if(
        !anime ||
        !anime.seasons
    ){

        return [];

    }

    return anime.seasons.filter(
        season =>
            season.season_number >= 0
    );

}


/* =====================================================
   ABRIR MODAL
===================================================== */

function openSeasonModal(){

    seasonOptions.innerHTML = "";

    const seasons =
        validSeasons();

    seasons.forEach(
        season => {

            if(
                season.season_number === 0
            ){
                return;
            }

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "season-option";

            if(
                season.season_number ===
                selectedSeasonNumber
            ){

                button.classList.add(
                    "active"
                );

            }

            button.textContent =
                "Temporada " +
                season.season_number;

            button.onclick =
                () => {

                    selectedSeasonNumber =
                        season.season_number;

                    selectedSeason.textContent =
                        "Temporada " +
                        selectedSeasonNumber;

                    seasonModal.classList.remove(
                        "show"
                    );

                    loadSeason(
                        selectedSeasonNumber
                    );

                };

            seasonOptions.appendChild(
                button
            );

        }
    );

    seasonModal.classList.add(
        "show"
    );

}


/* =====================================================
   CARREGAR TEMPORADA
===================================================== */

async function loadSeason(
    seasonNumber
){

    episodesBox.innerHTML =
        "<div style='padding:20px;color:#777'>A carregar episódios...</div>";

    try{

        const url =
            TMDB_BASE +
            "/tv/" +
            encodeURIComponent(
                tmdbId
            ) +
            "/season/" +
            encodeURIComponent(
                seasonNumber
            ) +
            "?language=pt-BR";

        const data =
            await tmdbFetch(
                url
            );

        episodes =
            data.episodes || [];

        renderEpisodes();

    }
    catch(error){

        console.error(error);

        episodesBox.innerHTML =
            "<div style='padding:20px;color:#777'>Não foi possível carregar os episódios.</div>";

    }

}

<script>

/* =====================================================
   RENDER EPISÓDIOS
===================================================== */

function renderEpisodes(){

    episodesBox.innerHTML = "";

    if(!episodes.length){

        episodesBox.innerHTML =
            "<div style='padding:20px;color:#777'>Nenhum episódio encontrado.</div>";

        return;

    }

    const list =
        [...episodes].sort(
            (a,b) => {

                if(oldestFirst){

                    return a.episode_number -
                           b.episode_number;

                }

                return b.episode_number -
                       a.episode_number;

            }
        );


    list.forEach(
        episode => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "episode";


            /* IMAGEM */

            const image =
                document.createElement(
                    "img"
                );

            image.className =
                "episode-thumb";

            image.alt =
                episode.name || "";

            image.src =
                tmdbImage(
                    episode.still_path,
                    "w300"
                );

            image.onerror =
                () => {

                    image.src =
                        tmdbImage(
                            anime?.poster_path,
                            "w300"
                        );

                };


            /* INFORMAÇÃO */

            const info =
                document.createElement(
                    "div"
                );

            info.className =
                "episode-info";


            const title =
                document.createElement(
                    "div"
                );

            title.className =
                "episode-title";

            title.textContent =
                episode.episode_number +
                ". " +
                (
                    episode.name ||
                    "Episódio " +
                    episode.episode_number
                );


            const duration =
                document.createElement(
                    "div"
                );

            duration.className =
                "episode-duration";

            duration.textContent =
                formatRuntime(
                    episode.runtime
                );


            info.appendChild(
                title
            );

            info.appendChild(
                duration
            );


            item.appendChild(
                image
            );

            item.appendChild(
                info
            );


            item.onclick =
                () => {

                    openEpisode(
                        episode
                    );

                };


            episodesBox.appendChild(
                item
            );

        }
    );

}


/* =====================================================
   DURAÇÃO
===================================================== */

function formatRuntime(
    runtime
){

    if(
        runtime &&
        Number(runtime) > 0
    ){

        return runtime +
               " min";

    }

    return "24 min";

}


/* =====================================================
   EPISÓDIO
===================================================== */

function openEpisode(
    episode
){

    /*
       Aqui deixamos preparado para
       ligar posteriormente ao player.

       Por enquanto apenas mostramos
       o episódio selecionado.
    */

    showToast(
        "Episódio " +
        episode.episode_number +
        ": " +
        (
            episode.name ||
            "Episódio"
        )
    );

}


/* =====================================================
   ORDEM DOS EPISÓDIOS
===================================================== */

document
    .getElementById("oldestBtn")
    .addEventListener(
        "click",
        () => {

            oldestFirst =
                !oldestFirst;

            const label =
                document.querySelector(
                    "#oldestBtn span"
                );

            label.textContent =
                oldestFirst
                ? "Antigos"
                : "Recentes";

            renderEpisodes();

        }
    );


/* =====================================================
   TEMPORADA
===================================================== */

document
    .getElementById("seasonSelect")
    .addEventListener(
        "click",
        openSeasonModal
    );


document
    .getElementById("closeSeason")
    .addEventListener(
        "click",
        () => {

            seasonModal.classList.remove(
                "show"
            );

        }
    );


seasonModal.addEventListener(
    "click",
    event => {

        if(
            event.target ===
            seasonModal
        ){

            seasonModal.classList.remove(
                "show"
            );

        }

    }
);


/* =====================================================
   SINOPSE EXPANDIR / DIMINUIR
===================================================== */

synopsisToggle.addEventListener(
    "click",
    () => {

        const open =
            !synopsisText.classList.contains(
                "collapsed"
            );

        if(open){

            synopsisText.classList.add(
                "collapsed"
            );

            synopsisToggle.classList.remove(
                "open"
            );

        }
        else{

            synopsisText.classList.remove(
                "collapsed"
            );

            synopsisToggle.classList.add(
                "open"
            );

        }

    }
);


/* =====================================================
   FAVORITOS
===================================================== */

function favoriteKey(){

    return "playnime_favorite_" +
           (
               anime?.id ||
               tmdbId
           );

}


function isFavorite(){

    return localStorage.getItem(
        favoriteKey()
    ) === "true";

}


function updateFavoriteButton(){

    if(
        isFavorite()
    ){

        favoriteBtn.classList.add(
            "active"
        );

    }
    else{

        favoriteBtn.classList.remove(
            "active"
        );

    }

}


favoriteBtn.addEventListener(
    "click",
    () => {

        if(!anime){
            return;
        }

        const active =
            isFavorite();

        if(active){

            localStorage.removeItem(
                favoriteKey()
            );

            favoriteBtn.classList.remove(
                "active"
            );

            showToast(
                "Removido dos favoritos"
            );

        }
        else{

            localStorage.setItem(
                favoriteKey(),
                "true"
            );

            favoriteBtn.classList.add(
                "active"
            );

            showToast(
                "Adicionado aos favoritos"
            );

        }

    }
);


/* =====================================================
   PARTILHAR
===================================================== */

async function shareAnime(){

    if(!anime){
        return;
    }

    const shareData = {

        title:
            anime.name ||
            "PlayNime",

        text:
            "Confira " +
            (
                anime.name ||
                "este anime"
            ) +
            " no PlayNime.",

        url:
            window.location.href

    };


    try{

        if(
            navigator.share
        ){

            await navigator.share(
                shareData
            );

        }
        else{

            await navigator.clipboard.writeText(
                window.location.href
            );

            showToast(
                "Link copiado"
            );

        }

    }
    catch(error){

        console.log(
            "Partilha cancelada."
        );

    }

}


document
    .getElementById("shareBtn")
    .addEventListener(
        "click",
        shareAnime
    );


document
    .getElementById("shareTop")
    .addEventListener(
        "click",
        shareAnime
    );

   COMENTÁRIOS
===================================================== */

document
    .getElementById("commentsBtn")
    .addEventListener(
        "click",
        () => {

            showToast(
                "Comentários em breve"
            );

        }
    );


/* =====================================================
   NOTIFICAÇÕES
===================================================== */

document
    .getElementById("notificationBtn")

        "click",
        () => {

            showToast(
                "Nenhuma notificação nova"
            );

        }
    );


/* =====================================================
   TOAST
===================================================== */

let toastTimer;

function showToast(
    message
){

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* =====================================================
   INICIAR
===================================================== */

loadAnime();

</script>
