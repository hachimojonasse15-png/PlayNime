<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pesquisar - PlayNime</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{background:#070707;color:#fff;min-height:100%}
body{padding-bottom:20px}
.search-header{height:58px;padding:0 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50;background:#070707}
.back-button{width:34px;height:34px;border:0;border-radius:50%;background:#151515;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.back-button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.search-box{flex:1;height:36px;display:flex;align-items:center;background:#151515;border:1px solid #292929;border-radius:12px;padding:0 10px;gap:7px}
.search-box:focus-within{border-color:#a855f7}
.search-box svg{width:15px;height:15px;flex:0 0 auto;fill:none;stroke:#888;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#campo-pesquisa{width:100%;border:0;outline:0;background:transparent;color:#fff;font-size:13px}
#campo-pesquisa::placeholder{color:#777}
.chips{display:flex;gap:8px;align-items:center;padding:0 14px 8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;background:transparent;color:#9a9a9a;font-size:12px;font-weight:600;padding:4px 10px;border-radius:14px;cursor:pointer;white-space:nowrap}
.chip.active{background:#f3f3f3;color:#111}
.secao-titulo{font-size:16px;font-weight:700;padding:2px 14px 10px}
.categorias{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 20px}
.cat-card{position:relative;height:50px;border:0;border-radius:10px;overflow:hidden;cursor:pointer;text-align:left;color:#fff;padding:0 10px;display:flex;align-items:center}
.cat-card span{position:relative;z-index:2;font-size:13px;font-weight:700;max-width:62%}
.cat-card img{position:absolute;right:6px;top:50%;width:36px;height:52px;object-fit:cover;border-radius:5px;transform:translateY(-50%) rotate(8deg);box-shadow:0 3px 8px rgba(0,0,0,.35);pointer-events:none}
#resultados{padding:0 14px 24px}
.mensagem{padding:40px 16px;text-align:center;color:#777;font-size:13px;line-height:1.5}
.resultado{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #181818;cursor:pointer}
.resultado:active{opacity:.75}
.resultado-poster{width:48px;height:68px;flex:0 0 48px;border-radius:6px;overflow:hidden;background:#151515;position:relative}
.resultado-poster img{width:100%;height:100%;object-fit:cover;display:block}
.card-logo{position:absolute;bottom:0;left:0;right:0;max-height:16px;width:100%;object-fit:contain;display:none}
.resultado-poster:has(.card-logo) img:first-of-type{max-height:calc(100% - 16px)}
.resultado-info{min-width:0;flex:1;padding-top:1px}
.resultado-titulo{font-size:13px;font-weight:700;color:#fff;line-height:1.25;margin-bottom:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.resultado-ano,.resultado-eps{color:#a3a3a3;font-size:11px;line-height:1.35}
.tag-anime{display:inline-block;margin-top:4px;background:#6d4aff;color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px}
.loader-wrap{display:flex;justify-content:center;padding:40px 0}
.loader{width:24px;height:24px;border:3px solid #2a2a2a;border-top-color:#a855f7;border-radius:50%;animation:girar .7s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header class="search-header">
    <button class="back-button" id="btn-voltar" aria-label="Voltar">
        <svg viewBox="0 0 24 24"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
    </button>
    <div class="search-box">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"></circle><path d="M16 16l5 5"></path></svg>
        <input id="campo-pesquisa" type="search" placeholder="O que está procurando?" autocomplete="off">
    </div>
</header>
<div class="chips" id="chips">
    <button class="chip active" data-modo="tudo" type="button">Tudo</button>
</div>
<section id="painel-categorias">
    <h1 class="secao-titulo">Categorias</h1>

</section>
<main id="resultados" hidden></main>
<script>

];

let temporizador = null;

let idsPorCategoria = {};

const logoCache = {};
const artInfo = {};
try{Object.assign(logoCache,JSON.parse(localStorage.getItem("playnime_logo_en_v9")||"{}"))}catch(e){}
function saveLogos(){try{localStorage.setItem("playnime_logo_en_v9",JSON.stringify(logoCache))}catch(e){}}
function escaparHTML(t){return String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}
function limpar(t){return String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();}
function bloqueado(titulo){var t=limpar(titulo);return BLOQUEADOS.some(function(p){return t.indexOf(limpar(p))!==-1;});}
function mostrarLoader(){resultados.hidden=false;painelCategorias.hidden=true;resultados.innerHTML='<div class="loader-wrap"><div class="loader"></div></div>';}
function atualizarChips(){var html='<button class="chip'+(!categoriaAtual?" active":"")+'" data-modo="tudo" type="button">Tudo</button>';if(categoriaAtual)html+='<button class="chip active" data-modo="categoria">'+escaparHTML(categoriaAtual.nome)+'</button>';chips.innerHTML=html;}
function mostrarCategorias(){modo="categorias";categoriaAtual=null;paginaAtual=1;temMais=false;idsMostrados=new Set();seriesMostradas={};campo.value="";painelCategorias.hidden=false;resultados.hidden=true;resultados.innerHTML="";atualizarChips();}
function nomeAnime(item){var ro=item.title||"",en=item.title_english||"",ja=item.title_japanese||"";if(!en&&!ro)return ja||"Sem título";if(!en)return ro||ja;if(!ro)return en;if(limpar(en)===limpar(ro))return en;return en;}
function anoAnime(item){if(item.year)return String(item.year);if(item.aired&&item.aired.from)return String(item.aired.from).substring(0,4);return "";}
function posterAnime(item){if(item.images&&item.images.jpg)return item.images.jpg.image_url||item.images.jpg.large_image_url||"";return "";}
function chaveSerie(item){var t=(item.title_english||item.title||"").replace(/[:\-–]\s*(season|temporada|part|cour|arc)\s*\d+.*/i,"");t=t.replace(/\s*\(?\d+(st|nd|rd|th)\s*(season|cour)\)?.*$/i,"").replace(/\s+/g," ").trim();return t;}
function eAnime(item){var tipo=String(item.type||"").toLowerCase().replace(/_/g," ");if(["manga","manhwa","manhua","novel","light novel","one shot","doujinshi","music"].indexOf(tipo)!==-1)return false;if(/special|movie|film/i.test(tipo))return false;return true;}
function valido(item){if(!item||!eAnime(item))return false;if(/rx|hentai/i.test(String(item.rating||"")))return false;if(bloqueado(nomeAnime(item))||bloqueado(item.title||"")||bloqueado(item.title_japanese||""))return false;var tipo=String(item.type||"").toUpperCase();return tipo==="TV"||tipo==="TV SHORT"||tipo==="ONA"||tipo==="OVA";}
function distancia(a,b){if(a===b)return 0;if(!a.length)return b.length;if(!b.length)return a.length;if(Math.abs(a.length-b.length)>4)return 99;var ant=[],i,j;for(j=0;j<=b.length;j++)ant[j]=j;for(i=0;i<a.length;i++){var nova=[i+1];for(j=0;j<b.length;j++){var custo=a[i]===b[j]?0:1;nova[j+1]=Math.min(ant[j+1]+1,nova[j]+1,ant[j]+custo);}ant=nova;}return ant[b.length];}
function tokenParecido(a,b){if(!a||!b)return false;if(a===b||a.indexOf(b)!==-1||b.indexOf(a)!==-1)return true;var n=Math.max(a.length,b.length);if(n<=2)return a===b;var d=distancia(a,b);if(n<=4)return d<=1;if(n<=8)return d<=2;return d<=3;}
function relevancia(item,consulta){var q=limpar(consulta);if(!q)return 50;var titulos=[item.title,item.title_japanese,item.title_english,nomeAnime(item)].concat(item.title_synonyms||[]);var qPartes=q.split(" ").filter(Boolean);var pontos=0;titulos.forEach(function(titulo){var tLimpo=limpar(titulo||"");if(tLimpo===q)pontos=Math.max(pontos,1000);else if(tLimpo.indexOf(q)===0)pontos=Math.max(pontos,900);else if(tLimpo.indexOf(q)!==-1)pontos=Math.max(pontos,700);else{var todas=qPartes.every(function(p){return tLimpo.indexOf(p)!==-1;});if(todas)pontos=Math.max(pontos,500);}});return pontos;}
function idsDeOutrasCategorias(){var ids=new Set();var atual=categoriaAtual&&categoriaAtual.id;Object.keys(idsPorCategoria).forEach(function(cat){if(cat===atual)return;idsPorCategoria[cat].forEach(function(id){ids.add(id);});});return ids;}
function cartaoHTML(item,logo){var titulo=nomeAnime(item);var ano=anoAnime(item);var eps=item.episodes?item.episodes+" Episódios":"Episódios —";var poster=posterAnime(item);var logoHTML=logo?'<img class="card-logo" src="'+escaparHTML(logo)+'" alt="" referrerpolicy="no-referrer" loading="lazy" style="display:block;">':'';return '<article class="resultado" data-id="'+escaparHTML(String(item.mal_id||item.id||""))+'" data-chave="'+escaparHTML(chaveSerie(item))+'"><div class="resultado-poster">'+(poster?'<img src="'+escaparHTML(poster)+'" alt="" referrerpolicy="no-referrer" loading="lazy">':'')+logoHTML+'</div><div class="resultado-info"><div class="resultado-titulo">'+escaparHTML(titulo)+'</div>'+(ano?'<div class="resultado-ano">'+escaparHTML(ano)+'</div>':'')+('<span class="tag-anime">Anime</span>')+'</div></article>';}
function acrescentar(lista,consulta,resetar){var filtrados=lista.filter(valido);if(consulta){filtrados=filtrados.map(function(item){item._score=relevancia(item,consulta);return item;}).sort(function(a,b){return (b._score||0)-(a._score||0);});filtrados=filtrados.filter(function(item){return item._score>=400;});}var idsOutras=idsDeOutrasCategorias();var msg=resetar?'<div class="mensagem">Nenhum anime encontrado.</div>':"";filtrados=filtrados.filter(function(item){var chave=chaveSerie(item);var id=item.mal_id||item.id||"";if(idsMostrados.has(chave)||idsMostrados.has(id))return false;if(idsOutras.has(id))return false;return true;});if(!filtrados.length){if(resetar&&!resultados.querySelector(".resultado")){resultados.innerHTML=msg;}return;}if(resetar){resultados.innerHTML="";}var html=filtrados.map(function(item){return cartaoHTML(item,"");}).join("");if(!resultados.querySelector(".resultado")&&!resetar){var msgElement=resultados.querySelector(".mensagem,.loader-wrap");if(msgElement)msgElement.remove();}resultados.insertAdjacentHTML("beforeend",html);filtrados.forEach(function(item){var chave=chaveSerie(item);var id=item.mal_id||item.id||"";idsMostrados.add(chave);idsMostrados.add(id);seriesMostradas[chave]=item;if(categoriaAtual&&categoriaAtual.id){if(!idsPorCategoria[categoriaAtual.id])idsPorCategoria[categoriaAtual.id]=[];idsPorCategoria[categoriaAtual.id].push(id);}});filtrados.forEach(function(item){obterLogoEN(item);});}
function normalizarAniList(item){if(!item)return null;return{mal_id:item.idMal||item.id,title:(item.title&&(item.title.romaji||item.title.native||item.title.english))||"Sem título",title_japanese:item.title&&item.title.native||"",title_english:item.title&&item.title.english||"",title_romaji:item.title&&item.title.romaji||"",year:item.seasonYear||"",type:item.format||"TV",format:item.format||"TV",episodes:item.episodes,coverImage:item.coverImage&&(item.coverImage.large||item.coverImage.medium),images:{jpg:{image_url:item.coverImage&&(item.coverImage.large||item.coverImage.medium)||""}}};}
async function buscarJikan(caminho){try{var r=await fetch(JIKAN+caminho);if(r.status===429){await new Promise(function(ok){setTimeout(ok,1000);});r=await fetch(JIKAN+caminho);}if(!r.ok)return null;var d=await r.json();var lista=(d.data||[]).map(function(item){return{mal_id:item.mal_id,title:item.title,title_english:item.title_english,title_japanese:item.title_japanese,type:item.type,format:item.type,year:item.aired&&item.aired.from?String(item.aired.from).substring(0,4):"",episodes:item.episodes,images:item.images,title_synonyms:item.title_synonyms||[]};});return{lista:lista,mais:!!(d.pagination&&d.pagination.has_next_page)};;}catch(e){return null;}}
async function buscarAniList(consulta,cat,pagina){var filtros="type: ANIME, isAdult: false, sort: POPULARITY_DESC";if(consulta)filtros+=', search: "'+consulta.replace(/"/g,"")+'"';if(cat&&cat.alGenero)filtros+=', genre: "'+cat.alGenero+'"';if(cat&&cat.alTag)filtros+=', tag: "'+cat.alTag+'"';var query='query{Page(page:'+(pagina||1)+',perPage:50){pageInfo{hasNextPage}media('+filtros+'){id idMal format episodes seasonYear startDate{year}title{romaji english native}coverImage{large medium}}}}';try{var r=await fetch(ANILIST,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:query})});if(!r.ok)return null;var d=await r.json();if(!d.data||!d.data.Page)return null;var page=d.data.Page;var lista=(page.media||[]).map(normalizarAniList).filter(Boolean);return{lista:lista,mais:!!(page.pageInfo&&page.pageInfo.hasNextPage)};}catch(e){return null;}}
async function tmGet(path){try{var r=await fetch(TM+path+(path.indexOf("?")>=0?"&":"?")+"api_key="+TK+"&language=en-US",{signal:AbortSignal.timeout(4500)});if(!r||!r.ok)return null;return await r.json();}catch(e){return null;}}
async function fanartGet(id){if(!id)return null;try{var r=await fetch(FANART+"/tv/"+id+"?api_key="+FK,{signal:AbortSignal.timeout(4000)});if(!r||!r.ok)return null;return await r.json();}catch(e){return null;}}
function pickLogoEN(logos){var en=(logos||[]).filter(function(x){return x&&x.file_path&&String(x.iso_639_1||"").toLowerCase()==="en";});en.sort(function(a,b){return (b.vote_average||0)-(a.vote_average||0);});return en[0]?TI+"w300"+en[0].file_path:"";}
function pickFanartLogoEN(d){if(!d)return "";var lista=[].concat(d.hdtvlogo||[],d.clearlogo||[]);var en=lista.filter(function(x){if(!x||!x.url)return false;var lang=String(x.lang||"").toLowerCase();return lang==="en"||lang==="eng"||lang==="english";});if(!en.length)return "";en.sort(function(a,b){return (b.width||0)-(a.width||0);});return en[0].url;}
async function logoDeId(id){if(!id)return {logo:"",temJP:false};var imgs=await tmGet("/tv/"+id+"/images?include_image_language=en,null");var ext=await tmGet("/tv/"+id+"/external_ids");var fa=await fanartGet(ext&&ext.tvdb_id);return {logo:pickFanartLogoEN(fa)||pickLogoEN(imgs&&imgs.logos)||"",temJP:false};}
async function infoArte(titulo){var key=limpar(titulo||"");if(!key)return {logo:"",temJP:false};if(artInfo[key])return artInfo[key];var info={logo:logoCache[key]||"",temJP:false};try{var s=await tmGet("/search/tv?query="+encodeURIComponent(titulo||""));var results=((s&&s.results)||[]).filter(function(r){return (r.genre_ids||[]).indexOf(16)>=0;});var z=results.filter(function(r){return limpar(r.name)===key;})[0]||results[0];if(z)info=await logoDeId(z.id);}catch(e){}artInfo[key]=info;if(info.logo){logoCache[key]=info.logo;saveLogos();}return info;}
async function obterLogoEN(item){var chave=chaveSerie(item);if(!chave)return;var card=resultados.querySelector('[data-chave="'+chave+'"]');if(!card)return;var info=await infoArte(nomeAnime(item));if(info.logo){var posterDiv=card.querySelector(".resultado-poster");if(posterDiv&&!posterDiv.querySelector(".card-logo")){var img=document.createElement("img");img.className="card-logo";img.src=info.logo;img.alt="";img.referrerPolicy="no-referrer";img.loading="lazy";posterDiv.appendChild(img);}}}
async function buscarPagina(resetar){
    if(carregando)return;
    var consulta=campo.value.trim();
    var meuPedido=++pedidoAtual;
    carregando=true;
    if(resetar){paginaAtual=1;idsMostrados=new Set();seriesMostradas={};if(categoriaAtual)idsPorCategoria[categoriaAtual.id]=[];mostrarLoader();atualizarChips();}
    try{
        var resultado=null;
        if(consulta){
            var lista=[], mais=true;
            if(paginaAtual===1){
                var consultaLimpa=limpar(consulta);
                var pedidos=[buscarJikan("/anime?q="+encodeURIComponent(consulta)+"&sfw=true&limit=25&page=1"),buscarAniList(consulta,null,1),buscarAniList("",null,1),buscarAniList("",null,2)];
                if(consultaLimpa!==consulta.toLowerCase())pedidos.push(buscarAniList(consultaLimpa,null,1));
                (await Promise.all(pedidos)).forEach(function(r){if(r&&r.lista&&r.lista.length)lista=lista.concat(r.lista);});
            }else{
                var extra=await Promise.all([buscarAniList("",null,paginaAtual+1),buscarJikan("/top/anime?filter=bypopularity&type=tv&page="+paginaAtual)]);
                extra.forEach(function(r){if(r&&r.lista&&r.lista.length)lista=lista.concat(r.lista);});
                mais=!!lista.length;
            }
            resultado={lista:lista,mais:mais};
        }else if(categoriaAtual&&categoriaAtual.topo){
            resultado=await buscarJikan("/top/anime?filter=bypopularity&type=tv&page="+paginaAtual);
        }else if(categoriaAtual){
            resultado=await buscarJikan("/anime?sfw=true&limit=25&page="+paginaAtual+"&type=tv&genres="+categoriaAtual.jikan+"&order_by=members&sort=desc");
        }
        if((!resultado||!resultado.lista.length)&&(consulta||categoriaAtual))resultado=await buscarAniList(consulta,categoriaAtual,paginaAtual);
        if(meuPedido!==pedidoAtual)return;
        if(!resultado||!resultado.lista.length){if(resetar||!resultados.querySelector(".resultado"))resultados.innerHTML='<div class="mensagem">Nenhum anime encontrado.</div>';temMais=false;return;}
        temMais=consulta?true:!!resultado.mais;
        acrescentar(resultado.lista,consulta,resetar);
    }catch(e){
        if(meuPedido!==pedidoAtual)return;
        if(!resultados.querySelector(".resultado"))resultados.innerHTML='<div class="mensagem">Não foi possível carregar os animes.</div>';
    }finally{if(meuPedido===pedidoAtual)carregando=false;}
}
function abrirCategoria(id){var cat=CATEGORIAS.find(function(c){return c.id===id;});if(!cat)return;modo="categoria";categoriaAtual=cat;campo.value="";buscarPagina(true);}
listaCategorias.innerHTML=CATEGORIAS.map(function(cat){return '<button class="cat-card" type="button" data-id="'+cat.id+'" style="background:'+cat.cor+'"><span>'+escaparHTML(cat.nome)+'</span><img src="'+escaparHTML(cat.poster)+'" alt="" referrerpolicy="no-referrer" loading="lazy" onerror="this.style.display=\'none\'"></button>';}).join("");
campo.addEventListener("input",function(){var consulta=campo.value.trim();clearTimeout(temporizador);if(!consulta){if(categoriaAtual)buscarPagina(true);else mostrarCategorias();return;}categoriaAtual=null;temporizador=setTimeout(function(){buscarPagina(true);},300);});
chips.addEventListener("click",function(e){var botao=e.target.closest(".chip");if(botao&&botao.getAttribute("data-modo")==="tudo")mostrarCategorias();});
listaCategorias.addEventListener("click",function(e){var card=e.target.closest(".cat-card");if(card)abrirCategoria(card.getAttribute("data-id"));});
resultados.addEventListener("click",function(e){var item=e.target.closest(".resultado");if(!item)return;window.location.href="detalhes.html?mal="+encodeURIComponent(item.getAttribute("data-id"));});
document.getElementById("btn-voltar").addEventListener("click",function(){if(modo!=="categorias")mostrarCategorias();else history.back();});
window.addEventListener("scroll",function(){if(resultados.hidden||carregando||!temMais)return;if(window.innerHeight+window.scrollY>=document.body.offsetHeight-160){paginaAtual+=1;buscarPagina(false);}});
mostrarCategorias();
campo.focus();
</script>
</body>
</html>
