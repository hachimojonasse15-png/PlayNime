<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<h1 class="title">Hello again!</h1>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;}
html,body{width:100%;min-height:100%;background:#070707;color:#fff;}
body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  padding:20px 22px 40px;
  background:radial-gradient(circle at 50% 0%,rgba(139,53,255,.15),transparent 50%),#070707;
}

/* BOTÃO VOLTAR */
.back{
  width:42px;
  height:42px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  margin-bottom:40px;
}
.back svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}

/* CONTEÚDO */
.content{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  max-width:380px;
  margin:0 auto;
  width:100%;
}

.title{
  font-size:32px;
  font-weight:800;
  margin-bottom:40px;
  letter-spacing:-0.5px;
  text-align:center;   /* ← esta linha */
}

/* CAMPOS */
.field{
  margin-bottom:18px;
  position:relative;
}
.field input{
  width:100%;
  height:56px;
  background:transparent;
  border:2px solid rgba(255,255,255,.25);
  border-radius:14px;
  padding:0 18px;
  color:#fff;
  font-size:16px;
  outline:none;
  transition:.2s;
}
.field input:focus{
  border-color:#a855f7;
  box-shadow:0 0 0 3px rgba(168,85,247,.15);
}
.field input::placeholder{color:rgba(255,255,255,.45);}

/* OLHO */
.toggle-pass{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  background:none;
  border:none;
  color:rgba(255,255,255,.5);
  cursor:pointer;
  padding:6px;
}
.toggle-pass svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;}

/* BOTÃO */
.btn-login{
  width:100%;
  height:56px;
  margin-top:12px;
  background:transparent;
  border:2px solid #a855f7;
  border-radius:14px;
  color:#a855f7;
  font-size:17px;
  font-weight:700;
  letter-spacing:1px;
  cursor:pointer;
  transition:.2s;
}
.btn-login:active{transform:scale(.98);background:rgba(168,85,247,.1);}

.message{
  margin-top:16px;
  font-size:14px;
  color:#ff6b81;
  min-height:20px;
  text-align:center;
}
</style>
</head>
<body>

<button class="back" onclick="history.back()">
  <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
</button>

<div class="content">
  <h1 class="title">Olá de novo!</h1>

  <form id="loginForm">
    <div class="field">
      <input type="email" id="email" placeholder="E-mail" required autocomplete="email">
    </div>

    <div class="field">
      <input type="password" id="password" placeholder="Palavra-passe" required autocomplete="current-password">
      <button type="button" class="toggle-pass" id="togglePass">
        <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>

    <button type="submit" class="btn-login">ENTRAR</button>
    <div class="message" id="message"></div>
  </form>
</div>

<script>
const password = document.getElementById("password");
const togglePass = document.getElementById("togglePass");

togglePass.addEventListener("click", () => {
  const isPass = password.type === "password";
  password.type = isPass ? "text" : "password";
});

document.getElementById("loginForm").addEventListener("submit", function(e) {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  const senha = password.value;

  if (!email || !senha) {
    document.getElementById("message").textContent = "Preenche todos os campos.";
    return;
  }

  // Aqui depois ligas a autenticação real
  document.getElementById("message").style.color = "#a855f7";
  document.getElementById("message").textContent = "A entrar...";
  
  // Simulação de sucesso → vai para o home
  setTimeout(() => {
    window.location.href = "home.html";
  }, 800);
});
</script>
</body>
        </html>
