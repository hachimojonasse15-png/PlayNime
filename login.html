<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Login — PlayNime</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
html,body{width:100%;min-height:100%;background:#070707;color:#fff}
body{min-height:100vh;display:flex;flex-direction:column;padding:20px 22px 40px;background:radial-gradient(circle at 50% 0%,rgba(139,53,255,.15),transparent 50%),#070707}
.back{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;cursor:pointer;margin-bottom:40px}
.back svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.content{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:380px;margin:0 auto;width:100%}
.title{font-size:32px;font-weight:800;margin-bottom:40px;text-align:center}
.field{margin-bottom:18px;position:relative}
.field input{width:100%;height:56px;background:transparent;border:2px solid rgba(255,255,255,.25);border-radius:14px;padding:0 50px 0 18px;color:#fff;font-size:16px;outline:none}
.field input:focus{border-color:#a855f7}
.toggle-pass{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,.5);cursor:pointer;padding:6px;display:flex}
.toggle-pass svg{width:22px;height:22px}
.btn-login{width:100%;height:56px;margin-top:12px;background:transparent;border:2px solid #a855f7;border-radius:14px;color:#a855f7;font-size:17px;font-weight:700;cursor:pointer}
.message{margin-top:16px;font-size:14px;min-height:20px;text-align:center}
</style>
</head>
<body>

<button class="back" onclick="history.back()">
  <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
</button>

<div class="content">
  <h1 class="title">Hello again!</h1>

  <form id="loginForm">
    <div class="field">
      <input type="email" id="email" placeholder="E-mail" required>
    </div>
    <div class="field">
      <input type="password" id="password" placeholder="Password" required>
      <button type="button" class="toggle-pass" id="togglePass">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
    </div>

    <button type="submit" class="btn-login">Login</button>
    <div class="message" id="message"></div>
  </form>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCOjDokkcdI2-upQMZa5BwOlCbCqUrtmPY",
  authDomain: "playnime-aca11.firebaseapp.com",
  projectId: "playnime-aca11",
  storageBucket: "playnime-aca11.firebasestorage.app",
  messagingSenderId: "397199669163",
  appId: "1:397199669163:web:7273fc848f9a50aead04ee"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

const eyeOpen = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
const eyeClosed = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;

document.getElementById("togglePass").onclick = () => {
  const p = document.getElementById("password");
  const btn = document.getElementById("togglePass");
  if (p.type === "password") {
    p.type = "text";
    btn.innerHTML = eyeClosed;
  } else {
    p.type = "password";
    btn.innerHTML = eyeOpen;
  }
};

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const message = document.getElementById("message");

  message.style.color = "#a855f7";
  message.textContent = "Logging in...";

  try {
    await auth.signInWithEmailAndPassword(email, password);
    message.textContent = "Login successful!";
    setTimeout(() => location.href = "home.html", 600);
  } catch (error) {
    message.style.color = "#ff6b81";
    if (error.code === "auth/user-not-found") {
      message.textContent = "Account not found.";
    } else if (error.code === "auth/wrong-password" || error.code === "auth/invalid-credential") {
      message.textContent = "Incorrect email or password.";
    } else if (error.code === "auth/invalid-email") {
      message.textContent = "Invalid email.";
    } else {
      message.textContent = "Error: " + error.message;
    }
  }
});
</script>
</body>
</html>
