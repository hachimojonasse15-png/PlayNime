<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PlayNime - More</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#070707;color:#fff;min-height:100vh;padding-bottom:110px}
.header{height:60px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:rgba(7,7,7,0.95);backdrop-filter:blur(12px);z-index:100}
.logo{font-size:24px;font-weight:800}
.logo span{color:#9b4dff}
.header-right{display:flex;align-items:center;gap:16px}
.header-right svg{width:24px;height:24px;color:#fff;opacity:.8}
.content{padding:20px 18px 30px}
.user-card{background:#141414;border:1px solid #252525;border-radius:18px;padding:16px 18px;display:flex;align-items:center;gap:14px;margin-bottom:20px}
.user-avatar{width:52px;height:52px;border-radius:50%;background:#2a2a2a;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.user-avatar img{width:100%;height:100%;object-fit:cover}
.user-avatar svg{width:26px;height:26px;color:#888}
.user-info{flex:1;min-width:0}
.user-name{font-size:16px;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-email{font-size:13px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logout-btn{width:40px;height:40px;border-radius:12px;background:#1f1f1f;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;flex-shrink:0}
.logout-btn svg{width:20px;height:20px;color:#aaa}
.menu-card{background:#141414;border:1px solid #252525;border-radius:18px;overflow:hidden;margin-bottom:16px}
.menu-item{display:flex;align-items:center;padding:16px 18px;gap:14px;text-decoration:none;color:#fff;border-bottom:1px solid #1f1f1f;transition:.15s}
.menu-item:last-child{border-bottom:none}
.menu-item:active{background:#1a1a1a}
.menu-icon{width:40px;height:40px;border-radius:12px;background:#1f1f1f;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.menu-icon svg{width:20px;height:20px;color:#c9a0ff}
.menu-text{flex:1}
.menu-title{font-size:15px;font-weight:600}
.menu-sub{font-size:12.5px;color:#777;margin-top:2px}
.bottom-nav{position:fixed;left:16px;right:16px;bottom:18px;height:72px;background:rgba(18,18,18,0.95);border:1px solid #2a2a2a;border-radius:36px;display:grid;grid-template-columns:repeat(4,1fr);z-index:999;box-shadow:0 10px 40px rgba(0,0,0,.7);backdrop-filter:blur(16px)}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#666;text-decoration:none;font-size:11px;font-weight:500}
.nav-icon{font-size:22px;line-height:1}
.nav-item.active{color:#fff}
.nav-item.active .nav-icon{color:#9b4dff}
</style>
</head>
<body>

<header class="header">
  <div class="logo">Play<span>Nime</span></div>
  <div class="header-right">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <div onclick="location.href='perfil.html'" style="width:34px;height:34px;border-radius:50%;background:#2a2a2a;display:flex;align-items:center;justify-content:center;overflow:hidden" id="headerAvatar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
  </div>
</header>

<main class="content">

  <!-- USER CARD -->
  <div class="user-card">
    <div class="user-avatar" id="userAvatar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
    <div class="user-info">
      <div class="user-name" id="userName">Loading...</div>
      <div class="user-email" id="userEmail"></div>
    </div>
    <button class="logout-btn" onclick="logout()" title="Logout">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </div>

  <!-- MENU -->
  <div class="menu-card">
    <a href="perfil.html" class="menu-item">
      <div class="menu-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div class="menu-text">
        <div class="menu-title">Edit profile</div>
        <div class="menu-sub">Customize your account</div>
      </div>
    </a>

    <a href="configuracoes.html" class="menu-item">
      <div class="menu-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </div>
      <div class="menu-text">
        <div class="menu-title">Settings</div>
        <div class="menu-sub">Appearance, language and more</div>
      </div>
    </a>

    <a href="ajuda.html" class="menu-item">
      <div class="menu-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </div>
      <div class="menu-text">
        <div class="menu-title">Help & Support</div>
        <div class="menu-sub">Get help or report issues</div>
      </div>
    </a>
  </div>

</main>

<nav class="bottom-nav">
  <a href="home.html" class="nav-item"><span class="nav-icon">⌂</span><span>Home</span></a>
  <a href="pesquisar.html" class="nav-item"><span class="nav-icon">⌕</span><span>Search</span></a>
  <a href="favoritos.html" class="nav-item"><span class="nav-icon">♡</span><span>Favorites</span></a>
  <a href="mais.html" class="nav-item active"><span class="nav-icon">•••</span><span>More</span></a>
</nav>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCOjDokkcdI2-upQMZa5BwOlCbCqUrtmPY",
  authDomain: "playnime-aca11.firebaseapp.com",
  projectId: "playnime-aca11",
  storageBucket: "playnime-aca11.firebasestorage.app",
  messagingSenderId: "397199669163",
  appId: "1:397199669163:web:7273fc848f9a50aead04ee"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

auth.onAuthStateChanged(user => {
  if (!user) {
    location.href = "welcome.html";
    return;
  }

  document.getElementById("userName").textContent = user.displayName || "User";
  document.getElementById("userEmail").textContent = user.email || "";

  if (user.photoURL) {
    const img = `<img src="${user.photoURL}" alt="avatar">`;
    document.getElementById("userAvatar").innerHTML = img;
    document.getElementById("headerAvatar").innerHTML = img;
  }
});

function logout() {
  auth.signOut().then(() => location.href = "welcome.html");
}
</script>
</body>
    </html>
