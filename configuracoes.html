<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PlayNime - Configurações</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#070707;color:#fff;min-height:100vh}
.header{height:56px;display:flex;align-items:center;padding:0 16px;gap:16px;position:sticky;top:0;background:#070707;z-index:10}
.back{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none}
.back svg{width:24px;height:24px}
.title{font-size:20px;font-weight:600}
.content{padding:10px 18px 40px}
.section{margin-bottom:26px}
.section-title{font-size:13px;font-weight:600;color:#666;text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;padding-left:4px}
.menu-list{display:flex;flex-direction:column;gap:8px}
.option{width:100%;min-height:64px;background:#121212;border:1px solid #232323;border-radius:18px;display:flex;align-items:center;padding:0 16px;color:#fff;text-decoration:none;transition:all .18s}
.option:active{transform:scale(.98);background:#1a1a1a}
.option-icon{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;margin-right:14px;background:rgba(155,77,255,0.22)}
.option-icon svg{width:20px;height:20px;color:#c9a0ff}
.option-text{flex:1}
.option-title{font-size:15.5px;font-weight:600}
.option-sub{color:#777;font-size:12.5px;margin-top:2px}
.arrow{color:#444;font-size:22px;font-weight:300}
</style>
</head>
<body>

<header class="header">
    <a href="mais.html" class="back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </a>
    <div class="title">Configurações</div>
</header>

<main class="content">

    <div class="section">
        <div class="section-title">Preferências</div>
        <div class="menu-list">
            <a href="aparencia.html" class="option">
                <div class="option-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                </div>
                <div class="option-text">
                    <div class="option-title">Aparência</div>
                    <div class="option-sub">Tema e visual do aplicativo</div>
                </div>
                <div class="arrow">›</div>
            </a>
            <a href="idioma.html" class="option">
                <div class="option-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                </div>
                <div class="option-text">
                    <div class="option-title">Idioma</div>
                    <div class="option-sub">Português (Brasil)</div>
                </div>
                <div class="arrow">›</div>
            </a>
            <a href="notificacoes.html" class="option">
                <div class="option-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                </div>
                <div class="option-text">
                    <div class="option-title">Notificações</div>
                    <div class="option-sub">Alertas e atualizações</div>
                </div>
                <div class="arrow">›</div>
            </a>
        </div>
    </div>

    <div class="section">
        <div class="section-title">Sobre</div>
        <div class="menu-list">
            <a href="sobre.html" class="option">
                <div class="option-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                </div>
                <div class="option-text">
                    <div class="option-title">Sobre o PlayNime</div>
                    <div class="option-sub">Informações do aplicativo</div>
                </div>
                <div class="arrow">›</div>
            </a>
        </div>
    </div>

</main>
</body>
                        </html>
