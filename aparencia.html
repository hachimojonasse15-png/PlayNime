<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PlayNime - Aparência</title>
<style>
:root {
    --bg: #000;
    --card: #121212;
    --border: #222;
    --text: #fff;
    --sub: #888;
    --header: #000;
}
body.light {
    --bg: #f2f2f7;
    --card: #ffffff;
    --border: #e5e5ea;
    --text: #000;
    --sub: #666;
    --header: #f2f2f7;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);min-height:100vh;transition:background .25s,color .25s}
.header{height:56px;display:flex;align-items:center;padding:0 16px;gap:16px;position:sticky;top:0;background:var(--header);z-index:10}
.back{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--text);text-decoration:none}
.back svg{width:24px;height:24px}
.title{font-size:20px;font-weight:600}
.content{padding:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:all .2s}
.card.active{border-color:#9b4dff}
.card-title{font-size:16px;font-weight:500}
.card-sub{font-size:13px;color:var(--sub);margin-top:3px}
.check{width:24px;height:24px;border-radius:50%;border:2px solid #555;display:flex;align-items:center;justify-content:center}
.card.active .check{background:#9b4dff;border-color:#9b4dff}
.card.active .check::after{content:'';width:10px;height:10px;background:#fff;border-radius:50%}
</style>
</head>
<body>

<header class="header">
    <a href="configuracoes.html" class="back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
    </a>
    <div class="title">Aparência</div>
</header>

<main class="content">
    <div class="card" id="dark" onclick="setTheme('dark')">
        <div>
            <div class="card-title">Modo Escuro</div>
            <div class="card-sub">Tema padrão do PlayNime</div>
        </div>
        <div class="check"></div>
    </div>

    <div class="card" id="light" onclick="setTheme('light')">
        <div>
            <div class="card-title">Modo Claro</div>
            <div class="card-sub">Interface clara</div>
        </div>
        <div class="check"></div>
    </div>
</main>

<script>
function safeGet(key, fallback) {
    try {
        return localStorage.getItem(key) || fallback;
    } catch (e) {
        return fallback;
    }
}

function safeSet(key, value) {
    try {
        localStorage.setItem(key, value);
    } catch (e) {}
}

function setTheme(theme) {
    safeSet('playnime-theme', theme);
    applyTheme();
}

function applyTheme() {
    const theme = safeGet('playnime-theme', 'dark');
    document.body.classList.toggle('light', theme === 'light');
    document.getElementById('dark').classList.toggle('active', theme === 'dark');
    document.getElementById('light').classList.toggle('active', theme === 'light');
}

applyTheme();
</script>
</body>
      </html>
