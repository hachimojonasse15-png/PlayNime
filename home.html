<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>PlayNime</title>

<style>

/* =====================================================
   BASE
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

html{
    background:#070707;
}

body{
    background:#070707;
    color:#fff;
    min-height:100vh;
    padding-bottom:110px;
}

button{
    font-family:inherit;
}


/* =====================================================
   TOPO
===================================================== */

.header{

    height:76px;

    padding:0 18px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    position:sticky;

    top:0;

    z-index:50;

    background:
        linear-gradient(
            to bottom,
            rgba(7,7,7,.98),
            rgba(7,7,7,.88),
            transparent
        );
}

.logo{

    display:flex;

    align-items:center;

    gap:9px;

    font-size:24px;

    font-weight:800;

    letter-spacing:-1px;
}

.logo-icon{

    width:39px;
    height:39px;

    border-radius:11px;

    background:
        linear-gradient(
            135deg,
            #8b35ff,
            #b66cff
        );

    display:flex;

    align-items:center;

    justify-content:center;

    box-shadow:
        0 5px 20px
        rgba(139,53,255,.35);
}

.logo-icon::after{

    content:"";

    width:0;
    height:0;

    border-top:8px solid transparent;
    border-bottom:8px solid transparent;
    border-left:13px solid white;

    margin-left:3px;
}

.logo span{

    color:#a855f7;
}

.header-search{

    width:42px;
    height:42px;

    border:1px solid #292929;

    background:#151515;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    color:white;

    cursor:pointer;
}

.header-search svg{

    width:22px;
    height:22px;

    stroke:white;

    fill:none;

    stroke-width:2;

    stroke-linecap:round;

    stroke-linejoin:round;
}


/* =====================================================
   CONTEÚDO
===================================================== */

#home-content{

    width:100%;

    overflow:hidden;
}

.home-loading{

    padding:60px 20px;

    text-align:center;

    color:#777;

    font-size:14px;
}


/* =====================================================
   SECÇÕES
===================================================== */

.anime-section{

    margin-bottom:27px;
}

.section-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 15px;

    margin-bottom:13px;
}

.section-title{

    font-size:20px;

    font-weight:750;

    letter-spacing:-.3px;
}

.section-more{

    color:#777;

    font-size:12px;
}


/* =====================================================
   LISTA HORIZONTAL
===================================================== */

.anime-list{

    display:flex;

    gap:11px;

    overflow-x:auto;

    padding:0 15px 5px;

    scrollbar-width:none;

    scroll-behavior:smooth;
}

.anime-list::-webkit-scrollbar{
    display:none;
}


/* =====================================================
   CARD
===================================================== */

.anime-card{

    width:108px;

    flex:0 0 108px;

    cursor:pointer;

    position:relative;
}

.anime-poster{

    width:108px;

    height:155px;

    border-radius:9px;

    overflow:hidden;

    background:#151515;

    box-shadow:
        0 5px 15px
        rgba(0,0,0,.45);

    position:relative;
}

.anime-poster img{

    width:100%;

    height:100%;

    object-fit:cover;

    display:block;

    transition:
        transform .25s ease;
}

.anime-card:active
.anime-poster img{

    transform:scale(.96);
}

.anime-name{

    margin-top:8px;

    font-size:13px;

    color:#eee;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.anime-score{

    position:absolute;

    top:7px;

    left:7px;

    padding:4px 6px;

    border-radius:5px;

    background:
        rgba(0,0,0,.78);

    font-size:10px;

    color:#fff;
}


/* =====================================================
   SKELETON
===================================================== */

.skeleton{

    width:108px;

    height:155px;

    flex:0 0 108px;

    border-radius:9px;

    background:
        linear-gradient(
            90deg,
            #121212 25%,
            #1d1d1d 50%,
            #121212 75%
        );

    background-size:200% 100%;

    animation:
        skeleton 1.3s infinite;
}

@keyframes skeleton{

    from{
        background-position:200% 0;
    }

    to{
        background-position:-200% 0;
    }

}


/* =====================================================
   SECÇÃO DE DESTAQUE
===================================================== */

.feature-section{

    margin:5px 15px 30px;

}

.feature-card{

    height:205px;

    border-radius:15px;

    overflow:hidden;

    position:relative;

    background:#151515;

    cursor:pointer;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.5);
}

.feature-card img{

    width:100%;

    height:100%;

    object-fit:cover;

    display:block;
}

.feature-gradient{

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.92),
            rgba(0,0,0,.55),
            rgba(0,0,0,.05)
        );
}

.feature-info{

    position:absolute;

    left:18px;

    bottom:18px;

    right:20px;
}

.feature-tag{

    display:inline-block;

    background:#a855f7;

    padding:5px 8px;

    border-radius:5px;

    font-size:9px;

    font-weight:bold;

    margin-bottom:7px;
}

.feature-title{

    font-size:22px;

    font-weight:800;

    max-width:70%;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.feature-sub{

    color:#ccc;

    font-size:12px;

    margin-top:5px;
}


/* =====================================================
   VAZIO
===================================================== */

.section-empty{

    padding:10px 15px;

    color:#666;

    font-size:13px;
}


/* =====================================================
   NAVEGAÇÃO
===================================================== */

.bottom-nav{

    position:fixed;

    left:15px;

    right:15px;

    bottom:13px;

    height:72px;

    background:
        rgba(19,19,19,.96);

    border:1px solid #292929;

    border-radius:25px;

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    z-index:1000;

    box-shadow:
        0 8px 35px
        rgba(0,0,0,.65);

    backdrop-filter:blur(15px);
}

.nav-item{

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:5px;

    color:#707070;

    text-decoration:none;

    font-size:11px;
}

.nav-item svg{

    width:22px;
    height:22px;

    stroke:currentColor;

    fill:none;

    stroke-width:2;

    stroke-linecap:round;

    stroke-linejoin:round;
}

.nav-item.active{

    color:#fff;
}

.nav-item.active svg{

    stroke:#a855f7;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .header{
        height:70px;
    }

    .logo{
        font-size:22px;
    }

    .logo-icon{
        width:37px;
        height:37px;
    }

    .anime-card{
        width:100px;
        flex-basis:100px;
    }

    .anime-poster{
        width:100px;
        height:145px;
    }

    .skeleton{
        width:100px;
        flex-basis:100px;
        height:145px;
    }

    .feature-card{
        height:190px;
    }

}

</style>

</head>

<body>


<!-- =====================================================
     TOPO
===================================================== -->

<header class="header">

    <div class="logo">

        <div class="logo-icon"></div>

        Play<span>Nime</span>

    </div>


    <button
        class="header-search"
        onclick="abrirPesquisa()"
        aria-label="Pesquisar">

        <svg viewBox="0 0 24 24">

            <circle
                cx="11"
                cy="11"
                r="6">
            </circle>

            <path d="M16 16l5 5"></path>

        </svg>

    </button>

</header>


<!-- =====================================================
     HOME
===================================================== -->

<main id="home-content">

    <div class="home-loading">

        Carregando animes...

    </div>

</main>


<!-- =====================================================
     NAVEGAÇÃO
===================================================== -->

<nav class="bottom-nav">


    <a
        href="home.html"
        class="nav-item active">

        <svg viewBox="0 0 24 24">

            <path d="M3 11l9-8 9 8"></path>

            <path d="M5 10v10h14V10"></path>

        </svg>

        <span>Início</span>

    </a>


    <a
        href="pesquisar.html"
        class="nav-item">

        <svg viewBox="0 0 24 24">

            <circle
                cx="11"
                cy="11"
                r="6">
            </circle>

            <path d="M16 16l5 5"></path>

        </svg>

        <span>Pesquisar</span>

    </a>


    <a
        href="favoritos.html"
        class="nav-item">

        <svg viewBox="0 0 24 24">

            <path d="
                M20.8 8.6
                c0 5.5-8.8 11-8.8 11
                S3.2 14.1 3.2 8.6
                A4.6 4.6 0 0 1 12 6.4
                a4.6 4.6 0 0 1 8.8 2.2z">
            </path>

        </svg>

        <span>Favoritos</span>

    </a>


    <a
        href="mais.html"
        class="nav-item">

        <svg viewBox="0 0 24 24">

            <circle
                cx="5"
                cy="12"
                r="1">
            </circle>

            <circle
                cx="12"
                cy="12"
                r="1">
            </circle>

            <circle
                cx="19"
                cy="12"
                r="1">
            </circle>

        </svg>

        <span>Mais</span>

    </a>

</nav>


<script>

/* =====================================================
   PESQUISA
===================================================== */

function abrirPesquisa(){

    window.location.href =
        "pesquisar.html";

}


/* =====================================================
   ELEMENTO PRINCIPAL
===================================================== */

const home =
    document.getElementById(
        "home-content"
    );


/* =====================================================
   CRIAR SKELETONS
===================================================== */

function criarSkeletons(){

    return Array
        .from(
            {length:6},
            () =>
                `<div class="skeleton"></div>`
        )
        .join("");

}


/* =====================================================
   CRIAR CARD
===================================================== */

function criarCard(anime){

    if(
        !anime ||
        !anime.mal_id
    ){

        return "";

    }


    const imagem =
        playNimeImagem(anime);


    if(!imagem){

        return "";

    }


    const titulo =
        playNimeTitulo(anime);


    const nota =
        playNimeNota(anime);


    return `

        <article
            class="anime-card"
            onclick="playNimeAbrirAnime(${anime.mal_id})">

            <div class="anime-poster">

                <img
                    src="${imagem}"
                    alt="${playNimeEscaparHTML(titulo)}"
                    loading="lazy">

                ${
                    nota !== "N/A"
                    ?
                    `<div class="anime-score">
                        ★ ${nota}
                    </div>`
                    :
                    ""
                }

            </div>

            <div class="anime-name">

                ${playNimeEscaparHTML(titulo)}

            </div>

        </article>

    `;

}


/* =====================================================
   CRIAR SECÇÃO
===================================================== */

function criarSecao(
    titulo,
    lista
){

    const animes =
        Array.isArray(lista)
            ? lista
            : [];


    const cards =
        animes
            .map(criarCard)
            .filter(Boolean)
            .join("");


    if(!cards){

        return "";

    }


    return `

        <section class="anime-section">

            <div class="section-header">

                <div class="section-title">

                    ${titulo}

                </div>

                <div class="section-more">

                    Ver tudo

                </div>

            </div>

            <div class="anime-list">

                ${cards}

            </div>

        </section>

    `;

}


/* =====================================================
   CARREGAR UMA SECÇÃO
===================================================== */

async function carregarSecao(
    titulo,
    endpoint
){

    const id =
        "secao-" +
        Math.random()
            .toString(36)
            .substring(2);


    home.insertAdjacentHTML(
        "beforeend",

        `

        <section
            class="anime-section"
            id="${id}">

            <div class="section-header">

                <div class="section-title">

                    ${titulo}

                </div>

            </div>

            <div class="anime-list">

                ${criarSkeletons()}

            </div>

        </section>

        `
    );


    const elemento =
        document.getElementById(id);


    const dados =
        await playNimeAPI(
            endpoint
        );


    if(!dados.length){

        elemento.remove();

        return;

    }


    elemento.outerHTML =
        criarSecao(
            titulo,
            dados
        );

}


/* =====================================================
   DESTAQUE
===================================================== */

async function carregarDestaque(){

    const dados =
        await playNimeAPI(
            "/top/anime?filter=bypopularity&limit=5"
        );


    if(!dados.length){

        return;

    }


    const anime =
        dados[0];


    const imagem =
        playNimeImagem(anime);


    const titulo =
        playNimeTitulo(anime);


    if(!imagem){

        return;

    }


    home.insertAdjacentHTML(

        "afterbegin",

        `

        <section class="feature-section">

            <div
                class="feature-card"
                onclick="playNimeAbrirAnime(${anime.mal_id})">

                <img
                    src="${imagem}"
                    alt="${playNimeEscaparHTML(titulo)}">

                <div class="feature-gradient"></div>

                <div class="feature-info">

                    <div class="feature-tag">

                        EM DESTAQUE

                    </div>

                    <div class="feature-title">

                        ${playNimeEscaparHTML(titulo)}

                    </div>

                    <div class="feature-sub">

                        Descubra este anime no PlayNime

                    </div>

                </div>

            </div>

        </section>

        `

    );

}


/* =====================================================
   CONSTRUIR HOME
===================================================== */

async function construirHome(){

    home.innerHTML = "";


    /*
     * O destaque é carregado separadamente.
     */

    carregarDestaque();


    /*
     * Cada secção faz o seu próprio pedido.
     * Assim, se uma falhar, as outras continuam.
     */

    carregarSecao(
        "Em alta",
        "/top/anime?filter=bypopularity&limit=15"
    );


    carregarSecao(
        "Novos episódios",
        "/seasons/now?limit=15"
    );


    carregarSecao(
        "Mais bem avaliados",
        "/top/anime?filter=favorite&limit=15"
    );


    carregarSecao(
        "Ação",
        "/anime?genres=1&order_by=score&sort=desc&limit=15"
    );


    carregarSecao(
        "Aventura",
        "/anime?genres=2&order_by=score&sort=desc&limit=15"
    );


    carregarSecao(
        "Comédia",
        "/anime?genres=4&order_by=score&sort=desc&limit=15"
    );


    carregarSecao(
        "Fantasia",
        "/anime?genres=10&order_by=score&sort=desc&limit=15"
    );


    carregarSecao(
        "Romance",
        "/anime?genres=22&order_by=score&sort=desc&limit=15"
    );


    carregarSecao(
        "Slice of Life",
        "/anime?genres=36&order_by=score&sort=desc&limit=15"
    );


    carregarSecao(
        "Shounen",
        "/anime?genres=27&order_by=score&sort=desc&limit=15"
    );


    carregarSecao(
        "Mistério",
        "/anime?genres=7&order_by=score&sort=desc&limit=15"
    );


    carregarSecao(
        "Terror",
        "/anime?genres=14&order_by=score&sort=desc&limit=15"
    );

}


/* =====================================================
   INICIAR
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        if(
            typeof playNimeAPI !==
            "function"
        ){

            home.innerHTML = `

                <div class="home-loading">

                    Não foi possível iniciar
                    o PlayNime.

                </div>

            `;

            return;

        }


        construirHome();

    }
);

</script>


<!-- =====================================================
     SCRIPT PRINCIPAL
===================================================== -->

<script src="script.js"></script>

</body>

          </html>
