<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#070707">
<title>PlayNime</title>
<style>
:root{--bg:#070707;--border:#292929;--p:#a855f7}
*{margin:0;padding:0;box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
html,body{width:100%;min-height:100%;background:var(--bg);color:#fff}
body{overflow-x:hidden;padding-bottom:88px}
button,a{font:inherit}
button{border:0;color:inherit;cursor:pointer;background:none}
img{max-width:none}
.header{position:fixed;top:0;left:0;right:0;z-index:100;height:72px;
padding:0 18px;display:flex;align-items:center;justify-content:space-between;background:#080808}
.logo{display:flex;align-items:center;font-size:25px;font-weight:900;letter-spacing:-1.2px}
.logo span{color:var(--p)}
.logo-icon{width:36px;height:36px;margin-right:10px;border-radius:11px;
background:linear-gradient(135deg,#7627c9,#bd75ff);display:flex;align-items:center;justify-content:center}
.logo-icon:after{content:"";width:0;height:0;margin-left:3px;
border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:12px solid #fff}
.header-actions{display:flex;gap:8px}
.header-button{width:36px;height:36px;border:1px solid #292929;border-radius:50%;
background:#111;display:flex;align-items:center;justify-content:center}
.header-button svg{width:18px;height:18px;fill:none;stroke:#737373;stroke-width:2;
stroke-linecap:round;stroke-linejoin:round}
.home-loading{min-height:55vh;padding-top:130px;display:flex;align-items:center;justify-content:center}
.loader{width:30px;height:30px;border:3px solid #292929;border-top-color:var(--p);
border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.home-error{margin:120px 16px 30px;padding:24px 18px;border:1px solid var(--border);
border-radius:16px;background:#111;color:#aaa;text-align:center}
.retry-button{margin-top:15px;padding:11px 20px;border-radius:10px;background:var(--p);color:#fff;font-weight:800}
.hero{position:relative;width:100%;margin-top:72px;margin-bottom:8px;overflow:hidden;background:#070707}
.hero-track{display:flex;width:100%;transition:transform .45s ease}
.hero-slide{position:relative;flex:0 0 100%;width:100%;height:68vh;
min-height:420px;max-height:640px;overflow:hidden;background:#0a0a0a}
.hero-bg{position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);
object-fit:cover;filter:blur(28px) brightness(.45) saturate(1.15);transform:scale(1.05);pointer-events:none}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
object-position:center center;display:block}
.hero-shade{position:absolute;inset:0;pointer-events:none;
background:linear-gradient(to top,#070707 0%,#070707cc 18%,transparent 55%)}
.hero-info{position:absolute;z-index:2;left:16px;right:16px;bottom:22px;
display:flex;flex-direction:column;align-items:flex-start}
.hero-brand{max-width:72%;max-height:58px;width:auto;height:auto;object-fit:contain;
object-position:left bottom;margin-bottom:8px;filter:drop-shadow(0 4px 14px #000)}
.hero-title{margin:0 0 8px;max-width:92%;color:#fff;font-size:clamp(22px,6vw,34px);line-height:1.08;
font-weight:900;letter-spacing:-.4px;text-shadow:0 2px 16px #000;display:-webkit-box;
-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero-meta{margin:0;max-width:94%;color:#ddd;font-size:12px;font-weight:700;
text-shadow:0 1px 8px #000;line-height:1.35}
.age{display:inline-block;min-width:28px;padding:2px 6px;margin-right:6px;
border-radius:4px;background:#3a3a3a;color:#fff;font-size:11px;font-weight:900}
.hero-syn{margin:10px 0 12px;max-width:94%;color:#ddd;font-size:13px;line-height:1.4;font-weight:500;
text-shadow:0 1px 8px #000;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero-play{min-height:42px;padding:0 16px;display:inline-flex;align-items:center;gap:8px;
border-radius:8px;background:#fff;color:#111;font-size:14px;font-weight:900}
.hero-play svg{width:15px;height:15px;fill:#111}
.hero-dots{position:absolute;z-index:5;left:0;right:0;bottom:7px;display:flex;justify-content:center;gap:6px;pointer-events:none}
.hero-dots i{pointer-events:auto;width:18px;height:4px;border-radius:8px;background:#5a5a5a}
.hero-dots i.on{background:#fff}
.feat{padding:6px 16px 22px}
.feat-split{display:flex;align-items:stretch;gap:0;width:100%;margin-bottom:10px;overflow:hidden;border-radius:10px;background:#121212}
.feat-left{flex:0 0 38%;width:38%;aspect-ratio:2/3;background:#151515}
.feat-left img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.feat-right{flex:1;min-width:0;background:#101010;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.feat-right img.feat-logo{max-width:78%;max-height:58%;width:auto;height:auto;object-fit:contain;filter:drop-shadow(0 4px 12px #000)}
.feat-name{font-size:18px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feat-bar{height:3px;background:#a855f7;width:42%;border-radius:3px;margin:8px 0 7px}
.feat-meta{color:#c4b5fd;font-size:12px;font-weight:700;margin-bottom:7px}
.feat-syn{color:#ccc;font-size:13px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:12px}
.feat-row{display:flex;align-items:center;gap:10px}
.feat-play{flex:1;min-height:44px;border-radius:24px;background:#fff;color:#111;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.feat-play svg{width:16px;height:16px;fill:#111}
.ep-card{flex:0 0 78vw;width:78vw;max-width:320px;cursor:pointer}
.ep-art{width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#111;margin-bottom:8px;display:flex;align-items:stretch;gap:0}
.ep-cover{width:42%;height:100%;object-fit:cover;object-position:center top;display:block;flex:0 0 42%}
.ep-color{flex:1;height:100%;min-width:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ep-color-logo{max-width:78%;max-height:58%;width:auto;height:auto;object-fit:contain;filter:drop-shadow(0 3px 9px #000)}
.ep-name{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep-sub{color:#aaa;font-size:12px;margin-top:3px}
.anime-section{margin-bottom:22px}
.section-header{padding:0 16px 12px;display:flex;align-items:center}
.section-title{font-size:16px;font-weight:750}
.anime-list{display:flex;gap:8px;overflow-x:auto;padding:0 14px 4px;scrollbar-width:none}
.anime-list::-webkit-scrollbar{display:none}
.anime-card{flex:0 0 calc((100vw - 44px)/3);width:calc((100vw - 44px)/3);min-width:calc((100vw - 44px)/3);max-width:150px;cursor:pointer}
.anime-poster{position:relative;width:100%;aspect-ratio:2/3;overflow:hidden;border-radius:10px;background:#171717}
.anime-poster img.poster{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.card-logo{position:absolute;left:8%;right:8%;bottom:8px;max-height:20%;max-width:84%;width:auto;height:auto;margin:0 auto;object-fit:contain;object-position:center bottom;pointer-events:none;filter:drop-shadow(0 2px 6px #000)}
.bottom-nav{position:fixed;z-index:1000;left:13px;right:13px;bottom:12px;height:62px;display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #2c2c2c;border-radius:22px;background:rgba(18,18,18,.97);backdrop-filter:blur(12px)}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#737373;text-decoration:none;font-size:10px}
.nav-item svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-item.active{color:#fff}
.nav-item.active svg{stroke:var(--p)}
@media(min-width:700px){
body{padding-bottom:30px}
.hero-slide{height:72vh;max-height:680px}
.hero-info{left:7%;right:auto;max-width:560px}
.anime-card{flex:0 0 168px;width:168px;min-width:168px;max-width:168px}
.bottom-nav{left:50%;right:auto;width:390px;transform:translateX(-50%)}
}
</style>
</head>

<script>
  var A="https://graphql.anilist.co";

var home=document.getElementById("home-content");
var heroIndex=0,heroTimer=null,logoCache={},loadToken=0;

var BLOQ=["crayon","shin-chan","pokemon","pocket monsters","transformers","doraemon","precure","anpanman","yokai watch","yo-kai","beyblade","hamtaro"];

function abrirAnime(id){if(id!==undefined&&id!==null&&String(id)!=="")location.href="detalhes.html?mal="+encodeURIComponent(String(id))}

function corAnime(title){var cores=["#172554","#3b0764","#431407","#064e3b","#3f1d0b","#312e81","#164e63","#3f3f46","#581c87","#713f12","#1e3a8a","#14532d","#4c0519","#422006","#1f2937"];var s=String(title||"Anime"),h=0,i;for(i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0}return cores[Math.abs(h)%cores.length]}
function genPT(x){var n=limpar(x);var map={action:"Ação",adventure:"Aventura",comedy:"Comédia",romance:"Romance",fantasy:"Fantasia",drama:"Drama","slice of life":"Cotidiano",supernatural:"Sobrenatural",mystery:"Mistério",horror:"Terror",sports:"Desporto",music:"Música",psychological:"Psicológico",thriller:"Suspense",mecha:"Mecha",isekai:"Isekai","sci-fi":"Ficção científica","science fiction":"Ficção científica",school:"Escolar","martial arts":"Artes marciais",military:"Militar",gourmet:"Gourmet","mahou shoujo":"Mahou Shoujo",kids:"Infantil",suspense:"Suspense",ecchi:"",hentai:"",erotica:""};if(map[n]==="")return "";return map[n]||x}
function cleanGenres(g){return (g||[]).map(genPT).filter(function(x){return x&&BADG.indexOf(limpar(x))<0}).slice(0,4)}
function jaPT(s){return /[áàâãéêíóôõúçÁÀÂÃÉÊÍÓÔÕÚÇ]/.test(s)||/\b(o|a|os|as|de|do|da|um|uma|que|para|com|não|nao|é|e)\b/i.test(s)&&!/\b(the|and|of|in|to|is|was|his|her|their)\b/i.test(s)}
async function traduzir(txt){if(!txt)return "";var raw=String(txt).replace(/\s+/g," ").trim().slice(0,380);var key="tr:"+limpar(raw).slice(0,90);if(logoCache[key]&&logoCache[key]!=="0")return logoCache[key];if(jaPT(raw)){logoCache[key]=raw;return raw}var t="";try{var r=await tempo(fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(raw)+"&langpair=en|pt"),7000);if(r&&r.ok){var d=await r.json();t=(d&&d.responseData&&d.responseData.translatedText)||"";if(/MYMEMORY|QUERY LENGTH|INVALID/i.test(t))t=""}}catch(e){}if(!t)try{var r2=await tempo(fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=pt&dt=t&q="+encodeURIComponent(raw)),7000);if(r2&&r2.ok){var g=await r2.json();t=(g&&g[0]||[]).map(function(x){return x&&x[0]||""}).join("")}}catch(e){}if(!t)t=raw;logoCache[key]=t;saveLogos();return t}
async function prefetchTraducoes(listas){var i,arr,j,it;for(i=0;i<listas.length;i++){arr=listas[i]||[];for(j=0;j<arr.length;j++){it=arr[j];if(!it||!it.synopsis||it.synPT)continue;it.synPT=await traduzir(it.synopsis)}}}
async function preencherTraducoes(){var nos=document.querySelectorAll(".hero-syn,.feat-syn"),i,el,src,pt;for(i=0;i<nos.length;i++){el=nos[i];src=el.getAttribute("data-en")||el.textContent||"";if(!src)continue;pt=await traduzir(src);if(pt)el.textContent=pt}}
function idadeDe(it){var g=limpar((it&&it.genres||[]).join(" "));if(g.indexOf("horror")>=0)return "16+";if(g.indexOf("action")>=0)return "14+";return "12+"}
function deAL(m){if(!m)return null;if(m.poster&&m.title&&typeof m.title==="string")return m;var en=(m.title&&m.title.english)||"";var ro=(m.title&&m.title.romaji)||"";var na=(m.title&&m.title.native)||"";return{id:m.idMal||m.id||"",title:en||ro||na||"Anime",titleEn:en,titleRo:ro,poster:(m.coverImage&&(m.coverImage.extraLarge||m.coverImage.large||m.coverImage.medium))||"",banner:m.bannerImage||"",year:m.seasonYear||"",genres:Array.isArray(m.genres)?m.genres:[],episodes:m.episodes||0,format:m.format||"",origin:m.countryOfOrigin||"JP",adult:!!m.isAdult,synopsis:String(m.description||"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim()}}
function deJK(a){if(!a)return null;var en=(a.title_english&&String(a.title_english).trim())||"";return{id:a.mal_id||a.id||"",title:en||a.title||"Anime",titleEn:en,titleRo:a.title||"",poster:(a.images&&a.images.jpg&&(a.images.jpg.large_image_url||a.images.jpg.image_url))||"",banner:"",year:a.year||"",genres:(a.genres||[]).map(function(g){return (g&&g.name)||g||""}).filter(Boolean),episodes:a.episodes||0,format:a.type||"",origin:"JP",adult:String(a.rating||"").toLowerCase().indexOf("rx")>=0,synopsis:a.synopsis||""}}
function bloqueado(it){if(!it||it.adult||!it.poster)return true;var t=limpar(it.title),i;for(i=0;i<BLOQ.length;i++)if(t.indexOf(BLOQ[i])>=0)return true;var g=limpar((it.genres||[]).join(" "));for(i=0;i<BADG.length;i++)if(g.indexOf(BADG[i])>=0)return true;var o=String(it.origin||"JP");return o!=="JP"&&o!=="KR"}
function tempo(p,ms){return Promise.race([p,new Promise(function(_,j){setTimeout(function(){j(new Error("timeout"))},ms)})])}
function campos(){return "id idMal isAdult countryOfOrigin bannerImage seasonYear episodes format genres description(asHtml:false) coverImage{extraLarge large medium} title{romaji english native}"}
function mediaDe(b){var arr=Array.isArray(b)?b:((b&&b.media)||[]);return arr.map(function(x){if(!x)return null;if(x.coverImage||(x.title&&typeof x.title==="object"))return deAL(x);if(x.mal_id&&x.images)return deJK(x);return deAL(x)}).filter(function(x){return x&&!bloqueado(x)})}
function saveLogos(){try{localStorage.setItem("playnime_logos",JSON.stringify(logoCache))}catch(e){}}
function titulosDe(it){var out=[],v={};function add(s){s=String(s||"").trim();if(!s)return;var k=limpar(s);if(v[k])return;v[k]=1;out.push(s);var c=s.replace(/\s*[:\-–]\s*(season|temporada|part|cour).*\( /i,"").replace(/\s+\d+(st|nd|rd|th)?\s*season.* \)/i,"").replace(/\s+season\s*\d+.*\( /i,"").replace(/\s+\(.*\) \)/,"").trim();if(c&&c!==s){k=limpar(c);if(!v[k]){v[k]=1;out.push(c)}}var w=c.split(/[:\-–]/)[0].trim();if(w&&w.length>3){k=limpar(w);if(!v[k]){v[k]=1;out.push(w)}}}if(!it)return out;if(typeof it==="string"){add(it);return out}add(it.title);add(it.titleEn);add(it.titleRo);return out}
function pickLogo(logos){if(!Array.isArray(logos)||!logos.length)return "";var i,x,en=[],ok=[],ja=[];for(i=0;i<logos.length;i++){x=logos[i];if(!x||!x.file_path)continue;if(x.iso_639_1==="en")en.push(x);else if(!x.iso_639_1)ok.push(x);else ja.push(x)}x=en[0]||ok[0]||ja[0];return x?TI+"w500"+x.file_path:""}
async function tmdbSearch(kind,title){var r=await tempo(fetch(TM+"/search/"+kind+"?api_key="+TK+"&query="+encodeURIComponent(title)+"&language=en-US"),5000);if(!r||!r.ok)return null;var s=await r.json();var rows=(s&&Array.isArray(s.results))?s.results:[];return rows.filter(function(x){return x&&Array.isArray(x.genre_ids)&&x.genre_ids.indexOf(16)>=0})[0]||rows[0]||null}

async function fetchLogo(it){var names=titulosDe(it);if(!names.length)return "";var key=limpar(names[0]),i,u;for(i=0;i<names.length;i++){u=logoCache[limpar(names[i])];if(u&&u!=="0")return u}if(logoCache[key]==="0")return "";var url="",z,d;try{for(i=0;i<names.length&&!url;i++){z=await tmdbSearch("tv",names[i]);if(z){d=await tmdbImgs("tv",z.id);url=pickLogo(d&&d.logos)}}for(i=0;i<names.length&&!url;i++){z=await tmdbSearch("movie",names[i]);if(z){d=await tmdbImgs("movie",z.id);url=pickLogo(d&&d.logos)}}}catch(e){}if(url){logoCache[key]=url;for(i=0;i<names.length;i++)logoCache[limpar(names[i])]=url;saveLogos()}return url}
function logoDe(it){var names=titulosDe(it),i,u;for(i=0;i<names.length;i++){u=logoCache[limpar(names[i])];if(u&&u!=="0")return u}return ""}
async function prefetchLogos(listas){var items=[],visto={},i,arr,j,it,k;for(i=0;i<listas.length;i++){arr=listas[i]||[];for(j=0;j<arr.length;j++){it=arr[j];if(!it||!it.title)continue;k=String(it.id||limpar(it.title));if(visto[k])continue;visto[k]=1;items.push(it)}}var n=6,idx=0;async function worker(){while(idx<items.length){var x=items[idx++];await fetchLogo(x)}}var w=[];for(i=0;i<n;i++)w.push(worker());await Promise.all(w)}
