<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>PlayNime</title>

<style>

/* =====================================================
   BASE
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

html{
    background:#070707;
}

body{
    background:#070707;
    color:#fff;
    min-height:100vh;
    padding-bottom:110px;
}

button{
    font-family:inherit;
    border:0;
}

img{
    user-select:none;
}


/* =====================================================
   TOPO
===================================================== */

.header{

    height:76px;

    padding:0 18px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    position:sticky;

    top:0;

    z-index:50;

    background:
        linear-gradient(
            to bottom,
            rgba(7,7,7,.98),
            rgba(7,7,7,.88),
            transparent
        );
}

.logo{

    display:flex;

    align-items:center;

    gap:9px;

    font-size:24px;

    font-weight:800;

    letter-spacing:-1px;
}

.logo-icon{

    width:39px;
    height:39px;

    border-radius:11px;

    background:
        linear-gradient(
            135deg,
            #8b35ff,
            #b66cff
        );

    display:flex;

    align-items:center;

    justify-content:center;

    box-shadow:
        0 5px 20px
        rgba(139,53,255,.35);
}

.logo-icon::after{

    content:"";

    width:0;
    height:0;

    border-top:8px solid transparent;
    border-bottom:8px solid transparent;
    border-left:13px solid white;

    margin-left:3px;
}

.logo span{
    color:#a855f7;
}


.header-search{

    width:42px;
    height:42px;

    border:1px solid #292929;

    background:#151515;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    color:white;

    cursor:pointer;
}

.header-search svg{

    width:22px;
    height:22px;

    stroke:white;

    fill:none;

    stroke-width:2;

    stroke-linecap:round;

    stroke-linejoin:round;
}


/* =====================================================
   CONTEÚDO
===================================================== */

#home-content{

    width:100%;

    overflow:hidden;
}

.home-loading{

    padding:60px 20px;

    text-align:center;

    color:#777;

    font-size:14px;
}


/* =====================================================
   SECÇÕES
===================================================== */

.anime-section{

    margin-bottom:27px;
}

.section-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 15px;

    margin-bottom:13px;
}

.section-title{

    font-size:20px;

    font-weight:750;

    letter-spacing:-.3px;
}

.section-more{

    color:#777;

    font-size:12px;
}


/* =====================================================
   LISTA HORIZONTAL
===================================================== */

.anime-list{

    display:flex;

    gap:11px;

    overflow-x:auto;

    padding:0 15px 5px;

    scrollbar-width:none;

    scroll-behavior:smooth;
}

.anime-list::-webkit-scrollbar{
    display:none;
}


/* =====================================================
   CARD
===================================================== */

.anime-card{

    width:108px;

    flex:0 0 108px;

    cursor:pointer;

    position:relative;
}

.anime-poster{

    width:108px;

    height:155px;

    border-radius:9px;

    overflow:hidden;

    background:#151515;

    box-shadow:
        0 5px 15px
        rgba(0,0,0,.45);

    position:relative;
}

.anime-poster img{

    width:100%;

    height:100%;

    object-fit:cover;

    display:block;

    transition:
        transform .25s ease;
}

.anime-card:active
.anime-poster img{

    transform:scale(.96);
}

.anime-name{

    margin-top:8px;

    font-size:13px;

    color:#eee;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.anime-score{

    position:absolute;

    top:7px;

    left:7px;

    padding:4px 6px;

    border-radius:5px;

    background:
        rgba(0,0,0,.78);

    font-size:10px;

    color:#fff;
}


/* =====================================================
   SKELETON
===================================================== */

.skeleton{

    width:108px;

    height:155px;

    flex:0 0 108px;

    border-radius:9px;

    background:
        linear-gradient(
            90deg,
            #121212 25%,
            #1d1d1d 50%,
            #121212 75%
        );

    background-size:200% 100%;

    animation:
        skeleton 1.3s infinite;
}

@keyframes skeleton{

    from{
        background-position:200% 0;
    }

    to{
        background-position:-200% 0;
    }

}


/* =====================================================
   DESTAQUE
===================================================== */

.feature-section{

    margin:5px 15px 30px;

}

.feature-card{

    height:205px;

    border-radius:15px;

    overflow:hidden;

    position:relative;

    background:#151515;

    cursor:pointer;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.5);
}

.feature-card img{

    width:100%;

    height:100%;

    object-fit:cover;

    display:block;
}

.feature-gradient{

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.92),
            rgba(0,0,0,.55),
            rgba(0,0,0,.05)
        );
}

.feature-info{

    position:absolute;

    left:18px;

    bottom:18px;

    right:20px;
}

.feature-tag{

    display:inline-block;

    background:#a855f7;

    padding:5px 8px;

    border-radius:5px;

    font-size:9px;

    font-weight:bold;

    margin-bottom:7px;
}

.feature-title{

    font-size:22px;

    font-weight:800;

    max-width:70%;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.feature-sub{

    color:#ccc;

    font-size:12px;

    margin-top:5px;
}


/* =====================================================
   VAZIO / ERRO
===================================================== */

.section-empty{

    padding:10px 15px;

    color:#666;

    font-size:13px;
}

.api-error{

    padding:40px 20px;

    text-align:center;

    color:#888;

    line-height:1.6;
}


/* =====================================================
   NAVEGAÇÃO
===================================================== */

.bottom-nav{

    position:fixed;

    left:15px;

    right:15px;

    bottom:13px;

    height:72px;

    background:
        rgba(19,19,19,.96);

    border:1px solid #292929;

    border-radius:25px;

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    z-index:1000;

    box-shadow:
        0 8px 35px
        rgba(0,0,0,.65);

    backdrop-filter:blur(15px);
}

.nav-item{

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:5px;

    color:#707070;

    text-decoration:none;

    font-size:11px;
}

.nav-item svg{

    width:22px;
    height:22px;

    stroke:currentColor;

    fill:none;

    stroke-width:2;

    stroke-linecap:round;

    stroke-linejoin:round;
}

.nav-item.active{
    color:#fff;
}

.nav-item.active svg{
    stroke:#a855f7;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .header{
        height:70px;
    }

    .logo{
        font-size:22px;
    }

    .logo-icon{
        width:37px;
        height:37px;
    }

    .anime-card{
        width:100px;
        flex-basis:100px;
    }

    .anime-poster{
        width:100px;
        height:145px;
    }

    .skeleton{
        width:100px;
        flex-basis:100px;
        height:145px;
    }

    .feature-card{
        height:190px;
    }

}

</style>

</head>

<body>


<header class="header">

    <div class="logo">

        <div class="logo-icon"></div>

        Play<span>Nime</span>

    </div>

    <button
        class="header-search"

</header>


<main id="home-content">

    <div class="home-loading">

    </div>

</main>

  <nav class="bottom-nav">

    <a
        href="home.html"
        class="nav-item active">

        </svg>

    </a>


    <a
        href="pesquisar.html"
        class="nav-item">

        <svg viewBox="0 0 24 24">

            <circle
                cx="11"

            </circle>

            <path d="M16 16l5 5"></path>

        </svg>

        <span>Pesquisar</span>

        href="favoritos.html"

                c0 5.5-8.8 11-8.8 11

</nav>


<script>

/* =====================================================
   CONFIGURAÇÃO TMDB
===================================================== */

/*
 * COLE AQUI O SEU API READ ACCESS TOKEN DO TMDB.
 *
 * Não coloque o token entre espaços.
 */

const TMDB_TOKEN =
    "eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiI4ZTg5Mzk0MmUwMWMyM2IzMTJkZjI2NWQ1NThlMjdmYyIsIm5iZiI6MTc4MTI0MDM4Ni41NzIsInN1YiI6IjZhMmI5MjQyOGQ2YWJiNWQyNWUzYjk5OCIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.dbWkox1kPJDn85ah8IcU-ut5CotlJjPSFsYPEoJi080";


const TMDB_API =
    "https://api.themoviedb.org/3";

const TMDB_IMAGE =
    "https://image.tmdb.org/t/p/";


/*
 * Idioma dos textos devolvidos pelo TMDB.
 */

const TMDB_LANGUAGE =
    "pt-BR";


/*
 * Para anime usamos:
 *
 * gênero 16 = Animation
 * idioma original = japonês
 *
 * O TMDB trata anime como conteúdo de TV/animação,
 * portanto usamos /discover/tv.
 */

const ANIME_BASE =
    "with_genres=16&with_original_language=ja";


/* =====================================================
   ELEMENTO PRINCIPAL
===================================================== */

const home =
    document.getElementById(
        "home-content"
    );


/* =====================================================
   CACHE
===================================================== */

const cacheTMDB =
    new Map();


/* =====================================================
   PESQUISA
===================================================== */

function abrirPesquisa(){

    window.location.href =
        "pesquisar.html";

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escaparHTML(texto){

    if(texto === null ||
       texto === undefined){

        return "";

    }

    return String(texto)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   URL DE IMAGEM
===================================================== */

function imagemTMDB(
    caminho,
    tamanho="w500"
){

    if(!caminho){

        return "";

    }

    return (
        TMDB_IMAGE +
        tamanho +
        caminho
    );

}


/* =====================================================
   PEDIDO TMDB
===================================================== */

async function tmdbFetch(
    endpoint
){

    if(
        cacheTMDB.has(endpoint)
    ){

        return cacheTMDB.get(
            endpoint
        );

    }


    const resposta =
        await fetch(
            TMDB_API +
            endpoint,
            {
                method:"GET",

                headers:{
                    "Authorization":
                        "Bearer " +
                        TMDB_TOKEN,

                    "accept":
                        "application/json"
                }
            }
        );


    if(!resposta.ok){

        throw new Error(
            "TMDB HTTP " +
            resposta.status
        );

    }


    const dados =
        await resposta.json();


    cacheTMDB.set(
        endpoint,
        dados
    );


    return dados;

}


/* =====================================================
   PAUSA ENTRE PEDIDOS
===================================================== */

function esperar(
    ms
){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* =====================================================
   DISCOVER ANIME
===================================================== */

async function descobrirAnime(
    parametros=""
){

    const separador =
        parametros
            ? "&"
            : "";


    const endpoint =
        "/discover/tv?" +
        ANIME_BASE +
        separador +
        "language=" +
        encodeURIComponent(
            TMDB_LANGUAGE
        ) +
        "&include_adult=false" +
        "&sort_by=popularity.desc" +
        "&vote_count.gte=10" +
        "&page=1" +
        parametros;


    const dados =
        await tmdbFetch(
            endpoint
        );


    return Array.isArray(
        dados.results
    )
        ? dados.results
        : [];

}


/* =====================================================
   NORMALIZAR ANIME
===================================================== */

function normalizarAnime(
    anime
){

    if(!anime){

        return null;

    }


    return {

        id:
            anime.id,

        title:
            anime.name ||
            anime.original_name ||
            "Sem título",

        poster:
            anime.poster_path,

        backdrop:
            anime.backdrop_path,

        score:
            Number(
                anime.vote_average || 0
            ).toFixed(1),

        year:
            anime.first_air_date
                ?
                anime.first_air_date
                    .substring(0,4)
                :
                "",

        overview:
            anime.overview || ""

    };

}


/* =====================================================
   CRIAR SKELETONS
===================================================== */

function criarSkeletons(){

    return Array
        .from(
            {length:6},
            () =>
                `<div class="skeleton"></div>`
        )
        .join("");

}


/* =====================================================
   CRIAR CARD
===================================================== */

function criarCard(
    anime
){

    const item =
        normalizarAnime(
            anime
        );


    if(
        !item ||
        !item.id ||
        !item.poster
    ){

        return "";

    }


    return `

        <article
            class="anime-card"
            onclick="abrirAnimeTMDB(${item.id})">

            <div class="anime-poster">

                <img
                    src="${imagemTMDB(
                        item.poster,
                        "w342"
                    )}"
                    alt="${escaparHTML(
                        item.title
                    )}"
                    loading="lazy">

                ${
                    item.score !== "0.0"
                    ?
                    `<div class="anime-score">
                        ★ ${item.score}
                    </div>`
                    :
                    ""
                }

            </div>

            <div class="anime-name">

                ${escaparHTML(
                    item.title
                )}

            </div>

        </article>

    `;

}


/* =====================================================
   CRIAR SECÇÃO
===================================================== */

function criarSecao(
    titulo,
    lista
){

    const animes =
        Array.isArray(lista)
            ? lista
            : [];


    const cards =
        animes
            .map(criarCard)
            .filter(Boolean)
            .join("");


    if(!cards){

        return "";

    }


    return `

        <section
            class="anime-section">

            <div
                class="section-header">

                <div
                    class="section-title">

                    ${escaparHTML(
                        titulo
                    )}

                </div>

                <div
                    class="section-more">

                    Ver tudo

                </div>

            </div>


            <div
                class="anime-list">

                ${cards}

            </div>

        </section>

    `;

}

<script>

/* =====================================================
   CARREGAR SECÇÃO
===================================================== */

async function carregarSecao(
    titulo,
    parametros
){

    const id =
        "secao-" +
        Math.random()
            .toString(36)
            .substring(2);


    home.insertAdjacentHTML(

        "beforeend",

        `

        <section
            class="anime-section"
            id="${id}">

            <div
                class="section-header">

                <div
                    class="section-title">

                    ${escaparHTML(
                        titulo
                    )}

                </div>

            </div>


            <div
                class="anime-list">

                ${criarSkeletons()}

            </div>

        </section>

        `

    );


    const elemento =
        document.getElementById(
            id
        );


    try{

        const dados =
            await descobrirAnime(
                parametros
            );


        if(!dados.length){

            elemento.innerHTML = `

                <div
                    class="section-empty">

                    Nenhum anime encontrado.

                </div>

            `;

            return;

        }


        elemento.outerHTML =
            criarSecao(
                titulo,
                dados
            );

    }

    catch(erro){

        console.error(
            "Erro na secção:",
            titulo,
            erro
        );


        elemento.innerHTML = `

            <div
                class="section-empty">

                Não foi possível carregar
                esta secção.

            </div>

        `;

    }

}


/* =====================================================
   DESTAQUE
===================================================== */

async function carregarDestaque(){

    try{

        const dados =
            await descobrirAnime(
                "&vote_count.gte=100"
            );


        if(!dados.length){

            return;

        }


        const anime =
            normalizarAnime(
                dados[0]
            );


        if(
            !anime ||
            !anime.backdrop
        ){

            return;

        }


        home.insertAdjacentHTML(

            "afterbegin",

            `

            <section
                class="feature-section">

                <div
                    class="feature-card"
                    onclick="abrirAnimeTMDB(
                        ${anime.id}
                    )">

                    <img
                        src="${imagemTMDB(
                            anime.backdrop,
                            "w780"
                        )}"
                        alt="${escaparHTML(
                            anime.title
                        )}">

                    <div
                        class="feature-gradient">
                    </div>


                    <div
                        class="feature-info">

                        <div
                            class="feature-tag">

                            EM DESTAQUE

                        </div>


                        <div
                            class="feature-title">

                            ${escaparHTML(
                                anime.title
                            )}

                        </div>


                        <div
                            class="feature-sub">

                            ${anime.year
                                ? anime.year
                                : ""
                            }

                            ${
                                anime.score !==
                                "0.0"
                                ?
                                " • ★ " +
                                anime.score
                                :
                                ""
                            }

                        </div>

                    </div>

                </div>

            </section>

            `

        );

    }

    catch(erro){

        console.error(
            "Erro no destaque:",
            erro
        );

    }

}


/* =====================================================
   ABRIR DETALHES
===================================================== */

function abrirAnimeTMDB(
    id
){

    if(!id){

        return;

    }


    window.location.href =
        "detalhes.html?id=" +
        encodeURIComponent(id);

}


/* =====================================================
   CONSTRUIR HOME
===================================================== */

async function construirHome(){

    home.innerHTML = "";


    /*
     * Primeiro o destaque.
     */

    await carregarDestaque();


    /*
     * EM ALTA
     */

    await carregarSecao(

        "Em alta",

        "&sort_by=popularity.desc" +
        "&vote_count.gte=30" +
        "&page=1"

    );


    await esperar(250);


    /*
     * NOVOS
     */

    await carregarSecao(

        "Novos episódios",

        "&sort_by=first_air_date.desc" +
        "&first_air_date.gte=2025-01-01" +
        "&vote_count.gte=5" +
        "&page=1"

    );


    await esperar(250);


    /*
     * MAIS BEM AVALIADOS
     */

    await carregarSecao(

        "Mais bem avaliados",

        "&sort_by=vote_average.desc" +
        "&vote_count.gte=100" +
        "&page=1"

    );


    await esperar(250);


    /*
     * AÇÃO E AVENTURA
     *
     * TMDB TV genre:
     * 10759
     */

    await carregarSecao(

        "Ação e Aventura",

        "&with_genres=16,10759" +
        "&sort_by=vote_average.desc" +
        "&vote_count.gte=20"

    );


    await esperar(250);


    /*
     * COMÉDIA
     */

    await carregarSecao(

        "Comédia",

        "&with_genres=16,35" +
        "&sort_by=vote_average.desc" +
        "&vote_count.gte=20"

    );


    await esperar(250);


    /*
     * FANTASIA
     */

    await carregarSecao(

        "Fantasia",

        "&with_genres=16,10765" +
        "&sort_by=vote_average.desc" +
        "&vote_count.gte=20"

    );


    await esperar(250);


    /*
     * DRAMA
     */

    await carregarSecao(

        "Drama",

        "&with_genres=16,18" +
        "&sort_by=vote_average.desc" +
        "&vote_count.gte=20"

    );


    await esperar(250);


    /*
     * ROMANCE
     */

    await carregarSecao(

        "Romance",

        "&with_genres=16,10749" +
        "&sort_by=vote_average.desc" +
        "&vote_count.gte=20"

    );


    await esperar(250);


    /*
     * MISTÉRIO
     */

    await carregarSecao(

        "Mistério",

        "&with_genres=16,9648" +

    );
