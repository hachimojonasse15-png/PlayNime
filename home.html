<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>PlayNime</title>

<style>

/* =====================================================
   BASE
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

html{
    background:#070707;
}

body{
    background:#070707;
    color:#fff;
    min-height:100vh;
    padding-bottom:110px;
}

button{
    font-family:inherit;
    border:none;
}


/* =====================================================
   TOPO
===================================================== */

.header{

    height:76px;

    padding:0 18px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    position:sticky;

    top:0;

    z-index:50;

    background:
        linear-gradient(
            to bottom,
            rgba(7,7,7,.98),
            rgba(7,7,7,.92),
            rgba(7,7,7,.60)
        );

    backdrop-filter:blur(10px);
}

.logo{

    display:flex;

    align-items:center;

    gap:9px;

    font-size:24px;

    font-weight:800;

    letter-spacing:-1px;
}

.logo-icon{

    width:39px;
    height:39px;

    border-radius:11px;

    background:
        linear-gradient(
            135deg,
            #8b35ff,
            #b66cff
        );

    display:flex;

    align-items:center;

    justify-content:center;

    box-shadow:
        0 5px 20px
        rgba(139,53,255,.35);
}

.logo-icon::after{

    content:"";

    width:0;
    height:0;

    border-top:8px solid transparent;
    border-bottom:8px solid transparent;
    border-left:13px solid white;

    margin-left:3px;
}

.logo span{
    color:#a855f7;
}


/* =====================================================
   PESQUISA
===================================================== */

.header-search{

    width:42px;
    height:42px;

    border:1px solid #292929;

    background:#151515;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    color:white;

    cursor:pointer;
}

.header-search svg{

    width:22px;
    height:22px;

    stroke:white;

    fill:none;

    stroke-width:2;

    stroke-linecap:round;

    stroke-linejoin:round;
}


/* =====================================================
   CONTEÚDO
===================================================== */

#home-content{

    width:100%;

    overflow:hidden;
}

.home-loading{

    padding:60px 20px;

    text-align:center;

    color:#777;

    font-size:14px;
}


/* =====================================================
   SECÇÕES
===================================================== */

.anime-section{

    margin-bottom:29px;
}

.section-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 15px;

    margin-bottom:13px;
}

.section-title{

    font-size:20px;

    font-weight:750;

    letter-spacing:-.3px;
}

.section-more{

    color:#777;

    font-size:12px;

    cursor:pointer;
}


/* =====================================================
   LISTA HORIZONTAL
===================================================== */

.anime-list{

    display:flex;

    gap:11px;

    overflow-x:auto;

    padding:0 15px 6px;

    scrollbar-width:none;

    scroll-behavior:smooth;
}

.anime-list::-webkit-scrollbar{
    display:none;
}


/* =====================================================
   CARD
===================================================== */

.anime-card{

    width:108px;

    flex:0 0 108px;

    cursor:pointer;

    position:relative;
}

.anime-poster{

    width:108px;

    height:155px;

    border-radius:9px;

    overflow:hidden;

    background:#151515;

    box-shadow:
        0 5px 15px
        rgba(0,0,0,.45);

    position:relative;
}

.anime-poster img{

    width:100%;

    height:100%;

    object-fit:cover;

    display:block;

    transition:
        transform .25s ease;
}

.anime-card:active
.anime-poster img{

    transform:scale(.96);
}

.anime-name{

    margin-top:8px;

    font-size:13px;

    color:#eee;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.anime-score{

    position:absolute;

    top:7px;

    left:7px;

    padding:4px 6px;

    border-radius:5px;

    background:
        rgba(0,0,0,.80);

    font-size:10px;

    color:#fff;

    z-index:2;
}


/* =====================================================
   DESTAQUE
===================================================== */

.feature-section{

    margin:5px 15px 30px;
}

.feature-card{

    height:205px;

    border-radius:15px;

    overflow:hidden;

    position:relative;

    background:#151515;

    cursor:pointer;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.5);
}

.feature-card img{

    width:100%;

    height:100%;

    object-fit:cover;

    display:block;
}

.feature-gradient{

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.90),
            rgba(0,0,0,.48),
            rgba(0,0,0,.05)
        );
}

.feature-info{

    position:absolute;

    left:18px;

    bottom:18px;

    right:20px;
}

.feature-tag{

    display:inline-block;

    background:#a855f7;

    padding:5px 8px;

    border-radius:5px;

    font-size:9px;

    font-weight:bold;

    margin-bottom:7px;
}

.feature-title{

    font-size:22px;

    font-weight:800;

    max-width:70%;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.feature-sub{

    color:#ccc;

    font-size:12px;

    margin-top:5px;
}


/* =====================================================
   SKELETON
===================================================== */

.skeleton{

    width:108px;

    height:155px;

    flex:0 0 108px;

    border-radius:9px;

    background:
        linear-gradient(
            90deg,
            #121212 25%,
            #1d1d1d 50%,
            #121212 75%
        );

    background-size:200% 100%;

    animation:
        skeleton 1.3s infinite;
}

@keyframes skeleton{

    from{
        background-position:200% 0;
    }

    to{
        background-position:-200% 0;
    }

}


/* =====================================================
   VAZIO / ERRO
===================================================== */

.section-empty{

    padding:10px 15px;

    color:#666;

    font-size:13px;
}


/* =====================================================
   NAVEGAÇÃO
===================================================== */

.bottom-nav{

    position:fixed;

    left:15px;

    right:15px;

    bottom:13px;

    height:72px;

    background:
        rgba(19,19,19,.96);

    border:1px solid #292929;

    border-radius:25px;

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    z-index:1000;

    box-shadow:
        0 8px 35px
        rgba(0,0,0,.65);

    backdrop-filter:blur(15px);
}

.nav-item{

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:5px;

    color:#707070;

    text-decoration:none;

    font-size:11px;
}

.nav-item svg{

    width:22px;
    height:22px;

    stroke:currentColor;

    fill:none;

    stroke-width:2;

    stroke-linecap:round;

    stroke-linejoin:round;
}

.nav-item.active{

    color:#fff;
}

.nav-item.active svg{

    stroke:#a855f7;

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .header{
        height:70px;
    }

    .logo{
        font-size:22px;
    }

        width:37px;

    }

    .anime-card{
        width:100px;
        flex-basis:100px;
    }

    .anime-poster{
        width:100px;
        height:145px;
    }

    .skeleton{
        width:100px;
        flex-basis:100px;
        height:145px;
    }

    .feature-card{
        height:190px;
    }

}

<script>

/* =====================================================
   TMDB
===================================================== */

const TMDB_API =
    "https://api.themoviedb.org/3";

/*
 * Chave TMDB fornecida por ti.
 */

const TMDB_API_KEY =
    "8e893942e01c23b312df265d558e27fc";


/*
 * Idioma da informação apresentada.
 */

const TMDB_LANGUAGE =
    "pt-BR";


/*
 * URL das imagens TMDB.
 *
 * O TMDB utiliza poster_path/backdrop_path
 * juntamente com o seu CDN de imagens.
 */

const TMDB_IMAGE =
    "https://image.tmdb.org/t/p/";


/* =====================================================
   ELEMENTO PRINCIPAL
===================================================== */

const home =
    document.getElementById(
        "home-content"
    );


/* =====================================================
   PESQUISA
===================================================== */

function abrirPesquisa(){

    window.location.href =
        "pesquisar.html";

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escaparHTML(texto){

    if(!texto){
        return "";
    }

    return String(texto)

        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   IMAGEM POSTER
===================================================== */

function tmdbPoster(item){

    if(
        !item ||
        !item.poster_path
    ){

        return "";

    }

    return (
        TMDB_IMAGE +
        "w500" +
        item.poster_path
    );

}


/* =====================================================
   IMAGEM BANNER
===================================================== */

function tmdbBackdrop(item){

    if(
        !item ||
        !item.backdrop_path
    ){

        return tmdbPoster(item);

    }

    return (
        TMDB_IMAGE +
        "w1280" +
        item.backdrop_path
    );

}


/* =====================================================
   TÍTULO
===================================================== */

function tmdbTitulo(item){

    return (

        item.name ||

        item.original_name ||

        "Anime"

    );

}


/* =====================================================
   NOTA
===================================================== */

function tmdbNota(item){

    if(
        typeof item.vote_average !==
        "number"
    ){

        return "N/A";

    }

    return item
        .vote_average
        .toFixed(1);

}


/* =====================================================
   ANO
===================================================== */

function tmdbAno(item){

    const data =
        item.first_air_date || "";

    if(!data){
        return "";
    }

    return data.substring(0,4);

}


/* =====================================================
   ABRIR ANIME
===================================================== */

function abrirAnime(id){

    if(!id){
        return;
    }

    window.location.href =
        "detalhes.html?id=" +
        encodeURIComponent(id);

}


/* =====================================================
   SKELETONS
===================================================== */

function criarSkeletons(){

    return Array

        .from(
            {length:6},
            () =>
                `<div class="skeleton"></div>`
        )

        .join("");

}


/* =====================================================
   REQUISIÇÃO TMDB
===================================================== */

async function tmdbAPI(
    endpoint,
    tentativas = 2
){

    const separador =
        endpoint.includes("?")
            ? "&"
            : "?";


    const url =
        TMDB_API +
        endpoint +
        separador +
        "api_key=" +
        encodeURIComponent(
            TMDB_API_KEY
        ) +
        "&language=" +
        encodeURIComponent(
            TMDB_LANGUAGE
        );


    for(
        let tentativa = 1;
        tentativa <= tentativas;
        tentativa++
    ){

        try{

            const resposta =
                await fetch(url);


            if(
                resposta.status === 429
            ){

                /*
                 * Espera antes de tentar
                 * novamente.
                 */

                await esperar(
                    1200 * tentativa
                );

                continue;

            }


            if(
                !resposta.ok
            ){

                throw new Error(
                    "TMDB HTTP " +
                    resposta.status
                );

            }


            const json =
                await resposta.json();


            return (
                Array.isArray(
                    json.results
                )
                ?
                json.results
                :
                []
            );

        }

        catch(erro){

            if(
                tentativa ===
                tentativas
            ){

                console.error(
                    "TMDB:",
                    erro
                );

                return [];

            }

            await esperar(700);

        }

    }


    return [];

}


/* =====================================================
   ESPERA
===================================================== */

function esperar(ms){

    return new Promise(
        resolver =>
            setTimeout(
                resolver,
                ms
            )
    );

}

 <script>

/* =====================================================
   CRIAR CARD
===================================================== */

function criarCard(anime){

    if(
        !anime ||
        !anime.id
    ){

        return "";

    }


    const imagem =
        tmdbPoster(anime);


    if(!imagem){

        return "";

    }


    const titulo =
        tmdbTitulo(anime);


    const nota =
        tmdbNota(anime);


    return `

        <article
            class="anime-card"
            onclick="abrirAnime(${anime.id})">

            <div class="anime-poster">

                <img
                    src="${imagem}"
                    alt="${escaparHTML(titulo)}"
                    loading="lazy">

                ${
                    nota !== "N/A"
                    ?
                    `
                    <div class="anime-score">

                        ★ ${nota}

                    </div>
                    `
                    :
                    ""
                }

            </div>

            <div class="anime-name">

                ${escaparHTML(titulo)}

            </div>

        </article>

    `;

}


/* =====================================================
   CRIAR SECÇÃO
===================================================== */

function criarSecao(
    titulo,
    lista
){

    const animes =
        Array.isArray(lista)
            ? lista
            : [];


    const cards =
        animes

            .map(criarCard)

            .filter(Boolean)

            .join("");


    if(!cards){

        return "";

    }


    return `

        <section
            class="anime-section">

            <div
                class="section-header">

                <div
                    class="section-title">

                    ${escaparHTML(titulo)}

                </div>

                <div
                    class="section-more">

                    Ver tudo

                </div>

            </div>


            <div
                class="anime-list">

                ${cards}

            </div>

        </section>

    `;

}


/* =====================================================
   CARREGAR SECÇÃO
===================================================== */

async function carregarSecao(
    titulo,
    endpoint
){

    const id =
        "secao-" +
        Math.random()
            .toString(36)
            .substring(2);


    home.insertAdjacentHTML(

        "beforeend",

        `

        <section
            class="anime-section"
            id="${id}">

            <div
                class="section-header">

                <div
                    class="section-title">

                    ${escaparHTML(titulo)}

                </div>

            </div>


            <div
                class="anime-list">

                ${criarSkeletons()}

            </div>

        </section>

        `

    );


    const elemento =
        document.getElementById(id);


    const dados =
        await tmdbAPI(endpoint);


    if(!dados.length){

        elemento.remove();

        return;

    }


    const html =
        criarSecao(
            titulo,
            dados
        );


    if(html){

        elemento.outerHTML =
            html;

    }
    else{

        elemento.remove();

    }

}


/* =====================================================
   DESTAQUE
===================================================== */

async function carregarDestaque(){

    const dados =
        await tmdbAPI(

            "/discover/tv" +
            "?with_genres=16" +
            "&with_original_language=ja" +
            "&sort_by=popularity.desc" +
            "&vote_count.gte=20" +
            "&page=1"

        );


    if(!dados.length){

        return;

    }


    const anime =
        dados.find(
            item =>
                item.backdrop_path &&
                item.poster_path
        )
        ||
        dados[0];


    const imagem =
        tmdbBackdrop(anime);


    const titulo =
        tmdbTitulo(anime);


    if(!imagem){

        return;

    }


    const nota =
        tmdbNota(anime);


    home.insertAdjacentHTML(

        "afterbegin",

        `

        <section
            class="feature-section">

            <div
                class="feature-card"
                onclick="abrirAnime(${anime.id})">

                <img
                    src="${imagem}"
                    alt="${escaparHTML(titulo)}">

                <div
                    class="feature-gradient">
                </div>


                <div
                    class="feature-info">

                    <div
                        class="feature-tag">

                        EM DESTAQUE

                    </div>


                    <div
                        class="feature-title">

                        ${escaparHTML(titulo)}

                    </div>


                    <div
                        class="feature-sub">

                        ${
                            nota !== "N/A"
                            ?
                            "Nota " + nota + "/10"
                            :
                            "Descubra este anime"
                        }

                    </div>

                </div>

            </div>

        </section>

        `

    );

}

/* =====================================================
   CONSTRUIR HOME
===================================================== */

async function construirHome(){

    home.innerHTML = "";


    /*
     * Mostra primeiro o destaque.
     */

    carregarDestaque();


    /*
     * Criamos todas as secções com skeletons
     * imediatamente.
     */

    const elementos =
        secoesTMDB.map(
            secao => {

                const id =
                    "tmdb-" +
                    Math.random()
                        .toString(36)
                        .substring(2);


                home.insertAdjacentHTML(

                    "beforeend",

                    `

                    <section
                        class="anime-section"
                        id="${id}">

                        <div
                            class="section-header">

                            <div
                                class="section-title">

                                ${escaparHTML(
                                    secao.titulo
                                )}

                            </div>

                        </div>

                        <div
                            class="anime-list">

                            ${criarSkeletons()}

                        </div>

                    </section>

                    `

                );


                return {
                    ...secao,
                    id
                };

            }
        );


    /*
     * Todas as requisições começam juntas,
     * mas Promise.allSettled impede que uma falha
     * derrube as outras.
     */

    const resultados =
        await Promise.allSettled(

            elementos.map(
                secao =>
                    tmdbAPI(
                        secao.endpoint
                    )
            )

        );


    resultados.forEach(
        (
            resultado,
            indice
        ) => {

            const secao =
                elementos[indice];


            const elemento =
                document.getElementById(
                    secao.id
                );


            if(!elemento){

                return;

            }


            if(
                resultado.status !==
                "fulfilled"
            ){

                elemento.remove();

                return;

            }


            const dados =
                resultado.value;


            if(
                !Array.isArray(dados) ||
                !dados.length
            ){

                elemento.remove();

                return;

            }


            const html =
                criarSecao(
                    secao.titulo,
                    dados
                );


            if(html){

                elemento.outerHTML =
                    html;

            }
            else{

                elemento.remove();

            }

        }
    );

}


/* =====================================================
   INICIAR
===================================================== */

document.addEventListener(

    "DOMContentLoaded",

    function(){

        construirHome();

    }

);
