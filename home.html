<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>PlayNime</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#080808;
    color:#fff;
    min-height:100vh;
    padding-bottom:105px;
}

/* =========================
   TOPO
========================= */

.header{
    height:70px;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    width:44px;
    height:44px;
    border-radius:13px;
    overflow:hidden;
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.header-icons{
    display:flex;
    gap:10px;
}

.header-btn{
    width:42px;
    height:42px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#151515;
    border:1px solid #242424;
}

.header-btn svg{
    width:22px;
    height:22px;
    stroke:#fff;
    fill:none;
    stroke-width:2;
}

/* =========================
   TÍTULOS
========================= */

.section-title{
    font-size:21px;
    font-weight:700;
    margin:22px 16px 12px;
}

/* =========================
   LISTA DE ANIMES
========================= */

.anime-list{
    display:flex;
    gap:11px;
    overflow-x:auto;
    padding:0 16px;
    scrollbar-width:none;
}

.anime-list::-webkit-scrollbar{
    display:none;
}

.anime-card{
    min-width:105px;
    width:105px;
    height:150px;
    border-radius:10px;
    overflow:hidden;
    background:#151515;
    flex-shrink:0;
}

.anime-card img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* =========================
   BARRA DE NAVEGAÇÃO
========================= */

.bottom-nav{
    position:fixed;
    left:12px;
    right:12px;
    bottom:12px;

    height:70px;

    background:rgba(20,20,20,.96);

    border:1px solid #292929;

    border-radius:22px;

    display:flex;
    align-items:center;
    justify-content:space-around;

    box-shadow:
        0 8px 30px rgba(0,0,0,.65);

    backdrop-filter:blur(14px);

    z-index:1000;
}

.nav-item{
    flex:1;
    height:100%;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:5px;

    color:#777;

    font-size:11px;

    cursor:pointer;

    transition:.2s;
}

.nav-item svg{
    width:22px;
    height:22px;

    stroke:currentColor;
    fill:none;

    stroke-width:2;

    stroke-linecap:round;
    stroke-linejoin:round;
}

.nav-item.active{
    color:#fff;
}

.nav-item:active{
    transform:scale(.92);
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .anime-card{
        min-width:92px;
        width:92px;
        height:132px;
    }

    .section-title{
        font-size:20px;
    }

    .bottom-nav{
        left:10px;
        right:10px;
        bottom:10px;
        height:68px;
        border-radius:21px;
    }
}

</style>
</head>

<body>

<!-- =========================
     TOPO
========================= -->

<header class="header">

    <div class="logo">

        <img
            src="PlayNime_logo.jpg"
            alt="PlayNime">

    </div>

    <div class="header-icons">

        <div class="header-btn">

            <svg viewBox="0 0 24 24">

                <circle
                    cx="11"
                    cy="11"
                    r="6">
                </circle>

                <path d="M16 16l5 5"></path>

            </svg>

        </div>

    </div>

</header>


<!-- =========================
     CONTEÚDO
========================= -->

<main id="homeContent">

    <section>

        <h2 class="section-title">
            Em alta
        </h2>

        <div class="anime-list">

            <div class="anime-card">
                <img src="https://cdn.myanimelist.net/images/anime/1286/99889l.jpg">
            </div>

            <div class="anime-card">
                <img src="https://cdn.myanimelist.net/images/anime/1079/138100l.jpg">
            </div>

            <div class="anime-card">
                <img src="https://cdn.myanimelist.net/images/anime/5/65187l.jpg">
            </div>

            <div class="anime-card">
                <img src="https://cdn.myanimelist.net/images/anime/1223/121999l.jpg">
            </div>

        </div>

    </section>


    <section>

        <h2 class="section-title">
            Lançamentos
        </h2>

        <div class="anime-list">

            <div class="anime-card">
                <img src="https://cdn.myanimelist.net/images/anime/1286/99889l.jpg">
            </div>

            <div class="anime-card">
                <img src="https://cdn.myanimelist.net/images/anime/1079/138100l.jpg">
            </div>

            <div class="anime-card">
                <img src="https://cdn.myanimelist.net/images/anime/5/65187l.jpg">
            </div>

        </div>

    </section>

</main>


<!-- =========================
     NAVEGAÇÃO
========================= -->

<nav class="bottom-nav">

    <!-- INÍCIO -->

    <div
        class="nav-item active"
        onclick="window.location.href='home.html'">

        <svg viewBox="0 0 24 24">

            <path d="M3 11l9-8 9 8"></path>

            <path d="M5 10v10h14V10"></path>

        </svg>

        <span>Início</span>

    </div>


    <!-- PESQUISAR -->

    <div
        class="nav-item"
        onclick="window.location.href='pesquisar.html'">

        <svg viewBox="0 0 24 24">

            <circle
                cx="11"
                cy="11"
                r="6">
            </circle>

            <path d="M16 16l5 5"></path>

        </svg>

        <span>Pesquisar</span>

    </div>


    <!-- FAVORITOS -->

    <div
        class="nav-item"
        onclick="window.location.href='favoritos.html'">

        <svg viewBox="0 0 24 24">

            <path d="
                M20.8 8.6
                c0 5.5-8.8 11-8.8 11
                S3.2 14.1 3.2 8.6
                A4.6 4.6 0 0 1 12 6.4
                a4.6 4.6 0 0 1 8.8 2.2z">
            </path>

        </svg>

        <span>Favoritos</span>

    </div>


    <!-- MAIS -->

    <div
        class="nav-item"
        onclick="window.location.href='mais.html'">

        <svg viewBox="0 0 24 24">

            <circle
                cx="5"
                cy="12"
                r="1">
            </circle>

            <circle
                cx="12"
                cy="12"
                r="1">
            </circle>

            <circle
                cx="19"
                cy="12"
                r="1">
            </circle>

        </svg>

        <span>Mais</span>

    </div>

</nav>

</body>
</html>
