<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PlayNime - Perfil</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
body{background:#070707;color:#fff;min-height:100vh;padding-bottom:40px}
.header{height:56px;display:flex;align-items:center;padding:0 16px;gap:16px;position:sticky;top:0;background:#070707;z-index:10}
.back{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none}
.back svg{width:24px;height:24px}
.title{font-size:20px;font-weight:600}
.content{padding:20px 18px}
.avatar-box{text-align:center;margin-bottom:30px}
.avatar{width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg,#9b4dff,#6b2fd9);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;overflow:hidden;border:3px solid #9b4dff;position:relative}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar-placeholder{font-size:42px;color:#fff}
.change-photo{margin-top:10px;font-size:14px;color:#a855f7;cursor:pointer;display:inline-block}
.name{font-size:22px;font-weight:700;margin-bottom:4px}
.email{color:#888;font-size:14px}
.section{margin-top:28px}
.section-title{font-size:13px;color:#666;text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px}
.card{background:#121212;border:1px solid #232323;border-radius:16px;padding:16px;margin-bottom:12px}
.card label{display:block;font-size:13px;color:#888;margin-bottom:6px}
.card input{width:100%;height:48px;background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:0 14px;color:#fff;font-size:15px;outline:none}
.card input:focus{border-color:#9b4dff}
.btn{width:100%;height:52px;border-radius:14px;font-size:16px;font-weight:600;border:none;cursor:pointer;margin-top:10px}
.btn-save{background:linear-gradient(135deg,#9b4dff,#7c3aed);color:#fff}
.btn-logout{background:transparent;border:1px solid #ff4d6d;color:#ff4d6d;margin-top:24px}
.message{text-align:center;margin-top:12px;font-size:14px;min-height:20px}
#fileInput{display:none}
</style>
</head>
<body>

<header class="header">
  <a href="mais.html" class="back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
  </a>
  <div class="title">Meu Perfil</div>
</header>

<main class="content">
  <div class="avatar-box">
    <div class="avatar" id="avatar">
      <span class="avatar-placeholder">👤</span>
    </div>
    <div class="change-photo" onclick="document.getElementById('fileInput').click()">Mudar foto</div>
    <input type="file" id="fileInput" accept="image/*">
    <div class="name" id="displayName">Carregando...</div>
    <div class="email" id="userEmail"></div>
  </div>

  <div class="section">
    <div class="section-title">Editar perfil</div>
    <div class="card">
      <label>Username</label>
      <input type="text" id="nomeInput" placeholder="Seu nome de usuário">
    </div>
    <button class="btn btn-save" onclick="salvarPerfil()">Salvar alterações</button>
    <div class="message" id="message"></div>
  </div>

  <button class="btn btn-logout" onclick="sair()">Terminar sessão</button>
</main>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCOjDokkcdI2-upQMZa5BwOlCbCqUrtmPY",
  authDomain: "playnime-aca11.firebaseapp.com",
  projectId: "playnime-aca11",
  storageBucket: "playnime-aca11.firebasestorage.app",
  messagingSenderId: "397199669163",
  appId: "1:397199669163:web:7273fc848f9a50aead04ee"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

let novaFotoBase64 = null;

auth.onAuthStateChanged(user => {
  if (!user) {
    location.href = "welcome.html";
    return;
  }

  document.getElementById("displayName").textContent = user.displayName || "Utilizador";
  document.getElementById("userEmail").textContent = user.email || "";
  document.getElementById("nomeInput").value = user.displayName || "";

  if (user.photoURL) {
    document.getElementById("avatar").innerHTML = `<img src="${user.photoURL}" alt="foto">`;
  }
});

// Mudar foto (preview local)
document.getElementById("fileInput").addEventListener("change", function(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(event) {
    novaFotoBase64 = event.target.result;
    document.getElementById("avatar").innerHTML = `<img src="${novaFotoBase64}" alt="foto">`;
  };
  reader.readAsDataURL(file);
});

async function salvarPerfil() {
  const user = auth.currentUser;
  if (!user) return;

  const nome = document.getElementById("nomeInput").value.trim();
  const message = document.getElementById("message");

  message.style.color = "#a855f7";
  message.textContent = "A guardar...";

  try {
    const updates = { displayName: nome || null };
    
    // Se escolheu nova foto, usa o base64 (funciona como preview)
    // Nota: para produção o ideal é Firebase Storage
    if (novaFotoBase64) {
      updates.photoURL = novaFotoBase64;
    }

    await user.updateProfile(updates);

    document.getElementById("displayName").textContent = nome || "Utilizador";
    message.style.color = "#4ade80";
    message.textContent = "Perfil atualizado!";
  } catch (error) {
    message.style.color = "#ff6b81";
    message.textContent = "Erro: " + error.message;
  }
}

function sair() {
  auth.signOut().then(() => {
    location.href = "welcome.html";
  });
}
</script>
</body>
  </html>
