<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>PlayNime</title><style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#05020a;

}

/* =====================================================
   SPLASH
===================================================== */

.splash{

    width:100%;
    height:100vh;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at center,
            #241044 0%,
            #10051d 40%,
            #05020a 75%,
            #000000 100%
        );

}

/* =====================================================
   LOGO
===================================================== */

.logo{

    width:125px;
    height:125px;

    border-radius:30px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            145deg,
            #b45cff,
            #8b32ff 50%,
            #5b16c9
        );

    box-shadow:

        0 0 30px
        rgba(168,85,247,.55),

        0 0 70px
        rgba(124,58,237,.25);

    animation:

        aparecer .8s
        cubic-bezier(.2,.8,.2,1);

}

/* =====================================================
   BOTÃO PLAY
===================================================== */

.play{

    width:0;
    height:0;

    border-top:
        28px solid transparent;

    border-bottom:
        28px solid transparent;

    border-left:
        44px solid white;

    margin-left:9px;

    filter:
        drop-shadow(
            0 0 8px
            rgba(255,255,255,.8)
        );

}

/* =====================================================
   ANIMAÇÃO
===================================================== */

@keyframes aparecer{

    0%{

        opacity:0;

        transform:
            scale(.65)
            rotate(-8deg);

    }

    70%{

        transform:
            scale(1.04)
            rotate(1deg);

    }

    100%{

        opacity:1;

        transform:
            scale(1)
            rotate(0);

    }

}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .logo{

        width:115px;
        height:115px;

        border-radius:28px;

    }

    .play{

        border-top-width:25px;

        border-bottom-width:25px;

        border-left-width:40px;

    }

}

</style></head><body><div class="splash"><div class="logo">

    <div class="play"></div>

</div>

</div><script>

/*
 * Splash durante 2 segundos.
 * Depois abre o login.
 */

setTimeout(function(){

    window.location.href =
        "login.html";

},3000);

</script></body></html>
