<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PlayNime - Notificações</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
body{background:#000;color:#fff;min-height:100vh}
.header{height:56px;display:flex;align-items:center;padding:0 16px;gap:16px;position:sticky;top:0;background:#000}
.back{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none}
.back svg{width:24px;height:24px}
.title{font-size:20px;font-weight:600}
.content{padding:20px}
.card{background:#121212;border:1px solid #222;border-radius:16px;padding:18px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:16px;font-weight:500}
.card-sub{font-size:13px;color:#888;margin-top:3px}
.toggle{position:relative;width:46px;height:28px}
.toggle input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#333;border-radius:28px;transition:.25s}
.slider:before{position:absolute;content:"";height:22px;width:22px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.25s}
input:checked + .slider{background:#9b4dff}
input:checked + .slider:before{transform:translateX(18px)}
</style>
</head>
<body>
<header class="header">
    <a href="configuracoes.html" class="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg></a>
    <div class="title">Notificações</div>
</header>
<main class="content">
    <div class="card">
        <div>
            <div class="card-title">Novos episódios</div>
            <div class="card-sub">Receber alerta quando sair episódio novo</div>
        </div>
        <label class="toggle"><input type="checkbox" checked><span class="slider"></span></label>
    </div>
    <div class="card">
        <div>
            <div class="card-title">Atualizações do app</div>
            <div class="card-sub">Notificar sobre novas versões</div>
        </div>
        <label class="toggle"><input type="checkbox" checked><span class="slider"></span></label>
    </div>
</main>
</body>
</html>
